name: Groq Diagnostic

on:
  push:
    paths:
      - ".github/workflows/ai-provider-smoke-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  groq-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - name: Check secret presence
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "GROQ_API_KEY missing"
            exit 1
          fi
          echo "GROQ_API_KEY present"

      - name: Test Groq with curl
        shell: bash
        run: |
          set +e
          code=$(curl -sS -o /tmp/groq_body.txt -D /tmp/groq_headers.txt -w "%{http_code}" \
            https://api.groq.com/openai/v1/chat/completions \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            --data '{"model":"qwen/qwen3.8-27b","messages":[{"role":"user","content":"Reply with exactly OK"}],"max_completion_tokens":8,"temperature":0}')
          echo "curl_http_status=$code"
          echo "content_type=$(grep -i '^content-type:' /tmp/groq_headers.txt | tail -1 | tr -d '\r' | cut -d' ' -f2-)"
          echo "cf_error_type=$(grep -i '^cf-error-type:' /tmp/groq_headers.txt | tail -1 | tr -d '\r' | cut -d' ' -f2-)"
          python3 - <<'PY'
          import json
          body=open("/tmp/groq_body.txt","r",encoding="utf-8",errors="replace").read()
          try:
              data=json.loads(body)
              if data.get("choices"):
                  print("curl_result=PASS")
              else:
                  err=data.get("error",{})
                  print("curl_result=FAIL")
                  print("curl_error_type="+str(err.get("type","")))
                  print("curl_error_code="+str(err.get("code","")))
                  print("curl_error_message="+str(err.get("message",""))[:250])
          except Exception:
              print("curl_result=FAIL_NON_JSON")
              print("curl_body_prefix="+body[:120].replace("\n"," "))
          PY

      - name: Test Groq official SDK
        shell: bash
        run: |
          python3 -m pip install -q "groq>=0.31,<1"
          python3 - <<'PY'
          import os
          from groq import Groq
          try:
              client=Groq(api_key=os.environ["GROQ_API_KEY"], timeout=40.0)
              r=client.chat.completions.create(
                  model="qwen/qwen3.8-27b",
                  messages=[{"role":"user","content":"Reply with exactly OK"}],
                  max_completion_tokens=8,
                  temperature=0,
              )
              print("sdk_result=PASS" if r.choices else "sdk_result=FAIL_NO_CHOICES")
          except Exception as e:
              print("sdk_result=FAIL")
              print("sdk_error_type="+type(e).__name__)
              status=getattr(e,"status_code",None)
              if status is not None:
                  print("sdk_http_status="+str(status))
              body=getattr(e,"body",None)
              if isinstance(body,dict):
                  err=body.get("error",body)
                  if isinstance(err,dict):
                      print("sdk_api_type="+str(err.get("type","")))
                      print("sdk_api_code="+str(err.get("code","")))
                      print("sdk_api_message="+str(err.get("message",""))[:250])
              else:
                  print("sdk_error="+str(e)[:250])
          PY
