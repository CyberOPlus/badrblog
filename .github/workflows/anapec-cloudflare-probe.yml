name: ANAPEC Cloudflare Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/anapec-cloudflare-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"

      - name: Probe ANAPEC with Cloudflare Browser Rendering
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/browser-rendering/content"
          python - <<'PY'
          import json, os, subprocess, sys

          api = "https://api.cloudflare.com/client/v4/accounts/" + os.environ["CLOUDFLARE_ACCOUNT_ID"] + "/browser-rendering/content"
          token = os.environ["CLOUDFLARE_API_TOKEN"]
          targets = [
              "https://www.anapec.org/sigec-app-rv/chercheurs/resultat_recherche/tout:all",
              "https://www.anapec.ma/sigec-app-rv/chercheurs/resultat_recherche/tout:all",
          ]
          successes = 0
          for target in targets:
              payload = json.dumps({
                  "url": target,
                  "gotoOptions": {"waitUntil": "domcontentloaded", "timeout": 15000},
              })
              proc = subprocess.run(
                  [
                      "curl", "-sS", "--max-time", "25",
                      "-H", "Content-Type: application/json",
                      "-H", f"Authorization: Bearer {token}",
                      "-d", payload,
                      api,
                  ],
                  capture_output=True,
                  text=True,
                  timeout=30,
              )
              raw = proc.stdout or ""
              try:
                  data = json.loads(raw)
              except Exception:
                  print(f"{target} invalid_json curl_rc={proc.returncode} body={raw[:240]!r}")
                  continue
              result = data.get("result") or ""
              errors = data.get("errors") or []
              meta = data.get("meta") or {}
              ok = bool(data.get("success")) and isinstance(result, str) and len(result) > 100
              print(
                  f"{target} success={data.get('success')} chars={len(result) if isinstance(result,str) else 0} "
                  f"status={meta.get('status','')} final={meta.get('finalUrl','')} "
                  f"errors={json.dumps(errors, ensure_ascii=False)[:300]}"
              )
              if ok:
                  successes += 1
          if successes == 0:
              raise SystemExit("Cloudflare Browser Rendering could not fetch either ANAPEC endpoint")
          PY
