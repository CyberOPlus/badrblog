name: ANAPEC Network Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/anapec-network-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    name: Probe ANAPEC on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Probe official ANAPEC hosts
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import shutil
          import subprocess
          import tempfile
          import time
          from pathlib import Path

          urls = [
              "https://www.anapec.org/sigec-app-rv/chercheurs/resultat_recherche/tout:all",
              "https://www.anapec.ma/sigec-app-rv/chercheurs/resultat_recherche/tout:all",
          ]
          curl = shutil.which("curl") or shutil.which("curl.exe")
          rows = []
          for url in urls:
              started = time.perf_counter()
              body_path = Path(tempfile.mkstemp(prefix="anapec-body-", suffix=".html")[1])
              try:
                  if not curl:
                      rows.append({
                          "url": url,
                          "ok": False,
                          "status": 0,
                          "chars": 0,
                          "elapsed_ms": 0,
                          "error": "curl unavailable",
                      })
                      continue
                  command = [
                      curl,
                      "--silent",
                      "--show-error",
                      "--location",
                      "--ipv4",
                      "--http1.1",
                      "--connect-timeout",
                      "5",
                      "--max-time",
                      "10",
                      "--header",
                      "User-Agent: Mozilla/5.0",
                      "--header",
                      "Accept-Language: fr-FR,fr;q=0.9,ar;q=0.8",
                      "--output",
                      str(body_path),
                      "--write-out",
                      "%{http_code}",
                      url,
                  ]
                  result = subprocess.run(
                      command,
                      check=False,
                      capture_output=True,
                      text=True,
                      timeout=12,
                  )
                  try:
                      status = int((result.stdout or "").strip() or 0)
                  except ValueError:
                      status = 0
                  chars = body_path.stat().st_size if body_path.exists() else 0
                  rows.append({
                      "url": url,
                      "ok": result.returncode == 0 and 200 <= status < 400 and chars > 0,
                      "status": status,
                      "chars": chars,
                      "elapsed_ms": round((time.perf_counter() - started) * 1000),
                      "returncode": result.returncode,
                      "error": (result.stderr or "").strip()[:300],
                  })
              except Exception as exc:
                  rows.append({
                      "url": url,
                      "ok": False,
                      "status": 0,
                      "chars": 0,
                      "elapsed_ms": round((time.perf_counter() - started) * 1000),
                      "error": f"{type(exc).__name__}: {exc}"[:300],
                  })
              finally:
                  try:
                      body_path.unlink(missing_ok=True)
                  except Exception:
                      pass

          runner_os = os.getenv("RUNNER_OS", "unknown").lower()
          output = {
              "runner_os": os.getenv("RUNNER_OS", ""),
              "runner_arch": os.getenv("RUNNER_ARCH", ""),
              "github_run_id": os.getenv("GITHUB_RUN_ID", ""),
              "results": rows,
          }
          Path(f"probe-{runner_os}.json").write_text(
              json.dumps(output, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(output, ensure_ascii=False, indent=2))
          PY

      - name: Upload probe result
        uses: actions/upload-artifact@v4
        with:
          name: anapec-probe-${{ runner.os }}
          path: probe-*.json
          retention-days: 2

  aggregate:
    name: Persist ANAPEC probe summary
    needs: probe
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Download probe results
        uses: actions/download-artifact@v4
        with:
          pattern: anapec-probe-*
          path: probe-results
          merge-multiple: true

      - name: Build summary
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          rows = []
          for path in sorted(Path("probe-results").glob("probe-*.json")):
              try:
                  rows.append(json.loads(path.read_text(encoding="utf-8")))
              except Exception as exc:
                  rows.append({"file": str(path), "error": f"{type(exc).__name__}: {exc}"})

          summary = {
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "purpose": "One-shot GitHub-hosted runner reachability check for official ANAPEC endpoints.",
              "probes": rows,
          }
          target = Path("data/anapec_network_probe.json")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Persist summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/anapec_network_probe.json
          if git diff --cached --quiet; then
            echo "No probe summary changes."
            exit 0
          fi
          git commit -m "Record ANAPEC runner reachability [skip ci]"
          for attempt in 1 2 3 4 5 6; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::Could not persist ANAPEC probe summary."
          exit 1
