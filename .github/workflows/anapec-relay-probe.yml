name: ANAPEC Relay Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/anapec-relay-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe ANAPEC via read-only HTML relay
        shell: bash
        run: |
          set -euo pipefail
          success=0
          for target in \
            "https://www.anapec.org/sigec-app-rv/chercheurs/resultat_recherche/tout:all" \
            "https://www.anapec.ma/sigec-app-rv/chercheurs/resultat_recherche/tout:all"
          do
            relay="https://r.jina.ai/$target"
            body="$(mktemp)"
            echo "=== $target ==="
            code="$(
              curl -sS -L --max-time 45 \
                -H "X-Respond-With: html" \
                -H "X-No-Cache: true" \
                -o "$body" -w "%{http_code}" "$relay" || true
            )"
            chars="$(wc -c < "$body" | tr -d ' ')"
            offers="$(grep -Eo 'bloc_offre_home/[0-9]+' "$body" | sort -u | wc -l | tr -d ' ')"
            echo "relay_http=$code chars=$chars official_offer_refs=$offers"
            head -c 320 "$body" | tr '\n' ' ' || true
            echo
            if [ "$code" = "200" ] && [ "$offers" -gt 0 ]; then
              success=1
              break
            fi
          done
          if [ "$success" -ne 1 ]; then
            echo "::error::Relay did not return recognizable official ANAPEC offer links."
            exit 1
          fi
