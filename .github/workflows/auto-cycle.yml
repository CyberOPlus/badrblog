name: Jobs Auto Cycle
# Continuous Jobs discovery/publishing; completion chaining, cron and watchdog
# recover independently when one trigger is delayed.

on:
  schedule:
    # Ten checks per hour. One verified Blogger article max per run; the
    # internal 5-minute pacing still prevents bursts.
    - cron: "1,7,13,19,25,31,37,43,49,55 * * * *"
  workflow_dispatch:
    inputs:
      verify:
        description: Run full regressions before production
        type: boolean
        default: false

concurrency:
  # Keep main's existing lock across upgrades; all entrypoints use the same one.
  group: jobs-production-refs/heads/main
  cancel-in-progress: false

env:
  JOBS_RUNTIME_PERSIST_BY_WORKFLOW: "true"

jobs:
  auto-cycle:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Capture Jobs run base
        run: echo "JOBS_RUN_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify publishing regressions
        # Full regressions are a manual/deployment check, not production-cycle work.
        # Scheduled runs must reach discovery/AI/Blogger quickly and repeatedly.
        if: github.event_name == 'workflow_dispatch' && inputs.verify
        run: |
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "$TEST_DIR"' EXIT
          cp -a . "$TEST_DIR/repo"
          cd "$TEST_DIR/repo"
          python -m unittest tests.test_jobs_core tests.test_job_visuals tests.test_jobs_runtime tests.test_state_io -q

      - name: Verify scheduled production smoke
        if: github.event_name == 'schedule' || !inputs.verify
        continue-on-error: true
        run: |
          TEST_DIR="$(mktemp -d)"
          trap 'rm -rf "$TEST_DIR"' EXIT
          cp -a . "$TEST_DIR/repo"
          cd "$TEST_DIR/repo"
          python -m py_compile \
            main.py scraper.py article_ai_processor.py article_draft_publisher.py \
            facebook_publisher.py quality_gate.py verified_fact_manifest.py
          python -m unittest \
            tests.test_jobs_core.JobsCoreTests.test_generic_tuple_discovery_identity_is_supported \
            tests.test_jobs_core.JobsCoreTests.test_discovery_seen_streak_stops_after_known_run \
            tests.test_jobs_core.JobsCoreTests.test_low_ranking_score_does_not_block_verified_job \
            tests.test_jobs_runtime.JobsRuntimeTests.test_jobs_deadline_cleanup_archives_expired_before_enrichment \
            tests.test_jobs_runtime.JobsRuntimeTests.test_stale_cached_results_are_archived_but_live_social_and_pdf_work_survives \
            tests.test_jobs_runtime.JobsRuntimeTests.test_ai_retry_backoff_preflight_makes_no_provider_call \
            tests.test_jobs_runtime.JobsRuntimeTests.test_document_render_retry_updates_same_blogger_post_without_ai \
            tests.test_jobs_runtime.JobsRuntimeTests.test_pending_facebook_runs_even_when_article_ai_fails \
            -q

      - name: Create runtime secrets and Jobs env
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_SECRET_JSON: ${{ secrets.BLOGGER_CLIENT_SECRET_JSON }}
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          JOBS_GOOGLE_INDEXING_ENABLED: ${{ secrets.JOBS_GOOGLE_INDEXING_ENABLED }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          secret_names = (
              "GEMINI_API_KEY",
              "OPENROUTER_API_KEY",
              "GROQ_API_KEY",
              "MISTRAL_API_KEY",
              "CLOUDFLARE_API_TOKEN",
              "CLOUDFLARE_ACCOUNT_ID",
              "BLOGGER_BLOG_ID",
              "BLOGGER_CLIENT_SECRET_JSON",
              "BLOGGER_TOKEN_JSON",
              "FACEBOOK_PAGE_ID",
              "FACEBOOK_PAGE_ACCESS_TOKEN",
              "GOOGLE_SERVICE_ACCOUNT_JSON",
          )
          for name in secret_names:
              value = os.environ.get(name, "")
              if value:
                  print(f"::add-mask::{value}")

          missing = [
              name for name in (
                  "BLOGGER_BLOG_ID",
                  "BLOGGER_CLIENT_SECRET_JSON",
                  "BLOGGER_TOKEN_JSON",
              )
              if not os.environ.get(name, "").strip()
          ]
          ai_provider_secret_present = any(
              os.environ.get(name, "").strip()
              for name in (
                  "GEMINI_API_KEY",
                  "GROQ_API_KEY",
                  "OPENROUTER_API_KEY",
                  "MISTRAL_API_KEY",
                  "CLOUDFLARE_API_TOKEN",
              )
          )
          if not ai_provider_secret_present:
              print(
                  "::warning::No AI provider secret is currently available; "
                  "Jobs AI generation will defer until a configured provider is available."
              )

          for name in ("BLOGGER_CLIENT_SECRET_JSON", "BLOGGER_TOKEN_JSON"):
              raw = os.environ.get(name, "").strip()
              if raw:
                  try:
                      json.loads(raw)
                  except json.JSONDecodeError:
                      print(f"::error::{name} is invalid JSON.")
                      sys.exit(1)

          if missing:
              print("::error::Missing required secrets: " + ", ".join(missing))
              sys.exit(1)

          Path("data").mkdir(exist_ok=True)
          Path("client_secret.json").write_text(
              os.environ["BLOGGER_CLIENT_SECRET_JSON"], encoding="utf-8"
          )
          Path("data/token.json").write_text(
              os.environ["BLOGGER_TOKEN_JSON"], encoding="utf-8"
          )

          env_lines = {
              "JOBS_MODE": "true",
              "JOBS_TEST_MODE": "false",
              "JOBS_EXPECTED_BLOG_HOST": "example.invalid",
              "JOBS_TIMEZONE": "Africa/Casablanca",
              "JOBS_MIN_SELECTION_SCORE": "65",
              "JOBS_QUEUE_SCORE": "50",
              "JOBS_URGENT_EXTRA_DAILY_LIMIT": "1",
              "JOBS_ADAPTIVE_PUBLISHING": "true",
              "JOBS_ADAPTIVE_MIN_DAILY_CAP": "240",
              "JOBS_ADAPTIVE_MAX_DAILY_CAP": "240",
              "JOBS_ACTIVE_START_HOUR": "0",
              "JOBS_ACTIVE_END_HOUR": "24",
              "JOBS_MIN_PUBLISH_INTERVAL_MINUTES": "5",
              "WHATSAPP_CHANNEL_URL": "https://whatsapp.com/channel/0029Vb7MdMfBVJl1kmmV4T0e",
              "GEMINI_API_KEY": os.environ.get("GEMINI_API_KEY", ""),
              "GEMINI_MODEL": "gemini-2.5-flash",
              "OPENROUTER_API_KEY": os.environ.get("OPENROUTER_API_KEY", ""),
              "OPENROUTER_MODEL": "openrouter/free",
              "OPENROUTER_MODELS": "openrouter/free",
              "OPENROUTER_APP_NAME": "Jobs Automation",
              "GROQ_API_KEY": os.environ.get("GROQ_API_KEY", ""),
              "GROQ_MODEL": "openai/gpt-oss-20b",
              "GROQ_TIMEOUT_SECONDS": "20",
              "MISTRAL_API_KEY": os.environ.get("MISTRAL_API_KEY", ""),
              "MISTRAL_MODEL": "mistral-small-latest",
              "MISTRAL_TIMEOUT_SECONDS": "20",
              "CLOUDFLARE_API_TOKEN": os.environ.get("CLOUDFLARE_API_TOKEN", ""),
              "CLOUDFLARE_ACCOUNT_ID": os.environ.get("CLOUDFLARE_ACCOUNT_ID", ""),
              "CLOUDFLARE_MODEL": "@cf/meta/llama-3.1-8b-instruct",
              "CLOUDFLARE_TIMEOUT_SECONDS": "20",
              "BLOG_ID": os.environ.get("BLOGGER_BLOG_ID", ""),
              "PUBLISH_MODE": "live",
              "SAFE_MODE": "false",
              "BLOGGER_LIVE_ENABLED": "true",
              "FACEBOOK_AUTO_POST": "false" if os.environ.get("GITHUB_EVENT_NAME") == "push" else "true",
              "META_GRAPH_API_VERSION": "v26.0",
              "FACEBOOK_LINK_MODE": "comment",
              "JOBS_FACEBOOK_FOLLOW_ARTICLE": "true",
              "JOBS_FACEBOOK_MAX_POSTS_PER_DAY": "240",
              "JOBS_FACEBOOK_MIN_INTERVAL_MINUTES": "5",
              "FACEBOOK_PAGE_ID": os.environ.get("FACEBOOK_PAGE_ID", ""),
              "FACEBOOK_PAGE_ACCESS_TOKEN": os.environ.get("FACEBOOK_PAGE_ACCESS_TOKEN", ""),
              "JOBS_GOOGLE_INDEXING_ENABLED": os.environ.get("JOBS_GOOGLE_INDEXING_ENABLED", "false"),
              "GOOGLE_SERVICE_ACCOUNT_JSON": os.environ.get("GOOGLE_SERVICE_ACCOUNT_JSON", ""),
              "FAST_NEWS_MODE": "false",
              "CATEGORY_ROTATION_MODE": "false",
              "PROCESS_FULL_CATEGORY_PER_RUN": "false",
              "FRESH_QUEUE_MODE": "false",
              "FIRST_VALID_ARTICLE_MODE": "false",
              "RECENT_NEWS_ONLY": "false",
              "RECENT_ONLY": "false",
              "ALLOW_UNKNOWN_DATE_IN_FAST_MODE": "true",
              "MAX_POSTS_PER_RUN": "1",
              "MAX_ARTICLES_PER_RUN": "1",
              "SAFE_CYCLE_MAX_ARTICLES": "1",
              "SAFE_CYCLE_DRAFT_ONLY": "false",
              "MAX_SOURCES_PER_RUN": "20",
              "JOBS_ENRICH_MAX_TARGETS_PER_CYCLE": "12",
              "JOBS_MAX_PUBLISH_AGE_HOURS": "12",
              "PUBLISH_WEAK_ARTICLES": "false",
              "ALLOW_SHORT_ARTICLES": "true",
              "MIN_ARTICLE_WORDS": "120",
              "MIN_EXTRACTED_CHARS": "80",
              "MAX_SOURCE_RETRIES": "0",
              "SOURCE_RETRY_DELAY_SECONDS": "0",
              "SOURCE_TIMEOUT_SECONDS": "6",
              "ARTICLE_TIMEOUT_SECONDS": "8",
              "AI_TOTAL_TIME_BUDGET_SECONDS": "75",
              "GEMINI_TIMEOUT_SECONDS": "20",
              "AI_MODEL_TIMEOUT_SECONDS": "20",
              "OPENROUTER_TIMEOUT_SECONDS": "20",
              "MAX_AI_RETRIES": "2",
              "JOBS_AI_QUALITY_REPAIRS": "1",
              "JOBS_AI_TIMEOUT_RETRIES": "0",
              "JOBS_AI_CROSS_CANDIDATE_RETRIES": "1",
              "JOBS_ONE_SHOT_FORCE_RUN": "false",
              "DUPLICATE_PROTECTION": "true",
              "QUEUE_PERSIST": "true",
              "SOURCE_HEALTH_ENABLED": "true",
              "ENABLE_SCRAPLING_FALLBACK": "false",
              "MAX_DRAFTS_PER_DAY": "3",
              "MIN_MINUTES_BETWEEN_DRAFTS": "0",
              "MAX_LIVE_POSTS_PER_DAY": "240",
              "TARGET_LIVE_POSTS_PER_DAY": "240",
              "MIN_MINUTES_BETWEEN_LIVE_POSTS": "0",
              "MAX_FACEBOOK_POSTS_PER_DAY": "2",
              "MIN_MINUTES_BETWEEN_FACEBOOK_POSTS": "0",
              "FACEBOOK_HARD_MAX_POSTS_PER_DAY": "3",
              "FACEBOOK_SAFETY_MIN_INTERVAL_MINUTES": "45",
              "AI_PROVIDER": "auto",
              "LOCAL_PUBLISH_FALLBACK": "false",
          }
          Path(".env").write_text(
              "\n".join(f"{key}={value}" for key, value in env_lines.items()) + "\n",
              encoding="utf-8",
          )
          print("Mode: Jobs Automation")
          print("Blogger target safety: configured")
          print("Facebook publishing: enabled after successful Blogger publish")
          print("Morocco timezone: Africa/Casablanca")
          print("Job quality: hard gate decides publishability; score ranks valid jobs only")
          print("AI order: Gemini -> Groq -> OpenRouter -> Cloudflare -> Mistral; provider failures rotate, global outages defer")
          print("Jobs quality repair: one same-provider repair; source/evidence failures back off without another AI call")
          PY

      - name: Queue maintenance
        # Maintenance is useful housekeeping, but a transient cleanup bug must
        # never prevent the production discovery/publish cycle from running.
        continue-on-error: true
        run: python main.py queue-maintenance

      - name: Run auto cycle
        # Discovery remains paginated/exhaustive, while enrichment is bounded
        # per run so the cycle still reaches AI/Blogger/Facebook within budget.
        timeout-minutes: 10
        run: python main.py auto-cycle

      - name: Jobs status
        if: always()
        run: |
          python - <<'PY'
          from job_core import job_status_snapshot
          import json
          print(json.dumps(job_status_snapshot(), ensure_ascii=False, indent=2, default=str))
          PY

      - name: Health summary
        if: always()
        run: python main.py health

      - name: Refresh daily scheduler heartbeat
        if: always() && github.ref == 'refs/heads/main'
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("data/automation_heartbeat.json")
          now = datetime.now(timezone.utc)
          today = now.date().isoformat()
          try:
              current = json.loads(path.read_text(encoding="utf-8"))
          except Exception:
              current = {}
          if str(current.get("date_utc") or "") != today:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(
                  json.dumps(
                      {"date_utc": today, "updated_at": now.isoformat()},
                      ensure_ascii=False,
                      indent=2,
                  ) + "\n",
                  encoding="utf-8",
              )
              print("Daily scheduler heartbeat refreshed.")
          else:
              print("Daily scheduler heartbeat already current.")
          PY

      - name: Persist Jobs runtime state
        if: always() && github.ref == 'refs/heads/main'
        run: |
          rm -f .env client_secret.json data/token.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --cached --ignore-unmatch .env client_secret.json data/token.json
          STATE_PATHS=(
            "jobs_article_queue.json"
            "data/job_state.json"
            "data/job_memory"
            "data/job_visual_state.json"
            "data/jobs_adaptive_state.json"
            "data/job_queue_archive"
            "data/crawl_state.json"
            "data/ai_provider_memory.json"
            "data/facebook_style_memory.json"
            "data/internal_link_cache.json"
            "data/source_health.json"
            "data/automation_heartbeat.json"
          )
          for state_path in "${STATE_PATHS[@]}"; do
            if [ -e "$state_path" ]; then
              git add -f "$state_path"
            fi
          done
          if git diff --cached --quiet; then
            echo "No durable Jobs runtime state changes to commit."
          else
            # Persist the bounded diagnostic log only when another durable
            # state change (or the daily heartbeat) already requires a commit.
            if [ -e "logs/auto_cycle_runs.jsonl" ]; then
              git add -f "logs/auto_cycle_runs.jsonl"
            fi

            # Runtime state is generated data, not source code. If main advances
            # while this run is active, rebasing JSON state can create conflicts
            # and lose the queue. Snapshot state, move to latest main, restore
            # only runtime files, then create a fresh state commit.
            PERSIST_PATHS=("${STATE_PATHS[@]}" "logs/auto_cycle_runs.jsonl")
            SNAPSHOT_DIR="$(mktemp -d)"
            RUN_BASE_SHA="${JOBS_RUN_BASE_SHA:-}"
            if [ -z "$RUN_BASE_SHA" ] || ! git cat-file -e "$RUN_BASE_SHA^{commit}" 2>/dev/null; then
              echo "::warning::Captured Jobs run base is unavailable; runtime recovery will use conservative merge/remote precedence."
              RUN_BASE_SHA=""
            fi

            snapshot_runtime() {
              rm -rf "$SNAPSHOT_DIR"
              mkdir -p "$SNAPSHOT_DIR"
              for state_path in "${PERSIST_PATHS[@]}"; do
                if [ -e "$state_path" ]; then
                  mkdir -p "$SNAPSHOT_DIR/$(dirname "$state_path")"
                  cp -a "$state_path" "$SNAPSHOT_DIR/$state_path"
                fi
              done
            }

            merge_jobs_queue_snapshot() {
              python - "$SNAPSHOT_DIR/jobs_article_queue.json" "jobs_article_queue.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          snapshot_path = Path(sys.argv[1])
          remote_path = Path(sys.argv[2])

          def load_queue(path):
              try:
                  with path.open("r", encoding="utf-8-sig") as handle:
                      data = json.load(handle)
              except Exception:
                  return None
              if not isinstance(data, dict) or not isinstance(data.get("articles"), list):
                  return None
              return data

          def article_key(article):
              if not isinstance(article, dict):
                  return ""
              for field in ("id", "url", "canonical_url", "original_url"):
                  value = str(article.get(field) or "").strip()
                  if value:
                      return f"{field}:{value}"
              return ""

          snapshot = load_queue(snapshot_path)
          remote = load_queue(remote_path)

          if snapshot is None:
              print("Runner Jobs queue snapshot is invalid; keeping remote queue.")
              raise SystemExit(2)

          if remote is None:
              remote = {"articles": [], "notifications": {}}

          merged = dict(snapshot)
          merged.update(remote)

          remote_articles = list(remote.get("articles") or [])
          index = {}
          for position, article in enumerate(remote_articles):
              key = article_key(article)
              if key:
                  index[key] = position

          added = 0
          for article in snapshot.get("articles") or []:
              key = article_key(article)
              if not key or key in index:
                  continue
              index[key] = len(remote_articles)
              remote_articles.append(article)
              added += 1

          snapshot_notifications = snapshot.get("notifications")
          remote_notifications = remote.get("notifications")
          notifications = {}
          if isinstance(snapshot_notifications, dict):
              notifications.update(snapshot_notifications)
          if isinstance(remote_notifications, dict):
              notifications.update(remote_notifications)

          merged["articles"] = remote_articles
          merged["notifications"] = notifications
          merged["updated_at"] = max(
              str(snapshot.get("updated_at") or ""),
              str(remote.get("updated_at") or ""),
          )

          remote_path.parent.mkdir(parents=True, exist_ok=True)
          temp_path = remote_path.with_suffix(remote_path.suffix + ".merge.tmp")
          temp_path.write_text(
              json.dumps(merged, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          os.replace(temp_path, remote_path)
          print(
              f"Merged Jobs queue: remote={len(remote.get('articles') or [])}, "
              f"snapshot={len(snapshot.get('articles') or [])}, "
              f"added_snapshot_only={added}, merged={len(remote_articles)}"
          )
          PY
            }

            restore_runtime() {
              for state_path in "${PERSIST_PATHS[@]}"; do
                if [ ! -e "$SNAPSHOT_DIR/$state_path" ]; then
                  continue
                fi

                # If this state path changed upstream after the run started,
                # keep newer remote state. The Jobs queue is the exception:
                # merge both sides so overlapping production runs cannot lose
                # distinct vacancies discovered by either runner.
                if [ -z "$RUN_BASE_SHA" ]; then
                  if [ "$state_path" = "jobs_article_queue.json" ]; then
                    echo "Run base unavailable; conservatively merging Jobs queues."
                    if ! merge_jobs_queue_snapshot; then
                      echo "::warning::Jobs queue merge failed; keeping remote queue."
                    fi
                  else
                    echo "Run base unavailable; keeping remote runtime state: $state_path"
                  fi
                  continue
                fi

                if ! git diff --quiet "$RUN_BASE_SHA" origin/main -- "$state_path"; then
                  if [ "$state_path" = "jobs_article_queue.json" ]; then
                    echo "Jobs queue changed upstream; merging remote and runner snapshot."
                    if ! merge_jobs_queue_snapshot; then
                      echo "::warning::Jobs queue merge failed; keeping remote queue."
                    fi
                  else
                    echo "Keeping newer remote runtime state: $state_path"
                  fi
                  continue
                fi

                mkdir -p "$(dirname "$state_path")"
                rm -rf "$state_path"
                cp -a "$SNAPSHOT_DIR/$state_path" "$state_path"
              done
            }

            stage_runtime() {
              for state_path in "${PERSIST_PATHS[@]}"; do
                if [ -e "$state_path" ]; then
                  git add -f "$state_path"
                fi
              done
            }

            snapshot_runtime
            git commit -m "Update Jobs runtime state [skip ci]"

            for attempt in 1 2 3 4 5 6; do
              if git push origin HEAD:main; then
                rm -rf "$SNAPSHOT_DIR"
                exit 0
              fi

              echo "Runtime push raced with a newer main commit; refreshing code and restoring state (attempt $attempt)."
              git fetch origin main
              git reset --hard origin/main
              restore_runtime
              stage_runtime

              if git diff --cached --quiet; then
                echo "Latest main already contains equivalent runtime state."
                rm -rf "$SNAPSHOT_DIR"
                exit 0
              fi

              git commit -m "Update Jobs runtime state [skip ci]"
              snapshot_runtime
            done

            echo "::error::Could not persist Jobs runtime state after 6 push attempts."
            rm -rf "$SNAPSHOT_DIR"
            exit 1
          fi

      - name: Keep recoverable runtime checkpoint on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jobs-state-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          path: |
            jobs_article_queue.json
            data/job_state.json
            data/job_memory
            data/job_visual_state.json
            data/jobs_adaptive_state.json
            data/job_queue_archive
            data/crawl_state.json
            data/ai_provider_memory.json
            data/facebook_style_memory.json
            data/internal_link_cache.json
            data/source_health.json
            data/automation_heartbeat.json
            logs/auto_cycle_runs.jsonl

      - name: Pace next production cycle
        if: always() && github.ref == 'refs/heads/main'
        run: sleep 120

      - name: Continue production cycle directly
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/github-script@v8
        with:
          script: |
            const {owner, repo} = context.repo;
            const workflow_id = "auto-cycle.yml";
            const {data} = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id, branch: "main", per_page: 10,
            });
            const otherActive = (data.workflow_runs || []).find(run =>
              run.id !== context.runId
              && (run.status === "queued" || run.status === "in_progress")
            );
            if (otherActive) {
              core.info(`Next production cycle already active: ${otherActive.id}`);
              return;
            }
            await github.rest.actions.createWorkflowDispatch({owner, repo, workflow_id, ref: "main"});
            core.info("Next production cycle dispatched directly.");
