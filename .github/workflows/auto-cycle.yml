name: Jobs Auto Cycle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/auto-cycle.yml"

concurrency:
  group: auto-cycle-${{ github.ref }}
  cancel-in-progress: false

env:
  JOBS_RUNTIME_PERSIST_BY_WORKFLOW: "true"

jobs:
  auto-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify publishing regressions
        run: python -m unittest tests.test_jobs_core tests.test_job_visuals tests.test_jobs_runtime -q

      - name: Create runtime secrets and Jobs env
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_SECRET_JSON: ${{ secrets.BLOGGER_CLIENT_SECRET_JSON }}
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          JOBS_GOOGLE_INDEXING_ENABLED: ${{ secrets.JOBS_GOOGLE_INDEXING_ENABLED }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          secret_names = (
              "GEMINI_API_KEY",
              "OPENROUTER_API_KEY",
              "GROQ_API_KEY",
              "MISTRAL_API_KEY",
              "CLOUDFLARE_API_TOKEN",
              "CLOUDFLARE_ACCOUNT_ID",
              "BLOGGER_BLOG_ID",
              "BLOGGER_CLIENT_SECRET_JSON",
              "BLOGGER_TOKEN_JSON",
              "FACEBOOK_PAGE_ID",
              "FACEBOOK_PAGE_ACCESS_TOKEN",
              "GOOGLE_SERVICE_ACCOUNT_JSON",
          )
          for name in secret_names:
              value = os.environ.get(name, "")
              if value:
                  print(f"::add-mask::{value}")

          missing = [
              name for name in (
                  "BLOGGER_BLOG_ID",
                  "BLOGGER_CLIENT_SECRET_JSON",
                  "BLOGGER_TOKEN_JSON",
              )
              if not os.environ.get(name, "").strip()
          ]
          ai_provider_secret_present = any(
              os.environ.get(name, "").strip()
              for name in (
                  "GEMINI_API_KEY",
                  "GROQ_API_KEY",
                  "OPENROUTER_API_KEY",
                  "MISTRAL_API_KEY",
                  "CLOUDFLARE_API_TOKEN",
              )
          )
          if not ai_provider_secret_present:
              print(
                  "::warning::No AI provider secret is currently available; "
                  "Jobs AI generation will defer until a configured provider is available."
              )

          for name in ("BLOGGER_CLIENT_SECRET_JSON", "BLOGGER_TOKEN_JSON"):
              raw = os.environ.get(name, "").strip()
              if raw:
                  try:
                      json.loads(raw)
                  except json.JSONDecodeError:
                      print(f"::error::{name} is invalid JSON.")
                      sys.exit(1)

          if missing:
              print("::error::Missing required secrets: " + ", ".join(missing))
              sys.exit(1)

          Path("data").mkdir(exist_ok=True)
          Path("client_secret.json").write_text(
              os.environ["BLOGGER_CLIENT_SECRET_JSON"], encoding="utf-8"
          )
          Path("data/token.json").write_text(
              os.environ["BLOGGER_TOKEN_JSON"], encoding="utf-8"
          )

          env_lines = {
              "JOBS_MODE": "true",
              "JOBS_TEST_MODE": "false",
              "JOBS_EXPECTED_BLOG_HOST": "example.invalid",
              "JOBS_TIMEZONE": "Africa/Casablanca",
              "JOBS_MIN_SELECTION_SCORE": "65",
              "JOBS_QUEUE_SCORE": "50",
              "JOBS_URGENT_EXTRA_DAILY_LIMIT": "1",
              "JOBS_FACEBOOK_MIN_SCORE": "75",
              "JOBS_ADAPTIVE_PUBLISHING": "true",
              "JOBS_ADAPTIVE_MIN_DAILY_CAP": "240",
              "JOBS_ADAPTIVE_MAX_DAILY_CAP": "240",
              "JOBS_ACTIVE_START_HOUR": "0",
              "JOBS_ACTIVE_END_HOUR": "24",
              "JOBS_MIN_PUBLISH_INTERVAL_MINUTES": "5",
              "WHATSAPP_CHANNEL_URL": "https://whatsapp.com/channel/0029Vb7MdMfBVJl1kmmV4T0e",
              "GEMINI_API_KEY": os.environ.get("GEMINI_API_KEY", ""),
              "GEMINI_MODEL": "gemini-2.5-flash",
              "OPENROUTER_API_KEY": os.environ.get("OPENROUTER_API_KEY", ""),
              "OPENROUTER_MODEL": "openrouter/free",
              "OPENROUTER_MODELS": "openrouter/free",
              "OPENROUTER_APP_NAME": "Jobs Automation",
              "GROQ_API_KEY": os.environ.get("GROQ_API_KEY", ""),
              "GROQ_MODEL": "openai/gpt-oss-20b",
              "GROQ_TIMEOUT_SECONDS": "20",
              "MISTRAL_API_KEY": os.environ.get("MISTRAL_API_KEY", ""),
              "MISTRAL_MODEL": "mistral-small-latest",
              "MISTRAL_TIMEOUT_SECONDS": "20",
              "CLOUDFLARE_API_TOKEN": os.environ.get("CLOUDFLARE_API_TOKEN", ""),
              "CLOUDFLARE_ACCOUNT_ID": os.environ.get("CLOUDFLARE_ACCOUNT_ID", ""),
              "CLOUDFLARE_MODEL": "@cf/meta/llama-3.1-8b-instruct",
              "CLOUDFLARE_TIMEOUT_SECONDS": "20",
              "BLOG_ID": os.environ.get("BLOGGER_BLOG_ID", ""),
              "PUBLISH_MODE": "live",
              "SAFE_MODE": "false",
              "BLOGGER_LIVE_ENABLED": "true",
              "FACEBOOK_AUTO_POST": "true",
              "META_GRAPH_API_VERSION": "v26.0",
              "FACEBOOK_LINK_MODE": "comment",
              "FACEBOOK_PAGE_ID": os.environ.get("FACEBOOK_PAGE_ID", ""),
              "FACEBOOK_PAGE_ACCESS_TOKEN": os.environ.get("FACEBOOK_PAGE_ACCESS_TOKEN", ""),
              "JOBS_GOOGLE_INDEXING_ENABLED": os.environ.get("JOBS_GOOGLE_INDEXING_ENABLED", "false"),
              "GOOGLE_SERVICE_ACCOUNT_JSON": os.environ.get("GOOGLE_SERVICE_ACCOUNT_JSON", ""),
              "FAST_NEWS_MODE": "false",
              "CATEGORY_ROTATION_MODE": "false",
              "PROCESS_FULL_CATEGORY_PER_RUN": "false",
              "FRESH_QUEUE_MODE": "false",
              "FIRST_VALID_ARTICLE_MODE": "false",
              "RECENT_NEWS_ONLY": "false",
              "RECENT_ONLY": "false",
              "ALLOW_UNKNOWN_DATE_IN_FAST_MODE": "true",
              "MAX_POSTS_PER_RUN": "1",
              "MAX_ARTICLES_PER_RUN": "1",
              "SAFE_CYCLE_MAX_ARTICLES": "1",
              "SAFE_CYCLE_DRAFT_ONLY": "false",
              "MAX_SOURCES_PER_RUN": "20",
              "PUBLISH_WEAK_ARTICLES": "false",
              "ALLOW_SHORT_ARTICLES": "true",
              "MIN_ARTICLE_WORDS": "120",
              "MIN_EXTRACTED_CHARS": "80",
              "MAX_SOURCE_RETRIES": "0",
              "SOURCE_RETRY_DELAY_SECONDS": "0",
              "SOURCE_TIMEOUT_SECONDS": "6",
              "ARTICLE_TIMEOUT_SECONDS": "8",
              "AI_TOTAL_TIME_BUDGET_SECONDS": "75",
              "GEMINI_TIMEOUT_SECONDS": "20",
              "AI_MODEL_TIMEOUT_SECONDS": "20",
              "OPENROUTER_TIMEOUT_SECONDS": "20",
              "MAX_AI_RETRIES": "2",
              "JOBS_AI_QUALITY_REPAIRS": "1",
              "JOBS_AI_TIMEOUT_RETRIES": "0",
              "JOBS_AI_CROSS_CANDIDATE_RETRIES": "1",
              "JOBS_ONE_SHOT_FORCE_RUN": "true" if os.environ.get("GITHUB_EVENT_NAME") == "push" else "false",
              "DUPLICATE_PROTECTION": "true",
              "QUEUE_PERSIST": "true",
              "SOURCE_HEALTH_ENABLED": "true",
              "ENABLE_SCRAPLING_FALLBACK": "false",
              "MAX_DRAFTS_PER_DAY": "3",
              "MIN_MINUTES_BETWEEN_DRAFTS": "0",
              "MAX_LIVE_POSTS_PER_DAY": "240",
              "TARGET_LIVE_POSTS_PER_DAY": "240",
              "MIN_MINUTES_BETWEEN_LIVE_POSTS": "0",
              "MAX_FACEBOOK_POSTS_PER_DAY": "2",
              "MIN_MINUTES_BETWEEN_FACEBOOK_POSTS": "0",
              "FACEBOOK_HARD_MAX_POSTS_PER_DAY": "3",
              "FACEBOOK_SAFETY_MIN_INTERVAL_MINUTES": "45",
              "AI_PROVIDER": "auto",
              "LOCAL_PUBLISH_FALLBACK": "false",
          }
          Path(".env").write_text(
              "\n".join(f"{key}={value}" for key, value in env_lines.items()) + "\n",
              encoding="utf-8",
          )
          print("Mode: Jobs Automation")
          print("Blogger target safety: configured")
          print("Facebook publishing: enabled after successful Blogger publish")
          print("Morocco timezone: Africa/Casablanca")
          print("Job quality: >=65 publish, 50-64 queue")
          print("AI order: Gemini -> Groq -> OpenRouter -> Cloudflare -> Mistral; provider failures rotate, global outages defer")
          print("Jobs quality repair: one same-provider repair; source/evidence failures back off without another AI call")
          PY

      - name: Queue maintenance
        run: python main.py queue-maintenance

      - name: Run auto cycle
        timeout-minutes: 10
        run: python main.py auto-cycle

      - name: Jobs status
        if: always()
        run: |
          python - <<'PY'
          from job_core import job_status_snapshot
          import json
          print(json.dumps(job_status_snapshot(), ensure_ascii=False, indent=2, default=str))
          PY

      - name: Health summary
        if: always()
        run: python main.py health

      - name: Refresh daily scheduler heartbeat
        if: always() && github.ref == 'refs/heads/main'
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("data/automation_heartbeat.json")
          now = datetime.now(timezone.utc)
          today = now.date().isoformat()
          try:
              current = json.loads(path.read_text(encoding="utf-8"))
          except Exception:
              current = {}
          if str(current.get("date_utc") or "") != today:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(
                  json.dumps(
                      {"date_utc": today, "updated_at": now.isoformat()},
                      ensure_ascii=False,
                      indent=2,
                  ) + "\n",
                  encoding="utf-8",
              )
              print("Daily scheduler heartbeat refreshed.")
          else:
              print("Daily scheduler heartbeat already current.")
          PY

      - name: Persist Jobs runtime state
        if: always() && github.ref == 'refs/heads/main'
        run: |
          rm -f .env client_secret.json data/token.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --cached --ignore-unmatch .env client_secret.json data/token.json
          STATE_PATHS=(
            "jobs_article_queue.json"
            "data/job_state.json"
            "data/job_memory"
            "data/job_visual_state.json"
            "data/jobs_adaptive_state.json"
            "data/job_queue_archive"
            "data/crawl_state.json"
            "data/ai_provider_memory.json"
            "data/facebook_style_memory.json"
            "data/internal_link_cache.json"
            "data/source_health.json"
            "data/automation_heartbeat.json"
          )
          for state_path in "${STATE_PATHS[@]}"; do
            if [ -e "$state_path" ]; then
              git add -f "$state_path"
            fi
          done
          if git diff --cached --quiet; then
            echo "No durable Jobs runtime state changes to commit."
          else
            # Persist the bounded diagnostic log only when another durable
            # state change (or the daily heartbeat) already requires a commit.
            if [ -e "logs/auto_cycle_runs.jsonl" ]; then
              git add -f "logs/auto_cycle_runs.jsonl"
            fi
            git commit -m "Update Jobs runtime state [skip ci]"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                exit 0
              fi
              # Keep unrelated code updates made while this run was active.
              git pull --rebase origin main || exit 1
            done
            git push origin HEAD:main
          fi

      - name: Keep recoverable runtime checkpoint on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jobs-state-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          path: |
            jobs_article_queue.json
            data/job_state.json
            data/job_memory
            data/job_visual_state.json
            data/jobs_adaptive_state.json
            data/job_queue_archive
            data/crawl_state.json
            data/ai_provider_memory.json
            data/facebook_style_memory.json
            data/internal_link_cache.json
            data/source_health.json
            data/automation_heartbeat.json
            logs/auto_cycle_runs.jsonl
