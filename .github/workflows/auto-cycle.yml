name: Safe Auto Cycle

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: safe-auto-cycle
  cancel-in-progress: false

jobs:
  auto-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create runtime secrets and .env
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_SECRET_JSON: ${{ secrets.BLOGGER_CLIENT_SECRET_JSON }}
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          for name in (
              "GEMINI_API_KEY",
              "OPENROUTER_API_KEY",
              "BLOGGER_BLOG_ID",
              "BLOGGER_CLIENT_SECRET_JSON",
              "BLOGGER_TOKEN_JSON",
              "FACEBOOK_PAGE_ID",
              "FACEBOOK_PAGE_ACCESS_TOKEN",
          ):
              value = os.environ.get(name, "")
              if value:
                  print(f"::add-mask::{value}")

          Path("data").mkdir(exist_ok=True)
          Path("client_secret.json").write_text(os.environ["BLOGGER_CLIENT_SECRET_JSON"], encoding="utf-8")
          Path("data/token.json").write_text(os.environ["BLOGGER_TOKEN_JSON"], encoding="utf-8")

          env_lines = {
              "GEMINI_API_KEY": os.environ["GEMINI_API_KEY"],
              "OPENROUTER_API_KEY": os.environ["OPENROUTER_API_KEY"],
              "OPENAI_API_KEY": os.environ.get("OPENAI_API_KEY", ""),
              "BLOG_ID": os.environ["BLOGGER_BLOG_ID"],
              "PUBLISH_MODE": "draft",
              "FACEBOOK_AUTO_POST": "false",
              "FACEBOOK_PAGE_ID": os.environ["FACEBOOK_PAGE_ID"],
              "FACEBOOK_PAGE_ACCESS_TOKEN": os.environ["FACEBOOK_PAGE_ACCESS_TOKEN"],
              "SAFE_CYCLE_MAX_ARTICLES": "1",
              "SAFE_CYCLE_DRAFT_ONLY": "true",
              "MAX_DRAFTS_PER_DAY": "10",
              "MIN_MINUTES_BETWEEN_DRAFTS": "30",
              "MAX_LIVE_POSTS_PER_DAY": "5",
              "MIN_MINUTES_BETWEEN_LIVE_POSTS": "60",
              "MAX_FACEBOOK_POSTS_PER_DAY": "5",
              "MIN_MINUTES_BETWEEN_FACEBOOK_POSTS": "60",
              "AI_PROVIDER": "auto",
              "LOCAL_PUBLISH_FALLBACK": "false",
          }
          Path(".env").write_text(
              "\n".join(f"{key}={value}" for key, value in env_lines.items()) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Deployment check
        env:
          BLOGGER_CLIENT_SECRET_JSON: ${{ secrets.BLOGGER_CLIENT_SECRET_JSON }}
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
        run: python main.py deployment-check

      - name: Run safe auto cycle
        run: python main.py auto-cycle

      - name: Health summary
        if: always()
        run: python main.py health
