name: CyberoPlus Editorial - Network Topology Types
on:
  push:
    branches: [main]
    paths: [".github/workflows/blogger-editorial-update.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cyberoplus-editorial-one-post
  cancel-in-progress: false
jobs:
  publish-one-verified-topology-article:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install auth and HTML parser
        run: python -m pip install --disable-pip-version-check "google-auth>=2.20,<3" "requests>=2.31,<3" "beautifulsoup4>=4.12,<5"
      - name: Update network topology tutorial and re-read published version
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
          BLOGGER_CLIENT_SECRET_JSON: ${{ secrets.BLOGGER_CLIENT_SECRET_JSON }}
        run: |
          python - <<'PY'
          import os,json,re,hashlib
          from urllib.parse import urlsplit
          from bs4 import BeautifulSoup
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import AuthorizedSession
          BLOG_ID="2750143140558868280"
          PID="7083948725804421954"
          TITLE_OLD="توبولوجيا الشبكات: شرح Bus وStar وRing وMesh وTree"
          ORIGINAL_URL="https://www.cyberoplus.com/2026/03/network-topology-types-explained.html"
          PUBLISHED="2026-03-14T23:13:00Z"
          OLD_SHA="e4b935a5c879f031a0762cf24f44643d6ed01fa23bf29922e57647d72f91e42f"
          TITLE_NEW="Network Topology Types: Star, Bus, Ring, Tree and Mesh Explained"
          def sha(v):return hashlib.sha256(v.encode("utf-8")).hexdigest()
          def check(c,m):
              if not c:raise RuntimeError(m)
          token=json.loads(os.environ["BLOGGER_TOKEN_JSON"])
          client=json.loads(os.environ["BLOGGER_CLIENT_SECRET_JSON"])
          cfg=client.get("installed") or client.get("web") or {}
          for k in ("client_id","client_secret","token_uri"):
              if not token.get(k) and cfg.get(k):token[k]=cfg[k]
          s=AuthorizedSession(Credentials.from_authorized_user_info(token))
          base="https://www.googleapis.com/blogger/v3/blogs/"+BLOG_ID
          check(os.environ.get("BLOGGER_BLOG_ID")==BLOG_ID,"Wrong Blog ID")
          r=s.get(base,timeout=30);r.raise_for_status()
          check(str(r.json().get("id"))==BLOG_ID and (urlsplit(str(r.json().get("url",""))).hostname or "").lower() in ("cyberoplus.com","www.cyberoplus.com"),"Unexpected domain")
          endpoint=base+"/posts/"+PID
          def read():
              r=s.get(endpoint,params={"view":"ADMIN","fetchBody":"true"},timeout=45);r.raise_for_status();return r.json()
          old=read()
          check(str(old.get("id"))==PID and old.get("title")==TITLE_OLD and old.get("url")==ORIGINAL_URL and old.get("published")==PUBLISHED and old.get("labels")==["technology"] and sha(old.get("content",""))==OLD_SHA,"Original edited; will not overwrite")
          soup=BeautifulSoup(old["content"],"html.parser")
          images=soup.find_all("img")
          check(len(images)==2,"Original media count changed")
          nodes=[]
          for i,im in enumerate(images):
              wrap=im.find_parent("div",class_="separator") or im.find_parent("table",class_="tr-caption-container")
              check(wrap is not None,"Missing image wrapper")
              block=BeautifulSoup(str(wrap),"html.parser")
              block.find("img")["alt"]=["Network topology arrangement diagram showing physical and logical network nodes","Types of network topology including bus star ring tree and mesh"][i]
              for cap in block.find_all("td",class_="tr-caption"):cap.string="Network topology types illustrated in the original guide"
              nodes.append(str(block))
          article=r'''<p><strong>Network topology</strong> describes how devices and connections are arranged and how information moves between them. The best-known types are <strong>point-to-point, bus, star, ring, tree, mesh and hybrid</strong>. Understanding the differences helps you design a network that is easier to expand, maintain and troubleshoot without making incorrect assumptions about performance or reliability.</p>
          {{IMAGE1}}
          <p>A topology is more than the shape of a drawing. It can affect the number of cables, switching dependencies, alternative paths, failure recovery, maintenance cost and the number of points where an attacker or fault might disrupt communication.</p>
          <h2>Physical topology versus logical topology</h2>
          <p><strong>Physical topology</strong> shows actual devices and links: for example, workstations connected by Ethernet cables to one central switch. <strong>Logical topology</strong> describes how network communication and traffic paths are organized, even when the wiring looks different.</p>
          <table><thead><tr><th>Physical topology</th><th>Logical topology</th></tr></thead><tbody>
          <tr><td>Describes the real wiring and physical interconnections</td><td>Describes traffic flow or logical connectivity</td></tr>
          <tr><td>Useful for locating damaged links or ports</td><td>Useful for understanding VLANs, forwarding and routing</td></tr>
          <tr><td>Can be inspected on-site and in cabling diagrams</td><td>May require switching, routing or overlay information to interpret</td></tr>
          </tbody></table>
          <p>For example, devices may connect physically in a star to a switch while the network contains several separate VLANs and routed paths. A physical star does not mean every device can communicate with every other device without policy restrictions.</p>
          <h2>Seven common network topology types</h2>
          <p>In education and network design, the main descriptive types are point-to-point, bus, star, ring, tree, mesh and hybrid. They can be combined: a campus may use stars at the access layer and redundant links between distribution devices.</p>
          {{IMAGE2}}
          <h2>Point-to-point topology</h2>
          <p>A <strong>point-to-point topology</strong> has a direct link between two nodes. A dedicated connection between two routers or a single wired connection between two network interfaces is a simple example.</p>
          <h3>Strengths</h3>
          <p>The connection is easy to describe, usually has clearly identifiable endpoints, and can make basic link troubleshooting straightforward.</p>
          <h3>Limitations</h3>
          <p>A single connection has no alternative physical path unless redundancy is added. Point-to-point itself does not describe how a large multi-device network is arranged.</p>
          <h2>Bus topology</h2>
          <p>In a classic <strong>bus topology</strong>, devices share a common physical transmission medium or backbone. Historical coaxial Ethernet is a familiar textbook example.</p>
          <h3>Advantages</h3>
          <p>A shared backbone can reduce the number of separate point-to-point cables in a simple historical arrangement, and its basic structure is easy to explain.</p>
          <h3>Disadvantages</h3>
          <p>The shared backbone can become a single point of failure; defects in cabling or termination can affect many stations, and shared-medium access introduces performance constraints. Classic bus cabling is not the normal design for modern switched office Ethernet.</p>
          <h2>Star topology</h2>
          <p>A <strong>star topology</strong> connects endpoints individually to a central device, such as an Ethernet switch. This is a common physical arrangement in office and classroom LANs.</p>
          <h3>Advantages</h3>
          <p>A damaged cable often affects only its endpoint; you can add or remove ports relatively easily within the switch's capacity, and central management simplifies identifying which port is involved in an issue.</p>
          <h3>Disadvantages</h3>
          <p>The central device is an important dependency. If the central switch loses power or fails, many or all attached devices may lose local connectivity. Redundancy requires additional design; drawing a star does not automatically provide it.</p>
          <p>For details on what the central device does, see our <a href="https://www.cyberoplus.com/2026/03/network-devices-hub-switch-router-firewall.html">hub, switch and router comparison</a>.</p>
          <h2>Ring topology</h2>
          <p>In a <strong>ring topology</strong>, nodes form a closed loop in which each node connects to two neighboring nodes. Data may travel in a specified direction or use alternative ring behavior depending on the technology and protection mechanism.</p>
          <h3>Advantages</h3>
          <p>A ring can offer a structured forwarding path, and some engineered ring technologies provide protection switching or redundant rings to keep traffic moving after a fault.</p>
          <h3>Disadvantages</h3>
          <p>A simple unprotected ring can suffer significant disruption from a broken link or node, while protected rings add protocol and operational complexity. Do not assume that every ring has a single direction or is automatically fault-tolerant.</p>
          <h2>Tree topology</h2>
          <p>A <strong>tree topology</strong> connects multiple branches under a hierarchy of upstream devices. In a campus, access switches may connect upward through distribution equipment toward core services. The visual hierarchy is useful, but real production networks may add links that make the graph more redundant than a pure tree.</p>
          <h3>Advantages</h3>
          <p>The hierarchical structure helps organize large numbers of devices, divide management responsibilities and plan predictable expansion.</p>
          <h3>Disadvantages</h3>
          <p>Upstream links or shared aggregation devices can become critical points of failure. A well-managed hierarchy still needs appropriate redundancy where availability requirements justify it.</p>
          <h2>Mesh topology: multiple connections and alternative paths</h2>
          <p>In a <strong>mesh topology</strong>, nodes have multiple interconnections so the topology can provide alternative paths. How useful those paths are depends on routing or switching design, link capacity and the failure type.</p>
          <h3>Full mesh</h3>
          <p>In a <strong>full mesh</strong>, every distinct pair of nodes has one direct link. For <code>n</code> nodes in a simple undirected graph, the number of links is:</p>
          <pre><code>Links = n × (n − 1) / 2
          
          For 4 nodes: 4 × 3 / 2 = 6 links
          For 6 nodes: 6 × 5 / 2 = 15 links
          For 10 nodes: 10 × 9 / 2 = 45 links</code></pre>
          <p>The formula assumes a single direct undirected link per unordered node pair. It does not count separate parallel links, logical overlays or directional circuits. Full mesh can offer strong path redundancy, but connection count and cost grow quickly.</p>
          <h3>Partial mesh</h3>
          <p>In a <strong>partial mesh</strong>, only some nodes have direct links to multiple other nodes. This can balance resilience, complexity and cost; its actual fault tolerance depends on which links and devices have alternatives.</p>
          <h3>What a mesh does not guarantee</h3>
          <p>Multiple paths do not automatically guarantee uninterrupted service. A routing failure, shared power dependency, security misconfiguration or insufficient capacity can still disrupt traffic. Resilience must be tested for the likely failure scenarios.</p>
          <h2>Hybrid topology</h2>
          <p>A <strong>hybrid topology</strong> combines more than one topology type. A university might deploy star connections to classroom switches, a hierarchical distribution network between buildings, and redundant links between critical sites.</p>
          <h3>Advantages</h3>
          <p>A hybrid approach can apply simpler and cheaper structures where they are sufficient while adding redundant or specialized connectivity where needed.</p>
          <h3>Disadvantages</h3>
          <p>Combining designs can increase documentation and troubleshooting complexity. A network still needs coherent addressing, switching, routing, monitoring and security policies.</p>
          <h2>Compare topology types side by side</h2>
          <table><thead><tr><th>Topology</th><th>Main strength</th><th>Main concern</th><th>Common context</th></tr></thead><tbody>
          <tr><td>Point-to-point</td><td>Direct link between two endpoints</td><td>Single path without added redundancy</td><td>Direct router or device connection</td></tr>
          <tr><td>Bus</td><td>Simple shared medium</td><td>Shared backbone and access constraints</td><td>Legacy Ethernet examples</td></tr>
          <tr><td>Star</td><td>Easy endpoint expansion and isolation</td><td>Central switch dependency</td><td>Office and campus access LAN</td></tr>
          <tr><td>Ring</td><td>Structured circular connectivity</td><td>Protection required for robust fault handling</td><td>Some metro or industrial networks</td></tr>
          <tr><td>Tree</td><td>Hierarchical organization</td><td>Upstream aggregation dependency</td><td>Campus distribution structures</td></tr>
          <tr><td>Mesh</td><td>Alternative network paths</td><td>Higher link count and complexity</td><td>Resilient interconnections</td></tr>
          <tr><td>Hybrid</td><td>Flexible combination of designs</td><td>More design and management decisions</td><td>Real-world enterprise networks</td></tr>
          </tbody></table>
          <p>The table summarizes broad tendencies, not performance measurements. Actual throughput, latency and resilience depend on hardware, link rate, routing, traffic load and configuration.</p>
          <h2>Which topology is common in modern LANs?</h2>
          <p>A switched Ethernet access LAN usually has a <strong>physical star</strong> pattern: endpoints connect individually to an access switch. Larger organizations typically combine many access stars with distribution and core networking, redundancy or other architectural choices.</p>
          <p>Cisco describes both campus layered architectures and spine-and-leaf designs as examples of practical topological planning. A spine-and-leaf fabric is often better understood as a structured bipartite interconnection between leaf and spine devices, not a mathematical full mesh between every switch in the entire network.</p>
          <h2>Does Wi-Fi mesh always mean mathematical full mesh?</h2>
          <p>No. A commercial <strong>Wi-Fi mesh</strong> system commonly describes multiple cooperating access nodes and a backhaul arrangement. Not every node must maintain a dedicated direct link to every other node. Vendor implementations differ, and wireless links may change according to signal quality and topology management.</p>
          <p>Distinguish a Wi-Fi product's branding from the graph-theoretic definition of full mesh. The latter explicitly requires a direct edge between every distinct pair.</p>
          <h2>Choosing the right topology</h2>
          <ol data-steps>
          <li>Map the number and location of endpoints, buildings and critical services.</li>
          <li>Identify which links and devices may become single points of failure.</li>
          <li>Decide which paths need redundancy and what downtime can be tolerated.</li>
          <li>Estimate switching ports, cabling, physical media and expansion needs.</li>
          <li>Plan VLANs, routing and security zones separately from the physical drawing.</li>
          <li>Document the design and test likely link or device failures in a controlled environment.</li>
          </ol>
          <p>There is no universally 'best' topology. A low-cost classroom lab and a high-availability data center have different requirements and trade-offs.</p>
          <h2>Security implications of topology</h2>
          <p>Topology influences which paths traffic takes, where monitoring can be deployed and which central components are critical. However, <strong>a diagram shape is not a security control by itself</strong>. A mesh does not make a network immune to attacks; a star does not mean every device is trusted; a VLAN does not replace access control or other security measures.</p>
          <p>Document the actual forwarding domains, management interfaces, routing policies, remote-access exposure and critical failure dependencies. Our <a href="https://www.cyberoplus.com/2026/03/osi-model-7-layers-explained.html">OSI troubleshooting lesson</a> explains why connectivity faults and security policies may affect more than one conceptual layer.</p>
          <h2>Network topology versus network architecture</h2>
          <p><strong>Topology</strong> describes the arrangement of nodes and links. <strong>Network architecture</strong> is broader: it includes protocols, roles, services, addressing, security boundaries, management and operational requirements. Two networks may have a similar physical star topology yet very different architectures because one uses VLANs, redundant switches, routing policy or different application services.</p>
          <h2>Test your understanding</h2>
          <p>Try these short scenarios before reading the answers:</p>
          <table><thead><tr><th>Scenario</th><th>Answer</th></tr></thead><tbody>
          <tr><td>Every lab PC has its own cable to one switch</td><td>Physical star</td></tr>
          <tr><td>Six devices each directly linked to the other five</td><td>Full mesh with 15 links</td></tr>
          <tr><td>Three access switches connect upward to one distribution switch</td><td>Hierarchical or tree-like arrangement</td></tr>
          <tr><td>Several cooperating Wi-Fi units do not all connect directly</td><td>Not a mathematical full mesh</td></tr>
          </tbody></table>
          <p>For more networking practice, use our <a href="https://www.cyberoplus.com/2026/03/network-exercises-solved-interactive.html">ten solved OSI, LAN and topology exercises</a>. Start from the network requirements instead of memorizing which shape is supposedly always fastest or safest.</p>
          <h2>Technical references</h2>
          <ul>
          <li><a href="https://www.cisco.com/site/us/en/learn/topics/networking/what-is-network-topology.html" rel="noopener noreferrer">Cisco: physical versus logical topology and campus designs</a></li>
          <li><a href="https://www.ibm.com/think/topics/network-topology" rel="noopener noreferrer">IBM: point-to-point, bus, star, ring, tree, mesh and hybrid</a></li>
          <li><a href="https://www.microsoft.com/en-us/microsoft-365/visio/network-diagrams" rel="noopener noreferrer">Microsoft: network diagrams and topology examples</a></li>
          </ul>'''
          article=article.replace("{{IMAGE1}}",nodes[0]).replace("{{IMAGE2}}",nodes[1])
          parsed=BeautifulSoup(article,"html.parser")
          check(len(article)>11000 and len(parsed.find_all("h2"))>=14,"Incomplete topology guide")
          check(len(parsed.find_all("img"))==2 and [x.get("src") for x in parsed.find_all("img")]==[x.get("src") for x in images],"Original images lost")
          check(not re.search(r"[\u0600-\u06ff\u0750-\u077f\u08a0-\u08ff]",article),"Arabic remains")
          check(all(k in article for k in ("Point-to-point","Full mesh","15 links","Star","Ring","Bus","Hybrid")),"Original topical coverage missing")
          check(any("cisco.com" in a.get("href","") for a in parsed.find_all("a")) and any("ibm.com" in a.get("href","") for a in parsed.find_all("a")),"Independent sources missing")
          print("PRECHECK_PASSED")
          r=s.patch(endpoint,json={"title":TITLE_NEW,"content":article,"labels":["technology"]},timeout=70);r.raise_for_status()
          new=read()
          check(str(new.get("id"))==PID and new.get("url")==ORIGINAL_URL and new.get("published")==PUBLISHED and new.get("title")==TITLE_NEW and new.get("labels")==["technology"],"CRITICAL: identity changed")
          check(sha(new.get("content",""))==sha(article),"CRITICAL: HTML content changed")
          print("PUBLISHED_AND_VERIFIED: "+ORIGINAL_URL)
          
          PY
