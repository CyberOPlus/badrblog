name: CyberoPlus Editorial - Verified Blogger Taxonomy and Link Repair
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/blogger-editorial-update.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cyberoplus-editorial-one-post
  cancel-in-progress: false
jobs:
  verified-batch-content-corrections:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Install authenticated Blogger library
        run: python -m pip install --disable-pip-version-check "google-auth>=2.20,<3" "requests>=2.31,<3"
      - name: Normalize all existing Blogger article labels and repair verified broken internal link
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
          BLOGGER_CLIENT_SECRET_JSON: ${{ secrets.BLOGGER_CLIENT_SECRET_JSON }}
        run: |
          python - <<'PY'
          import os, re, json, hashlib, time, collections
          from urllib.parse import urlsplit
          from google.auth.transport.requests import AuthorizedSession
          from google.oauth2.credentials import Credentials
          
          BID="2750143140558868280"
          ORIGIN="https://www.cyberoplus.com"
          OLD_BROKEN="https://www.cyberoplus.com/2026/03/network-protocols-rules-explained"
          VERIFIED_DEST="https://www.cyberoplus.com/2026/03/what-is-network-protocol.html"
          DEST_ID="2514711072016023776"
          CANONICAL={"cybersecurity","artificial-intelligence","technology","guides"}
          LEGACY=CANONICAL|{"apps","jobs","networking","digital-policy","Technology","Tutorials"}
          def check(ok,why):
              if not ok:raise RuntimeError(why)
          def sha(s):
              return hashlib.sha256(s.encode("utf-8")).hexdigest()
          token=json.loads(os.environ["BLOGGER_TOKEN_JSON"])
          client=json.loads(os.environ["BLOGGER_CLIENT_SECRET_JSON"])
          conf=client.get("installed") or client.get("web") or {}
          for key in ("client_id","client_secret","token_uri"):
              if not token.get(key) and conf.get(key):token[key]=conf[key]
          session=AuthorizedSession(Credentials.from_authorized_user_info(token))
          base="https://www.googleapis.com/blogger/v3/blogs/"+BID
          check(os.environ.get("BLOGGER_BLOG_ID")==BID,"Wrong target Blog ID")
          b=session.get(base,timeout=35);b.raise_for_status();blog=b.json()
          check(str(blog.get("id"))==BID and (urlsplit(str(blog.get("url",""))).hostname or "").lower() in ("cyberoplus.com","www.cyberoplus.com"),"Wrong target blog")
          # The existing theme expects /search/label/{cybersecurity,artificial-intelligence,technology,guides}.
          # Display names are Cybersecurity, Artificial Intelligence, Technology and Tutorials.
          def category(post):
              title=str(post.get("title","")).lower()
              labels=set(post.get("labels") or [])
              if not labels or not labels.issubset(LEGACY):return None
              if "cybersecurity" in labels:return "cybersecurity"
              if "artificial-intelligence" in labels:return "artificial-intelligence"
              if labels&{"networking","technology","Technology"}:return "technology"
              if labels&{"guides","Tutorials"}:return "guides"
              if "digital-policy" in labels:
                  if "cybersecurity" in title or "الأمن السيبراني" in title:return "cybersecurity"
                  if "ai act" in title or "الذكاء الاصطناعي" in title:return "artificial-intelligence"
                  return "technology"
              if "jobs" in labels:
                  if any(k in title for k in ("شهادات الأمن السيبراني","مسيرتك المهنية في مجال الأمن السيبراني","cybersecurity certifications","cybersecurity career")):
                      return "cybersecurity"
                  return "technology"
              if "apps" in labels:
                  if any(k in title for k in ("الذكاء الاصطناعي","chatgpt","deepseek","midjourney","gemini","claude"," ai tools")):
                      return "artificial-intelligence"
                  if any(k in title for k in ("احتيال","تجسس","أمان","الحماية","الاختراق","الخصوصية","security","defender control","حماية","التصيد","romance scam","malware")):
                      return "cybersecurity"
                  if title.startswith(("كيفية","طريقة","حل خطأ","إصلاح","تثبيت")):
                      return "guides"
                  return "technology"
              return None
          
          def fetch_all():
              allposts=[];next_page=None;seen=set()
              for _ in range(10):
                  params={"status":"live","maxResults":100,"fetchBodies":"false","view":"ADMIN"}
                  if next_page:params["pageToken"]=next_page
                  r=session.get(base+"/posts",params=params,timeout=50);r.raise_for_status()
                  data=r.json()
                  allposts.extend(data.get("items") or [])
                  next_page=data.get("nextPageToken")
                  if not next_page:break
                  check(next_page not in seen,"Repeated pagination token")
                  seen.add(next_page)
              return allposts
          
          def read_post(pid):
              r=session.get(base+"/posts/"+pid,params={"view":"ADMIN","fetchBody":"true"},timeout=50)
              r.raise_for_status()
              return r.json()
          
          posts=fetch_all()
          check(len(posts)>=250 and len(posts)<=320,"Unexpected inventory: "+str(len(posts)))
          ids=[str(p["id"]) for p in posts]
          check(len(ids)==len(set(ids)),"Duplicate post IDs")
          destination=read_post(DEST_ID)
          check(destination.get("url")==VERIFIED_DEST,"Verified replacement link no longer points to expected article")
          changes=0; unchanged=0; skipped=0; links_fixed=0; failures=[];counts=collections.Counter()
          print("INVENTORY_VERIFIED: "+str(len(posts))+" live posts")
          for i,record in enumerate(posts,1):
              pid=str(record["id"])
              try:
                  target=category(record)
                  if target is None:
                      skipped+=1;print("SKIPPED_UNRECOGNIZED_LABELS: "+pid);continue
                  check(target in CANONICAL,"Unsupported label")
                  live=read_post(pid)
                  # The list snapshot acts as a short-lived concurrency guard against simultaneous manual edits.
                  if (str(live.get("id"))!=pid or live.get("url")!=record.get("url") or
                      live.get("title")!=record.get("title") or
                      live.get("updated")!=record.get("updated") or
                      live.get("labels")!=record.get("labels")):
                      skipped+=1;print("SKIPPED_MANUALLY_CHANGED: "+pid);continue
                  # If the editor added new labels since the list call, skip rather than overwrite.
                  if category(live)!=target:
                      skipped+=1;print("SKIPPED_RECLASSIFIED: "+pid);continue
                  oldlabels=live.get("labels") or []
                  oldcontent=live.get("content") or ""
                  newcontent=oldcontent
                  repaired=False
                  if OLD_BROKEN in oldcontent:
                      check(oldcontent.count(OLD_BROKEN)==1,"Unexpected number of broken-link occurrences in "+pid)
                      newcontent=oldcontent.replace(OLD_BROKEN,VERIFIED_DEST)
                      repaired=True
                  update={}
                  if oldlabels!=[target]:update["labels"]=[target]
                  if repaired:update["content"]=newcontent
                  if not update:
                      unchanged+=1;counts[target]+=1;continue
                  # Patch ONLY fields we own. Never send title, publication date, URL or any metadata description.
                  response=session.patch(base+"/posts/"+pid,json=update,timeout=65)
                  response.raise_for_status()
                  after=read_post(pid)
                  check(str(after.get("id"))==pid and after.get("url")==live.get("url") and
                        after.get("published")==live.get("published") and
                        after.get("title")==live.get("title") and
                        after.get("labels")==[target],"Identity or classification verification failed "+pid)
                  check(sha(after.get("content") or "")==sha(newcontent),"Post body unexpectedly changed "+pid)
                  changes+=1;counts[target]+=1
                  if repaired:links_fixed+=1;print("BROKEN_INTERNAL_LINK_FIXED: "+pid)
                  if i%25==0:print("CHECKPOINT_VERIFIED: "+str(i)+"/"+str(len(posts)))
              except Exception as e:
                  failures.append(pid+":"+type(e).__name__+":"+str(e)[:180])
                  print("POST_FAILED: "+failures[-1])
                  if len(failures)>=8:
                      raise RuntimeError("Circuit breaker after 8 post failures; prior successful patches were verified")
          print("BATCH_COMPLETE: "+json.dumps({"inventory":len(posts),"posts_updated":changes,
                                             "unchanged":unchanged,"skipped":skipped,"broken_internal_links_fixed":links_fixed,
                                             "canonical_label_counts":dict(counts),"failures":len(failures)},sort_keys=True))
          if failures:
              raise RuntimeError("Some posts were not updated; details in standard workflow execution output")
          
          PY
