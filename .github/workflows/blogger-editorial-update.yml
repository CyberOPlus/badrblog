name: CyberoPlus Editorial - One Verified Blogger Article
on:
  push:
    branches: [main]
    paths: [".github/workflows/blogger-editorial-update.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cyberoplus-editorial-one-post
  cancel-in-progress: false
jobs:
  apply-verified-content:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install authenticated Blogger client and HTML parser
        run: python -m pip install --disable-pip-version-check "google-auth>=2.20,<3" "requests>=2.31,<3" "beautifulsoup4>=4.12,<5"
      - name: Repair exactly one verified internal link in existing networking quiz
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
          BLOGGER_CLIENT_SECRET_JSON: ${{ secrets.BLOGGER_CLIENT_SECRET_JSON }}
        run: |
          python - <<'PY'
          import os,json,hashlib
          from urllib.parse import urlsplit
          from bs4 import BeautifulSoup
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import AuthorizedSession
          BID="2750143140558868280"
          PID="7487460749439587272"
          URL="https://www.cyberoplus.com/2026/03/network-exercises-solved-interactive.html"
          DATE="2026-03-17T21:11:00Z"
          TITLE="10 Beginner Networking Exercises: OSI, LAN, Topology, TCP and DNS"
          WRONG="https://www.cyberoplus.com/2026/03/osi-vs-tcp-ip-model-differences.html"
          RIGHT="https://www.cyberoplus.com/2026/03/tcpip-vs-osi-model-comparison.html"
          def sha(s):return hashlib.sha256(s.encode("utf-8")).hexdigest()
          def check(c,m):
              if not c:raise RuntimeError(m)
          t=json.loads(os.environ["BLOGGER_TOKEN_JSON"]);c=json.loads(os.environ["BLOGGER_CLIENT_SECRET_JSON"]);cfg=c.get("installed") or c.get("web") or {}
          for k in ("client_id","client_secret","token_uri"):
              if not t.get(k) and cfg.get(k):t[k]=cfg[k]
          session=AuthorizedSession(Credentials.from_authorized_user_info(t))
          api="https://www.googleapis.com/blogger/v3/blogs/"+BID
          check(os.environ.get("BLOGGER_BLOG_ID")==BID,"Wrong blog")
          r=session.get(api,timeout=30);r.raise_for_status()
          check(str(r.json().get("id"))==BID and (urlsplit(r.json().get("url","")).hostname or "").lower() in ("cyberoplus.com","www.cyberoplus.com"),"Wrong domain")
          endpoint=api+"/posts/"+PID
          def get():
              q=session.get(endpoint,params={"view":"ADMIN","fetchBody":"true"},timeout=40);q.raise_for_status();return q.json()
          old=get()
          check(str(old.get("id"))==PID and old.get("url")==URL and old.get("published")==DATE and old.get("title")==TITLE and old.get("labels")==["Tutorials"],"Edited quiz identity mismatch")
          body=old.get("content","")
          check(body.count(WRONG)==1 and RIGHT not in body,"Expected single incorrect link not found")
          new=body.replace(WRONG,RIGHT)
          before=BeautifulSoup(body,"html.parser");after=BeautifulSoup(new,"html.parser")
          check([x.get("src") for x in before.find_all("img")]==[x.get("src") for x in after.find_all("img")],"Media mismatch")
          check(before.get_text(" ",strip=True)==after.get_text(" ",strip=True),"Visible article text changed")
          check([x.get("href") for x in before.find_all("a") if x.get("href")!=WRONG]==[x.get("href") for x in after.find_all("a") if x.get("href")!=RIGHT],"Other links changed")
          print("PRECHECK_PASSED: repairing one broken internal link")
          res=session.patch(endpoint,json={"content":new},timeout=65);res.raise_for_status()
          out=get()
          check(str(out.get("id"))==PID and out.get("url")==URL and out.get("published")==DATE and out.get("title")==TITLE and out.get("labels")==["Tutorials"],"Unexpected metadata mutation")
          check(sha(out.get("content",""))==sha(new),"Updated HTML mismatches")
          print("PUBLISHED_AND_VERIFIED: "+URL)
          print("INTERNAL_LINK_FIXED: "+RIGHT)
          
          PY
