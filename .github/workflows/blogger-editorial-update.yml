name: CyberoPlus Editorial - Physical Layer Guide
on:
  push:
    branches: [main]
    paths: [".github/workflows/blogger-editorial-update.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cyberoplus-editorial-one-post
  cancel-in-progress: false
jobs:
  update-one-verified-blogger-article:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Blogger dependencies
        run: python -m pip install --disable-pip-version-check "google-auth>=2.20,<3" "requests>=2.31,<3" "beautifulsoup4>=4.12,<5"
      - name: Update and re-read the original OSI Physical Layer article
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
          BLOGGER_CLIENT_SECRET_JSON: ${{ secrets.BLOGGER_CLIENT_SECRET_JSON }}
        run: |
          python - <<'PY'
          import os,json,re,hashlib
          from urllib.parse import urlsplit
          from bs4 import BeautifulSoup
          from google.auth.transport.requests import AuthorizedSession
          from google.oauth2.credentials import Credentials
          BLOG_ID="2750143140558868280"
          PID="3856320934457641448"
          OLD_TITLE="Physical Layer: شرح الطبقة الفيزيائية في OSI ووظائفها"
          ORIGINAL_URL="https://www.cyberoplus.com/2026/03/physical-layer-osi-model.html"
          PUBLISHED="2026-03-18T21:29:00Z"
          SOURCE_SHA="8c02426b8ddbc8e64c58130168ec5c8d34517fab5af4304ca5c67efe6ebb7398"
          TITLE="Physical Layer (OSI Layer 1): Signals, Ethernet PHY and Troubleshooting"
          def sha(s):return hashlib.sha256(s.encode("utf-8")).hexdigest()
          def check(c,msg):
              if not c:raise RuntimeError(msg)
          token=json.loads(os.environ["BLOGGER_TOKEN_JSON"])
          client=json.loads(os.environ["BLOGGER_CLIENT_SECRET_JSON"])
          cfg=client.get("installed") or client.get("web") or {}
          for k in ("client_id","client_secret","token_uri"):
              if not token.get(k) and cfg.get(k):token[k]=cfg[k]
          session=AuthorizedSession(Credentials.from_authorized_user_info(token))
          base="https://www.googleapis.com/blogger/v3/blogs/"+BLOG_ID
          check(os.environ.get("BLOGGER_BLOG_ID")==BLOG_ID,"Wrong credentials")
          r=session.get(base,timeout=30);r.raise_for_status()
          check(str(r.json().get("id"))==BLOG_ID and (urlsplit(str(r.json().get("url",""))).hostname or "").lower() in ("cyberoplus.com","www.cyberoplus.com"),"Unexpected target blog")
          endpoint=base+"/posts/"+PID
          def getpost():
              response=session.get(endpoint,params={"view":"ADMIN","fetchBody":"true"},timeout=40)
              response.raise_for_status();return response.json()
          old=getpost()
          check(str(old.get("id"))==PID and old.get("title")==OLD_TITLE and old.get("url")==ORIGINAL_URL and old.get("published")==PUBLISHED and old.get("labels")==["technology"] and sha(old.get("content",""))==SOURCE_SHA,"Article manually changed since source snapshot; no write")
          soup=BeautifulSoup(old["content"],"html.parser")
          images=soup.find_all("img")
          check(len(images)==1,"Original image count changed")
          img=images[0]
          wrapper=img.find_parent("div",class_="separator") or img.find_parent("figure")
          check(wrapper is not None,"Original figure wrapper missing")
          while wrapper.parent and getattr(wrapper.parent,"name",None)=="div" and "separator" in (wrapper.parent.get("class") or []):wrapper=wrapper.parent
          fragment=BeautifulSoup(str(wrapper),"html.parser")
          fragment.find("img")["alt"]="OSI physical layer transmitting electrical optical and radio signals"
          if fragment.find("img").has_attr("title"):fragment.find("img")["title"]=fragment.find("img")["alt"]
          article=r'''<p>The <strong>Physical layer (Layer 1) of the OSI model</strong> is responsible for sending and receiving information as physical signals over a communication medium. It determines how network devices represent data using electrical, optical or radio-frequency signals, along with timing, signaling and interface requirements. Layer 1 is much more than a cable: a physical transceiver must encode and recover data according to the technology used.</p>
          {{IMAGE}}
          <p>In Ethernet, the physical interface is commonly called a <strong>PHY</strong>. On Wi-Fi, the physical layer describes transmission over radio channels. Layer 1 does not independently interpret a website URL, choose an IP route or decide which user is authorized to connect.</p>
          <aside data-type="info"><strong>Position in the network:</strong> this page covers exactly Layer 1. If you need the complete framework first, read our <a href="https://www.cyberoplus.com/2026/03/osi-model-7-layers-explained.html">OSI seven-layer explanation</a>. For the MAC addresses and frame headers above Layer 1, use our <a href="https://www.cyberoplus.com/2026/03/network-frame-structure-header-crc-explained.html">Ethernet frame guide</a>.</aside>
          <h2>What does the Physical layer actually do?</h2>
          <p>The Physical layer offers the lower-level transmission functions needed by data-link technologies. On a sending device it accepts information from the higher link subsystem, encodes and converts it into a suitable signal, and sends it over the medium. On a receiver it detects the physical signal and reconstructs a data stream according to that PHY's specification.</p>
          <p>That conversion can involve multiple sublayers, encoding rules and analog processing. The simplistic statement that a binary 1 is always a high voltage and a binary 0 is always a low voltage is <strong>not generally correct</strong> for modern Ethernet or Wi-Fi.</p>
          <h2>Seven important Physical-layer responsibilities</h2>
          <table><thead><tr><th>Function</th><th>Meaning</th></tr></thead><tbody>
          <tr><td>Signal representation</td><td>Choose the electrical, optical or radio method for carrying information</td></tr>
          <tr><td>Line coding</td><td>Convert data to coded sequences suitable for the PHY</td></tr>
          <tr><td>Modulation</td><td>Map information to physical symbols where the technology requires it</td></tr>
          <tr><td>Synchronization</td><td>Recover symbol or bit timing and recognize transmission boundaries</td></tr>
          <tr><td>Data rate</td><td>Define supported physical operating rates and characteristics</td></tr>
          <tr><td>Media and connectors</td><td>Specify the appropriate cable, optical interface, antenna or other medium</td></tr>
          <tr><td>Link establishment</td><td>Handle PHY-specific link detection and negotiation where available</td></tr>
          </tbody></table>
          <p>These responsibilities vary by technology and Ethernet PHY type. Not every device uses the same coding, negotiation or modulation process.</p>
          <h2>Bits versus symbols: why the distinction matters</h2>
          <p>A <strong>bit</strong> is a binary information unit. A <strong>symbol</strong> is one distinct physical signaling state or modulation event used by a communication system. Depending on the encoding, a symbol can represent part of a bit, one bit, multiple bits or a more complex coded relationship.</p>
          <p>For example, the mapping between bit rate and symbol rate depends on modulation order, coding overhead and the number of signal paths. It is incorrect to claim that every one-gigabit-per-second Ethernet interface sends exactly one billion independent voltage pulses per second.</p>
          <aside data-type="warning"><strong>Do not mix up bit rate and symbol rate.</strong> Transmission standards can use coding, multi-level signaling and multiple pairs or channels. Bandwidth, signaling rate and actual delivered application throughput are different quantities.</aside>
          <h2>How copper Ethernet carries data</h2>
          <p>Twisted-pair Ethernet uses electrical signaling across copper conductors. A PHY is designed for the supported cabling, connectors, frequency response, link distance and signaling scheme. The name of a cabling category alone does not guarantee a particular connection speed or successful link negotiation.</p>
          <h3>What is a PHY and why is it important?</h3>
          <p>Within IEEE 802.3 systems, the PHY provides functions between the MAC-related interface and the physical medium. Specific architectures can distinguish <strong>PCS (Physical Coding Sublayer)</strong>, <strong>PMA (Physical Medium Attachment)</strong> and <strong>PMD (Physical Medium Dependent)</strong>. The exact subdivision depends on the PHY specification.</p>
          <p>For example, 1000BASE-X PHYs can use 8B/10B coding; other Ethernet families use other schemes. You should not assume that one coding method applies to all Ethernet speeds. The <a href="https://standards.ieee.org/ieee/802.3/10422/" rel="noopener noreferrer">IEEE 802.3 Ethernet standard</a> describes selected Ethernet PHYs for copper, fiber, backplanes and related environments.</p>
          <h2>What happens on a fiber-optic Ethernet link?</h2>
          <p>Fiber-optic networking carries information using modulated optical signals. A transmitter converts the outgoing data into light according to its optical interface, and a receiver processes the incoming light to recover the encoded information. The supported wavelength, fiber type, optical budget, connector and transceiver design all affect compatibility.</p>
          <p>Light does not mean that every optical link automatically supports the same distance or rate. Single-mode and multimode fiber deployments have different practical uses, and compatibility requires checking the actual Ethernet standard and vendor specifications.</p>
          <p>For the media details, read our <a href="https://www.cyberoplus.com/2026/03/fiber-optic-cable-networking-guide.html">fiber-optic cable and transceiver guide</a>.</p>
          <h2>How Wi-Fi uses the Physical layer</h2>
          <p>Wi-Fi is based on IEEE 802.11 and transmits through radio waves instead of a conventional copper Ethernet PHY. The Wi-Fi PHY specifies aspects of radio signaling, channels, coding and modulation. Depending on the 802.11 generation and configuration, technologies can include OFDM or OFDMA, multiple spatial streams and other features.</p>
          <p>The <strong>Wi-Fi MAC layer</strong> separately defines how devices contend for or coordinate use of the shared wireless medium. Do not treat Wi-Fi channel selection, association, encryption and routing as identical PHY operations. PHY and MAC cooperate but have different responsibilities.</p>
          <h2>From an Ethernet frame to an on-wire signal</h2>
          <ol data-steps>
          <li>An application supplies data through the host networking stack.</li>
          <li>Network and transport protocols prepare their packet or segment data as appropriate.</li>
          <li>Ethernet's link-layer logic forms a frame containing local MAC addressing and other necessary fields.</li>
          <li>The selected Ethernet PHY handles the required physical encoding, signaling and transmission for its configured link.</li>
          <li>The receiver's PHY reconstructs the transmitted data stream and passes it to the link-layer logic.</li>
          <li>Higher layers interpret the frame's payload according to the encapsulated protocol.</li>
          </ol>
          <p>This is a functional sketch. Hardware offloading, buffering, frame checks, internal interfaces and exact implementation details vary across devices. The <a href="https://www.cyberoplus.com/2026/04/ethernet-protocol-how-it-works.html">Ethernet technology overview</a> explains the whole local-link process at a wider level.</p>
          <h2>Physical layer versus Data Link layer</h2>
          <table><thead><tr><th>Question</th><th>Layer 1: Physical</th><th>Layer 2: Data Link</th></tr></thead><tbody>
          <tr><td>What is transmitted?</td><td>Physical signals encoding a data stream</td><td>Frames using link-layer structure</td></tr>
          <tr><td>What is addressed?</td><td>Physical interface and medium characteristics</td><td>Local link-layer addresses such as Ethernet MAC</td></tr>
          <tr><td>Typical concepts</td><td>Connectors, PHY, synchronization, signaling, modulation</td><td>Ethernet frame, MAC address, FCS, bridge forwarding</td></tr>
          <tr><td>Common initial symptom</td><td>Link not established or signal errors</td><td>Unexpected VLAN, MAC learning or frame forwarding behavior</td></tr>
          </tbody></table>
          <p>The comparison is conceptual, not an assertion that every product's internal hardware cleanly splits at a single physical boundary. A NIC commonly implements several related functions in one device.</p>
          <h2>Does the Physical layer transmit 'bits'?</h2>
          <p>Networking textbooks often call the Layer 1 protocol data unit <strong>bits</strong>. That is a useful abstraction, but a modern physical channel may use coded symbols, multilevel modulation, serialization and parallel lanes to transmit information. The concept of bits describes the recovered digital information, not a claim that each bit is a distinct voltage pulse on the medium.</p>
          <h2>Which networking devices work at Layer 1?</h2>
          <p>Physical-layer responsibilities appear in transceivers, PHY chips, media converters, repeaters, cables, connectors and optical modules. A classic Ethernet repeater or hub can operate without examining the destination IP address. Switches, routers and wireless access points also contain Layer 1 interfaces even though their overall functions are broader.</p>
          <p>In practical device identification, distinguish a <strong>component's Physical-layer function</strong> from the entire product. Our <a href="https://www.cyberoplus.com/2026/03/network-devices-hub-switch-router-firewall.html">hub, switch, router, AP and firewall comparison</a> explains why a modern appliance may implement several layers.</p>
          <h2>What Layer 1 does not do</h2>
          <ul>
          <li>It does <strong>not</strong> choose IP routes across networks.</li>
          <li>It does <strong>not</strong> perform DNS lookups.</li>
          <li>It does <strong>not</strong> interpret HTTP pages or application messages.</li>
          <li>It does <strong>not</strong> normally make Ethernet MAC learning decisions for bridge forwarding.</li>
          <li>It does <strong>not</strong> guarantee that a physical link being up means that IP or an application will work.</li>
          </ul>
          <h2>Physical layer errors and what they can mean</h2>
          <h3>The Ethernet port shows no link</h3>
          <p>Check the cable seating, connector, transceiver, device power, switch port state and correct interface. A link indicator that remains off can reflect a broken cable, incompatible transceiver, disabled port or other physical negotiation issue.</p>
          <h3>Link comes up but the speed is lower than expected</h3>
          <p>Inspect the negotiated speed, cabling category and quality, both connected interfaces' capabilities, and any documented PHY or transceiver restrictions. A label on the cable does not prove that every link segment supports the desired mode.</p>
          <h3>Increasing CRC, FCS or symbol errors</h3>
          <p>Error counters can be clues to cabling, signal quality, optical power, connectors, interference or hardware faults, depending on the technology. However, FCS error detection belongs to the link-level frame check, even when underlying physical problems are the root cause. Inspect the counter definitions in the device manual before drawing conclusions.</p>
          <h3>Wi-Fi connection has poor signal</h3>
          <p>Check distance, obstructions, channel conditions, interference, antenna placement and client capabilities. Good signal strength alone does not prove that the Internet application or DNS works correctly.</p>
          <h2>A practical Layer 1 troubleshooting workflow</h2>
          <ol data-steps>
          <li>Determine whether the problem affects wired Ethernet, fiber or Wi-Fi.</li>
          <li>Check interface status and whether the physical link is established.</li>
          <li>Confirm that devices and transceivers are powered and enabled.</li>
          <li>Inspect cables, ports, connectors, optics or radio conditions as appropriate.</li>
          <li>Check supported link speed and negotiation settings on both ends.</li>
          <li>Look for physical error counters, optical alarms or excessive retransmission symptoms as supported by the device.</li>
          <li>Only after physical connectivity is established, investigate the link, IP addressing, routing, DNS and application behavior.</li>
          </ol>
          <aside data-type="info"><strong>Diagnostic limitation:</strong> a 'link up' indication tells you that a physical connection is established according to the device; it does not prove that VLAN assignment, DHCP, routing or the desired application is functioning.</aside>
          <h2>Why understanding Layer 1 helps with networking</h2>
          <p>The Physical layer is the foundation on which higher layers depend. You may configure the correct IP addresses and routing tables, but a broken physical path still prevents ordinary communication. At the same time, functioning physical links alone cannot guarantee that a network service is reachable. Separating those questions lets you troubleshoot more efficiently.</p>
          <p>Test your understanding with the <a href="https://www.cyberoplus.com/2026/03/network-exercises-solved-interactive.html">solved networking exercises</a>, especially the problems that distinguish physical link loss from DNS and routing faults.</p>
          <h2>Sources and further reading</h2>
          <ul>
          <li><a href="https://standards.ieee.org/ieee/802.3/10422/" rel="noopener noreferrer">IEEE: Ethernet standard and Physical-layer overview</a></li>
          <li><a href="https://technav.ieee.org/topic/physical-layer/" rel="noopener noreferrer">IEEE Technology Navigator: Physical layer</a></li>
          <li><a href="https://docs.amd.com/r/7.2-English/pg138-axi-ethernet/PCS/PMA" rel="noopener noreferrer">AMD: 1000BASE-X PCS and PMA implementation details</a></li>
          <li><a href="https://www.wireshark.org/faq.html" rel="noopener noreferrer">Wireshark: packet capture and visibility limitations</a></li>
          <li><a href="https://www.iso.org/standard/20269.html" rel="noopener noreferrer">ISO/IEC 7498-1: OSI basic reference model</a></li>
          </ul>'''
          article=article.replace("{{IMAGE}}",str(fragment))
          parsed=BeautifulSoup(article,"html.parser")
          check(len(article)>12000 and len(parsed.find_all("h2"))>=15,"Incomplete physical layer guide")
          check(len(parsed.find_all("img"))==1 and parsed.find("img").get("src")==img.get("src"),"Original image lost")
          check(not re.search(r"[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF]",article),"Arabic body remains")
          check(all(k in article for k in ("PHY","PCS","PMA","PMD","Wi-Fi","Fiber","802.3","Layer 1")),"Critical concepts missing")
          check(sum("cyberoplus.com" in a.get("href","") for a in parsed.find_all("a"))>=4,"Internal article links absent")
          print("PRECHECK_PASSED")
          r=session.patch(endpoint,json={"title":TITLE,"content":article,"labels":["technology"]},timeout=70);r.raise_for_status()
          after=getpost()
          check(str(after.get("id"))==PID and after.get("url")==ORIGINAL_URL and after.get("published")==PUBLISHED and after.get("title")==TITLE and after.get("labels")==["technology"],"CRITICAL: Article metadata mismatch")
          check(sha(after.get("content",""))==sha(article),"CRITICAL: Published body mismatch")
          print("PUBLISHED_AND_VERIFIED: "+ORIGINAL_URL)
          print("ORIGINAL_DATE_PRESERVED: "+PUBLISHED)
          
          PY
