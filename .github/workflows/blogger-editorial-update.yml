name: CyberoPlus Editorial - One Verified Blogger Article
on:
  push:
    branches: [main]
    paths: [".github/workflows/blogger-editorial-update.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cyberoplus-editorial-one-post
  cancel-in-progress: false
jobs:
  apply-verified-content:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install authentication and HTML parser
        run: python -m pip install --disable-pip-version-check "google-auth>=2.20,<3" "requests>=2.31,<3" "beautifulsoup4>=4.12,<5"
      - name: Verify source and edit OSI versus TCP/IP comparison
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
          BLOGGER_CLIENT_SECRET_JSON: ${{ secrets.BLOGGER_CLIENT_SECRET_JSON }}
        run: |
          python - <<'PY'
          import os,json,re,hashlib
          from urllib.parse import urlsplit
          from bs4 import BeautifulSoup
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import AuthorizedSession
          BID="2750143140558868280"
          PID="5678460729615741263"
          OLD_TITLE="TCP/IP مقابل OSI: الفرق بين النموذجين وكيف يعمل الإنترنت فعليًا"
          ORIGINAL_URL="https://www.cyberoplus.com/2026/03/tcpip-vs-osi-model-comparison.html"
          PUBLISHED="2026-03-16T23:11:00Z"
          SOURCE_SHA="3509b27425d24bfce549f59424bb5e19bc1009bb71995f505d2537d3765b313e"
          TITLE="OSI vs TCP/IP: Layer Comparison and How the Internet Works"
          def sha(s):return hashlib.sha256(s.encode("utf-8")).hexdigest()
          def check(c,m):
              if not c:raise RuntimeError(m)
          token=json.loads(os.environ["BLOGGER_TOKEN_JSON"]);client=json.loads(os.environ["BLOGGER_CLIENT_SECRET_JSON"]);conf=client.get("installed") or client.get("web") or {}
          for key in ("client_id","client_secret","token_uri"):
              if not token.get(key) and conf.get(key):token[key]=conf[key]
          s=AuthorizedSession(Credentials.from_authorized_user_info(token));api="https://www.googleapis.com/blogger/v3/blogs/"+BID
          check(os.environ.get("BLOGGER_BLOG_ID")==BID,"Wrong blog")
          r=s.get(api,timeout=30);r.raise_for_status()
          check(str(r.json().get("id"))==BID and (urlsplit(r.json().get("url","")).hostname or "").lower() in ("cyberoplus.com","www.cyberoplus.com"),"Wrong domain")
          endpoint=api+"/posts/"+PID
          def get():
              r=s.get(endpoint,params={"view":"ADMIN","fetchBody":"true"},timeout=40);r.raise_for_status();return r.json()
          old=get()
          check(str(old.get("id"))==PID and old.get("title")==OLD_TITLE and old.get("url")==ORIGINAL_URL and old.get("published")==PUBLISHED and old.get("labels")==["networking"] and sha(old.get("content",""))==SOURCE_SHA,"Original post changed")
          soup=BeautifulSoup(old["content"],"html.parser")
          imgs=soup.find_all("img");check(len(imgs)==1,"Media count differs")
          img=imgs[0];box=img.find_parent("div",class_="separator") or img.find_parent("figure")
          check(box is not None,"Image wrapper missing")
          node=BeautifulSoup(str(box),"html.parser");node.find("img")["alt"]="Diagram comparing seven OSI reference layers with four TCP IP layers"
          article=r'''<p><strong>OSI and TCP/IP are not rival networking products.</strong> The seven-layer OSI model is a conceptual way to understand network responsibilities, while the TCP/IP protocol suite describes the protocols that underpin today's Internet. This guide compares their layers, explains how real data travels across networks, and shows why HTTP/3 and QUIC make rigid protocol-to-layer assignments misleading.</p>
          {{IMG}}
          <aside data-type="info"><strong>Quick distinction:</strong> OSI is a seven-layer reference model defined by ISO. TCP/IP is an implemented family of standards such as IP, TCP, UDP, DNS and HTTP. The TCP/IP architecture is commonly represented with four layers, but some textbooks use a five-layer teaching model separating the Link and Physical functions.</aside>
          <h2>OSI versus TCP/IP: comparison table</h2>
          <table><thead><tr><th>Feature</th><th>OSI model</th><th>TCP/IP architecture</th></tr></thead><tbody>
          <tr><td>Purpose</td><td>Reference model for network functions and interconnection concepts</td><td>Internet protocols and practical communication architecture</td></tr>
          <tr><td>Common layer count</td><td>Seven</td><td>Four, or five in some teaching diagrams</td></tr>
          <tr><td>Highest conceptual functions</td><td>Application, Presentation, Session</td><td>Usually grouped in the Application layer</td></tr>
          <tr><td>End-to-end transport</td><td>Transport layer</td><td>Transport layer, such as TCP or UDP</td></tr>
          <tr><td>Routing</td><td>Network layer</td><td>Internet layer, based on IP</td></tr>
          <tr><td>Local delivery and signals</td><td>Data Link and Physical</td><td>Link layer, sometimes shown as Link and Physical</td></tr>
          <tr><td>Primary standards</td><td>ISO/IEC 7498-1 reference model</td><td>IETF and other Internet-related specifications</td></tr>
          </tbody></table>
          <p>Neither layer count indicates performance or quality. What matters for implementation is the specific protocol, interface, application and operating environment.</p>
          <h2>What are the seven OSI layers?</h2>
          <ol data-steps>
          <li><strong>Physical (1):</strong> signaling and transmission media, such as Ethernet PHY connections.</li>
          <li><strong>Data Link (2):</strong> local framing and access to a link, such as Ethernet frames and MAC address forwarding.</li>
          <li><strong>Network (3):</strong> logical addressing and forwarding between networks, such as IP routing.</li>
          <li><strong>Transport (4):</strong> end-to-end communication services between applications.</li>
          <li><strong>Session (5):</strong> coordination of communication dialogs and exchange state.</li>
          <li><strong>Presentation (6):</strong> data representation, encoding and transformations.</li>
          <li><strong>Application (7):</strong> communication services used by network applications.</li>
          </ol>
          <p>Read the <a href="https://www.cyberoplus.com/2026/03/osi-model-7-layers-explained.html">complete OSI seven-layer guide</a> for the function and troubleshooting examples of each layer. This comparison article focuses instead on the relationship between reference-model labels and real Internet protocols.</p>
          <h2>The TCP/IP layers in the four-layer view</h2>
          <h3>Application layer</h3>
          <p>Application protocols and supporting services include HTTP, DNS, SMTP and SSH. Data formatting, authentication, encryption and the management of application sessions may be implemented within applications and their supporting protocol libraries. There is no universal separate OSI-style Session or Presentation layer in the deployed TCP/IP architecture.</p>
          <h3>Transport layer</h3>
          <p>Common Internet transport protocols include <strong>TCP</strong> and <strong>UDP</strong>. TCP provides a reliable, in-order byte stream to applications. UDP carries datagrams with limited built-in guarantees. Both use ports for addressing transport endpoints.</p>
          <h3>Internet layer</h3>
          <p><strong>IPv4 and IPv6</strong> packets carry data between IP networks, with routers forwarding according to destination addresses and routing decisions. Related mechanisms include ICMP, important for network diagnostics and error reporting. Neither IP version guarantees in-order application delivery simply by forwarding packets.</p>
          <h3>Link layer</h3>
          <p>The Link layer describes how packets are sent over the next local segment using technologies such as Ethernet or Wi-Fi. On Ethernet, an IP packet is usually carried in an Ethernet frame with local source and destination MAC addresses. Physical-media functions are often grouped here in a four-layer model.</p>
          <h2>How do the layers map?</h2>
          <table><thead><tr><th>OSI layer</th><th>Typical TCP/IP representation</th><th>Examples and caveats</th></tr></thead><tbody>
          <tr><td>7 Application</td><td>Application</td><td>HTTP, DNS and other application protocols</td></tr>
          <tr><td>6 Presentation</td><td>Application-related functions</td><td>Encoding, serialization and transformations</td></tr>
          <tr><td>5 Session</td><td>Application-related functions</td><td>Managing communication state and dialogs</td></tr>
          <tr><td>4 Transport</td><td>Transport</td><td>TCP and UDP; QUIC spans several conceptual concerns</td></tr>
          <tr><td>3 Network</td><td>Internet</td><td>IPv4, IPv6 and routing</td></tr>
          <tr><td>2 Data Link</td><td>Link</td><td>Ethernet frames and switching</td></tr>
          <tr><td>1 Physical</td><td>Link, or separate Physical in 5-layer textbooks</td><td>Media, interfaces and signaling</td></tr>
          </tbody></table>
          <aside data-type="warning"><strong>Do not treat this mapping as a law.</strong> The columns describe educational approximations. Protocols often contain functions that cross conceptual OSI boundaries; rigidly assigning TLS, QUIC or every application session to exactly one OSI layer can produce incorrect explanations.</aside>
          <h2>Does TCP/IP mean one protocol or two protocols?</h2>
          <p><strong>TCP/IP</strong> often refers to the entire Internet protocol suite rather than only the two named protocols. Its two names historically emphasize Transmission Control Protocol and Internet Protocol, but applications also use UDP, ICMP, DNS, and other protocols. Modern HTTP/3 uses QUIC over UDP, so Internet communication is not restricted to TCP.</p>
          <p>The base Internet host requirements in <a href="https://www.rfc-editor.org/rfc/rfc1122.html" rel="noopener noreferrer">RFC 1122</a> discuss link, IP and transport layers; companion <a href="https://www.rfc-editor.org/rfc/rfc1123.html" rel="noopener noreferrer">RFC 1123</a> covers application and support protocols. Those documents demonstrate how real standards organize requirements without assuming that every OSI reference layer has a dedicated deployed protocol.</p>
          <h2>Real example: opening a website using HTTP/2 over TCP</h2>
          <p>Consider a simplified browser connecting to <code>https://example.com/</code> over HTTP/2 and TCP. Actual browsers can cache names, reuse connections or negotiate different versions.</p>
          <ol data-steps>
          <li><strong>Application:</strong> the browser uses a URL and may ask a resolver for the site's IP address.</li>
          <li><strong>Transport:</strong> the browser establishes TCP communication with the intended service, commonly at port <code>443</code>.</li>
          <li><strong>Security:</strong> TLS negotiates protection for HTTPS; treating TLS as an isolated mandatory OSI Layer 6 is too simplistic.</li>
          <li><strong>Internet:</strong> the host sends IP packets addressed to the selected destination IP.</li>
          <li><strong>Link:</strong> each local hop transmits the IP packet in a suitable link-layer frame, such as Ethernet.</li>
          <li><strong>Physical:</strong> an appropriate physical interface conveys the encoded signals across cable, fiber or radio media.</li>
          <li><strong>Return path:</strong> the server responds, and the client's stack delivers data through the applicable layers to the browser.</li>
          </ol>
          <p>A local Ethernet destination MAC address may be the <strong>default gateway's MAC</strong>, not the remote web server's MAC. Routers replace link-layer framing at each hop as they forward IP packets toward the destination.</p>
          <h2>Encapsulation: data, segments, packets and frames</h2>
          <p>For a TCP connection over Ethernet, a useful schematic is:</p>
          <pre><code>Application data
             inside TCP segment
                inside IP packet
                   inside Ethernet frame
                      transmitted as physical signals</code></pre>
          <p>A frame and an IP packet are not interchangeable names. The Ethernet frame addresses delivery on its local link, while IP supports forwarding across multiple networks. The same IP packet may receive different local link-layer wrappers at successive network hops.</p>
          <p>When receiving traffic, the host processes the relevant encapsulation and delivers the payload to the intended transport endpoint and application. Not every protocol adds a header corresponding neatly to one of the seven OSI layers.</p>
          <h2>Does HTTP always use TCP?</h2>
          <p>No. Traditional HTTP/1.1 and HTTP/2 connections usually run over TCP, often with TLS for HTTPS. <strong>HTTP/3</strong> uses <strong>QUIC over UDP</strong>, as specified by <a href="https://www.rfc-editor.org/rfc/rfc9114.html" rel="noopener noreferrer">RFC 9114</a>. QUIC provides its own protected connections, streams, recovery and transport behavior while using UDP datagrams to traverse IP networks.</p>
          <p>The existence of QUIC shows why labeling every feature as one exclusive OSI layer obscures actual protocol architecture. <a href="https://www.rfc-editor.org/rfc/rfc9000.html" rel="noopener noreferrer">RFC 9000</a> is the authoritative starting point for QUIC's core design.</p>
          <h2>Where does TLS belong in the models?</h2>
          <p>TLS is responsible for communication security, including authentication and encryption in common Internet applications. The real placement of TLS depends on the protocol using it. For example, HTTPS over TCP typically uses TLS above TCP; QUIC integrates TLS 1.3 handshake mechanisms into its transport.</p>
          <p>It can be <em>helpful</em> to describe encryption or representation as Presentation-like functions, but that analogy is not the same as saying modern TLS is formally a dedicated OSI Layer 6 protocol in all deployments.</p>
          <h2>Is OSI useful when the Internet uses TCP/IP?</h2>
          <p>Yes. OSI is a shared language for discussing responsibilities. A no-link error suggests physical connectivity checks; the wrong VLAN or MAC forwarding behavior involves Data Link questions; missing routes involve IP; an unavailable TCP service suggests a transport or service problem.</p>
          <p>A layered troubleshooting process helps isolate a fault, but problems often span multiple layers. A security firewall can filter based on IP addresses, ports, connection state or even application content. Modern switches may also have IP-routing capabilities.</p>
          <h2>Common student misconceptions</h2>
          <ul>
          <li><strong>TCP/IP has exactly four layers in every textbook:</strong> the five-layer teaching view is also common.</li>
          <li><strong>OSI is obsolete and useless:</strong> it remains valuable as a reference and troubleshooting vocabulary.</li>
          <li><strong>TCP/IP consists of TCP and IP only:</strong> it is a broader suite.</li>
          <li><strong>The OSI Transport layer always means TCP:</strong> UDP and other protocol designs also matter.</li>
          <li><strong>HTTP always uses TCP:</strong> HTTP/3 runs on QUIC over UDP.</li>
          <li><strong>Every device belongs to exactly one layer:</strong> real switches, routers and firewalls can implement multiple functions.</li>
          <li><strong>One application message equals one packet:</strong> segmentation, buffering, retransmission and MTU constraints make that assumption wrong.</li>
          <li><strong>A router simply preserves the entire Ethernet frame:</strong> frames are processed and replaced between links.</li>
          </ul>
          <h2>How to learn OSI and TCP/IP together</h2>
          <ol data-steps>
          <li>Learn the seven OSI functions and explain what problem each one addresses.</li>
          <li>Learn the four TCP/IP concepts and the basic purposes of Ethernet, IP, TCP, UDP, DNS and HTTP.</li>
          <li>Trace one request from a browser to a server, distinguishing frames, IP packets and transport data.</li>
          <li>Explain why routers can change local MAC addresses while the IP destination still names a remote host.</li>
          <li>Study HTTP/3 and QUIC as a counterexample to rigid layer mapping.</li>
          <li>Practice with our <a href="https://www.cyberoplus.com/2026/03/network-exercises-solved-interactive.html">ten solved networking exercises</a>.</li>
          </ol>
          <h2>Original standards and technical sources</h2>
          <ul>
          <li><a href="https://www.iso.org/standard/20269.html" rel="noopener noreferrer">ISO/IEC 7498-1 — OSI basic reference model</a></li>
          <li><a href="https://www.rfc-editor.org/rfc/rfc1122.html" rel="noopener noreferrer">RFC 1122 — Internet host communications requirements</a></li>
          <li><a href="https://www.rfc-editor.org/rfc/rfc1123.html" rel="noopener noreferrer">RFC 1123 — Internet application and support requirements</a></li>
          <li><a href="https://www.rfc-editor.org/rfc/rfc9293.html" rel="noopener noreferrer">RFC 9293 — TCP specification</a></li>
          <li><a href="https://www.rfc-editor.org/rfc/rfc9000.html" rel="noopener noreferrer">RFC 9000 — QUIC transport</a></li>
          <li><a href="https://www.rfc-editor.org/rfc/rfc9114.html" rel="noopener noreferrer">RFC 9114 — HTTP/3</a></li>
          </ul>'''
          article=article.replace("{{IMG}}",str(node))
          parsed=BeautifulSoup(article,"html.parser")
          check(len(article)>10000 and len(parsed.find_all("h2"))>=12,"Article coverage insufficient")
          check(len(parsed.find_all("img"))==1 and parsed.find("img").get("src")==img.get("src"),"Original image missing")
          check(not re.search(r"[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF]",article),"Untranslated text")
          check("HTTP/3" in article and "RFC 1122" in article and "QUIC" in article and "four layers" in article,"Key concepts missing")
          check(any("iso.org" in a.get("href","") for a in parsed.find_all("a")) and any("rfc-editor.org" in a.get("href","") for a in parsed.find_all("a")),"Sources missing")
          check(any("osi-model-7-layers-explained.html" in a.get("href","") for a in parsed.find_all("a")),"Related published OSI link missing")
          print("PRECHECK_PASSED")
          r=s.patch(endpoint,json={"title":TITLE,"content":article,"labels":["Technology"]},timeout=60);r.raise_for_status()
          after=get()
          check(str(after.get("id"))==PID and after.get("url")==ORIGINAL_URL and after.get("published")==PUBLISHED and after.get("title")==TITLE and after.get("labels")==["Technology"],"CRITICAL: Post metadata mismatch")
          check(sha(after.get("content",""))==sha(article),"CRITICAL: Published HTML mismatch")
          print("PUBLISHED_AND_VERIFIED: "+ORIGINAL_URL)
          
          PY
