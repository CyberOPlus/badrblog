name: CyberoPlus Editorial - Networking Number Systems
on:
  push:
    branches: [main]
    paths: [".github/workflows/blogger-editorial-update.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cyberoplus-editorial-one-post
  cancel-in-progress: false
jobs:
  update-one-verified-post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Blogger authorization and HTML parsing
        run: python -m pip install --disable-pip-version-check "google-auth>=2.20,<3" "requests>=2.31,<3" "beautifulsoup4>=4.12,<5"
      - name: Update existing number systems article and re-read Blogger
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
          BLOGGER_CLIENT_SECRET_JSON: ${{ secrets.BLOGGER_CLIENT_SECRET_JSON }}
        run: |
          python - <<'PY'
          import os,json,re,hashlib
          from urllib.parse import urlsplit
          from bs4 import BeautifulSoup
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import AuthorizedSession
          BLOG_ID="2750143140558868280"
          PID="4575642421591096050"
          OLD_TITLE="Binary وDecimal وHex في الشبكات: التحويل والتطبيق العملي"
          URL="https://www.cyberoplus.com/2026/03/number-systems-binary-decimal-hexadecimal-networks.html"
          PUBLISHED="2026-03-20T10:36:00Z"
          OLD_SHA="050b4bef103879e0cc53b5c8c27834f1c34ac776cd3f760bdb3dffe7e0e6e249"
          TITLE="Binary, Decimal and Hexadecimal for Networking: Conversions and Subnetting"
          def sha(s):return hashlib.sha256(s.encode("utf-8")).hexdigest()
          def check(c,msg):
              if not c:raise RuntimeError(msg)
          token=json.loads(os.environ["BLOGGER_TOKEN_JSON"])
          client=json.loads(os.environ["BLOGGER_CLIENT_SECRET_JSON"])
          cfg=client.get("installed") or client.get("web") or {}
          for k in ("client_id","client_secret","token_uri"):
              if not token.get(k) and cfg.get(k):token[k]=cfg[k]
          s=AuthorizedSession(Credentials.from_authorized_user_info(token))
          base="https://www.googleapis.com/blogger/v3/blogs/"+BLOG_ID
          check(os.environ.get("BLOGGER_BLOG_ID")==BLOG_ID,"Wrong blog credentials")
          r=s.get(base,timeout=30);r.raise_for_status()
          check(str(r.json().get("id"))==BLOG_ID and (urlsplit(str(r.json().get("url",""))).hostname or "").lower() in ("cyberoplus.com","www.cyberoplus.com"),"Wrong blog")
          endpoint=base+"/posts/"+PID
          def getpost():
              r=s.get(endpoint,params={"view":"ADMIN","fetchBody":"true"},timeout=45);r.raise_for_status();return r.json()
          old=getpost()
          check(str(old.get("id"))==PID and old.get("title")==OLD_TITLE and old.get("url")==URL and old.get("published")==PUBLISHED and old.get("labels")==["technology"] and sha(old.get("content",""))==OLD_SHA,"Original manually edited, no write")
          soup=BeautifulSoup(old["content"],"html.parser")
          images=soup.find_all("img")
          check(len(images)==1,"Unexpected original image count")
          img=images[0]
          wrap=img.find_parent("div",class_="separator") or img.find_parent("figure")
          check(wrap is not None,"Original image wrapper missing")
          while wrap.parent and getattr(wrap.parent,"name",None)=="div" and "separator" in (wrap.parent.get("class") or []):wrap=wrap.parent
          fragment=BeautifulSoup(str(wrap),"html.parser")
          fragment.find("img")["alt"]="Binary decimal hexadecimal conversions for IPv4 IPv6 and MAC addresses"
          article=r'''<p>Understanding <strong>binary, decimal and hexadecimal</strong> makes IPv4 subnetting, IPv6 notation, MAC addresses and Ethernet protocol fields much easier to read. The same bits can be written in different number systems: <code>255</code> in decimal equals <code>11111111</code> in binary and <code>FF</code> in hexadecimal. This guide teaches the conversions step by step, then applies them to real networking examples.</p>
          {{IMG}}
          <h2>What does the base of a number mean?</h2>
          <p>A number system's <strong>base</strong> specifies which symbols it uses and the weight of each digit position. Decimal is base 10, binary is base 2, and hexadecimal is base 16. The underlying value does not change when we represent it using another base.</p>
          <table><thead><tr><th>System</th><th>Base</th><th>Digits</th><th>Networking applications</th></tr></thead><tbody>
          <tr><td>Decimal</td><td>10</td><td>0–9</td><td>IPv4 dotted-decimal octets and interface settings</td></tr>
          <tr><td>Binary</td><td>2</td><td>0–1</td><td>Address bit patterns, masks and prefix calculations</td></tr>
          <tr><td>Hexadecimal</td><td>16</td><td>0–9 and A–F</td><td>IPv6, MAC addresses, EtherTypes and packet bytes</td></tr>
          </tbody></table>
          <p>Consider the decimal number 257: <code>2 × 100 + 5 × 10 + 7 × 1 = 257</code>. In other bases, the same positional principle applies but each position carries a different power of that base.</p>
          <h2>Why decimal appears in IPv4 addresses</h2>
          <p>IPv4 uses a <strong>32-bit address</strong>, conventionally displayed as four decimal octets separated by dots. For example, <code>192.168.1.10</code> consists of four values, each between 0 and 255. The dots are a human-readable representation of the underlying 32 bits, not part of the binary address itself.</p>
          <p>A value of 256 cannot fit into a single 8-bit IPv4 octet because eight bits can represent only <strong>2<sup>8</sup> = 256 distinct values</strong>, from 0 through 255 inclusive.</p>
          <h2>Binary place values: from 128 down to 1</h2>
          <p>One binary bit is either <code>0</code> or <code>1</code>. In an eight-bit value, the place values from left to right are:</p>
          <pre><code>128  64  32  16   8   4   2   1
            1   1   0   0   0   0   0   0  = 192</code></pre>
          <p>Here <code>11000000</code> equals <code>128 + 64 = 192</code>. The most significant bit is at the left, and the least significant bit is at the right in this conventional written representation.</p>
          <h2>Convert binary to decimal</h2>
          <p>To convert a binary value, sum the weights wherever the bit is <code>1</code>. For example:</p>
          <pre><code>Binary:  10101100
          Weights: 128 64 32 16 8 4 2 1
          Result:  128 + 32 + 8 + 4 = 172</code></pre>
          <p>Every bit position with a zero contributes nothing to the sum. You do not need to memorize a separate result for every possible eight-bit pattern; learning the eight powers of two is sufficient.</p>
          <h2>Convert decimal to binary</h2>
          <p>To write 202 in binary, subtract powers of two from the largest available weight:</p>
          <pre><code>202 - 128 = 74    (bit 128 = 1)
           74 -  64 = 10    (bit  64 = 1)
           10 -   8 =  2    (bit   8 = 1)
            2 -   2 =  0    (bit   2 = 1)
          
          202 decimal = 11001010 binary</code></pre>
          <p>The eight bit positions are <code>128, 64, 32, 16, 8, 4, 2, 1</code>, so the enabled positions above are 128, 64, 8 and 2. Dividing the number by two repeatedly and recording remainders is another valid conversion method.</p>
          <h2>Convert a complete IPv4 address to binary</h2>
          <p>Convert each dotted-decimal octet separately:</p>
          <table><thead><tr><th>Decimal octet</th><th>Eight-bit binary</th></tr></thead><tbody>
          <tr><td>192</td><td><code>11000000</code></td></tr>
          <tr><td>168</td><td><code>10101000</code></td></tr>
          <tr><td>1</td><td><code>00000001</code></td></tr>
          <tr><td>10</td><td><code>00001010</code></td></tr>
          </tbody></table>
          <pre><code>192.168.1.10
          = 11000000.10101000.00000001.00001010</code></pre>
          <p>This binary format helps when comparing an IPv4 address with a subnet mask or network prefix.</p>
          <h2>How binary explains IPv4 subnet masks</h2>
          <p>In CIDR notation, a prefix such as <code>/26</code> describes the first 26 bits of an IPv4 address as the network prefix. A conventional <code>/26</code> mask consists of 26 ones followed by six zeros:</p>
          <pre><code>11111111.11111111.11111111.11000000
          = 255.255.255.192
          = /26</code></pre>
          <p>The final octet <code>11000000</code> equals 192. The remaining six bits give <code>2<sup>6</sup> = 64</code> addresses per ordinary /26 block. For a traditional subnet with network and directed-broadcast addresses, 62 addresses are normally assignable to hosts; this shortcut must not be applied to every prefix type, notably /31 point-to-point use and /32 host routes.</p>
          <h2>Work a CIDR example: 10.0.0.130/26</h2>
          <p>To find the network address, apply the subnet mask to the address's bits. A /26 divides the final octet into blocks of 64: 0–63, 64–127, 128–191, and 192–255.</p>
          <table><thead><tr><th>Property</th><th>Result</th></tr></thead><tbody>
          <tr><td>Host address</td><td><code>10.0.0.130</code></td></tr>
          <tr><td>Subnet mask</td><td><code>255.255.255.192</code></td></tr>
          <tr><td>Network address</td><td><code>10.0.0.128</code></td></tr>
          <tr><td>Last address in conventional /26 subnet</td><td><code>10.0.0.191</code></td></tr>
          <tr><td>Traditional usable host range</td><td><code>10.0.0.129–10.0.0.190</code></td></tr>
          <tr><td>Addresses in the block</td><td>64</td></tr>
          </tbody></table>
          <p>The calculation uses <code>130 AND 192 = 128</code> in the final octet. For a full dedicated subnetting lesson and other prefix sizes, see our <a href="https://www.cyberoplus.com/2025/05/networking-subnetting-explained.html">IPv4 subnetting tutorial</a>. The CIDR prefix approach is described in <a href="https://www.rfc-editor.org/rfc/rfc4632.html" rel="noopener noreferrer">RFC 4632</a>.</p>
          <h2>What is hexadecimal?</h2>
          <p>Hexadecimal uses 16 digits: <code>0</code> through <code>9</code>, then <code>A</code> through <code>F</code> for decimal values 10 through 15. Each hexadecimal digit represents <strong>four binary bits</strong>, because <code>2<sup>4</sup> = 16</code>.</p>
          <table><thead><tr><th>Decimal</th><th>Binary nibble</th><th>Hex</th></tr></thead><tbody>
          <tr><td>10</td><td>1010</td><td>A</td></tr>
          <tr><td>11</td><td>1011</td><td>B</td></tr>
          <tr><td>12</td><td>1100</td><td>C</td></tr>
          <tr><td>13</td><td>1101</td><td>D</td></tr>
          <tr><td>14</td><td>1110</td><td>E</td></tr>
          <tr><td>15</td><td>1111</td><td>F</td></tr>
          </tbody></table>
          <p>The notation <code>0xFF</code> often indicates a hexadecimal value in programming and technical documentation. In IPv6 addresses, hexadecimal digit groups appear without the <code>0x</code> prefix.</p>
          <h2>Convert binary to hexadecimal</h2>
          <p>Group the bits into sets of four from the right, pad with leading zeros if necessary, and convert each group:</p>
          <pre><code>Binary:  11001010
          Groups:  1100 1010
          Hex:       C    A
          
          11001010 binary = CA hexadecimal = 202 decimal</code></pre>
          <p>Two hexadecimal digits represent one eight-bit byte. For example, <code>FF</code> is <code>11111111</code> binary and 255 decimal.</p>
          <h2>Why MAC addresses are written in hexadecimal</h2>
          <p>A standard 48-bit EUI-48 MAC address can be written as six hexadecimal pairs, such as <code>02:1a:2b:3c:4d:5e</code>. Each pair is one byte, so six pairs represent six bytes or 48 bits. Hexadecimal notation is more compact than displaying all 48 individual bits.</p>
          <p>To see why the first octet matters, read our <a href="https://www.cyberoplus.com/2026/04/mac-address-unicast-broadcast-multicast.html">MAC I/G and U/L bit guide</a>. The value <code>0x02</code> has binary form <code>00000010</code>, indicating a locally administered individual address in that example.</p>
          <h2>Hexadecimal is also used for IPv6</h2>
          <p>IPv6 addresses are <strong>128 bits</strong>, conventionally written as eight groups of up to four hexadecimal digits. A full-length example is:</p>
          <pre><code>2001:0db8:0000:0000:0000:0000:0000:0001
          2001:db8::1</code></pre>
          <p>The second line is the compressed representation of the first. Leading zeros within a 16-bit group can be omitted, and a single <code>::</code> can compress a consecutive run of zero groups. Only one <code>::</code> can appear in an IPv6 address because multiple omissions would make the number of omitted groups ambiguous.</p>
          <p>These addresses use the <code>2001:db8::/32</code> documentation prefix, not a claim about a reachable public server. The full IPv6 textual representation is described in <a href="https://www.rfc-editor.org/rfc/rfc4291.html" rel="noopener noreferrer">RFC 4291</a>; the recommended canonical textual representation is described in <a href="https://www.rfc-editor.org/rfc/rfc5952.html" rel="noopener noreferrer">RFC 5952</a>.</p>
          <h2>Hexadecimal in Ethernet protocol fields</h2>
          <p>The Ethernet Length/Type field can contain values such as <code>0x0800</code> for IPv4, <code>0x86DD</code> for IPv6, and <code>0x0806</code> for ARP. These are not decimal numbers and should not be confused with TCP/UDP port numbers. The <a href="https://www.cyberoplus.com/2026/03/network-frame-structure-header-crc-explained.html">Ethernet frame structure article</a> explains where that two-byte field appears.</p>
          <h2>Do beginners need octal for networking?</h2>
          <p><strong>Octal (base 8)</strong> can appear in historical computing notation and some Unix contexts, but the practical beginner networking examples above mostly require decimal, binary and hexadecimal. You can postpone octal until a course or tool uses it directly.</p>
          <h2>Short practice exercises</h2>
          <table><thead><tr><th>Question</th><th>Correct answer</th></tr></thead><tbody>
          <tr><td>Convert <code>11110000</code> to decimal</td><td>240</td></tr>
          <tr><td>Convert <code>00101101</code> to hexadecimal</td><td><code>2D</code></td></tr>
          <tr><td>Convert <code>0x7F</code> to decimal</td><td>127</td></tr>
          <tr><td>How many values can eight bits represent?</td><td>256 (from 0 to 255)</td></tr>
          <tr><td>How many bits are in an IPv6 address?</td><td>128</td></tr>
          <tr><td>What is the mask for an IPv4 /26?</td><td><code>255.255.255.192</code></td></tr>
          </tbody></table>
          <p>Try calculating each answer without looking at the solution, then explain the positional weights you used. For related applied questions, continue with our <a href="https://www.cyberoplus.com/2026/03/network-exercises-solved-interactive.html">ten solved networking exercises</a>.</p>
          <h2>Common conversion mistakes</h2>
          <ul>
          <li><strong>Writing an IPv4 octet as 256:</strong> the maximum eight-bit unsigned value is 255.</li>
          <li><strong>Mixing decimal and hexadecimal:</strong> <code>10</code> in decimal differs from <code>0x10</code>, which equals 16 decimal.</li>
          <li><strong>Reversing bit weights:</strong> for conventional written binary, the leftmost bit is the highest positional weight.</li>
          <li><strong>Confusing an IPv4 prefix with host count:</strong> /26 means 26 prefix bits, not 26 hosts.</li>
          <li><strong>Assuming every subnet always has address-count-minus-two usable hosts:</strong> /31 and /32 cases require different treatment.</li>
          <li><strong>Using two double-colon compressions in IPv6:</strong> only one <code>::</code> is allowed.</li>
          <li><strong>Calling every two-byte hex field a TCP port:</strong> EtherType, addresses and ports have separate meanings.</li>
          </ul>
          <h2>Official technical references</h2>
          <ul>
          <li><a href="https://www.rfc-editor.org/rfc/rfc4632.html" rel="noopener noreferrer">RFC 4632 — Classless Inter-Domain Routing and IPv4 prefixes</a></li>
          <li><a href="https://www.rfc-editor.org/rfc/rfc4291.html" rel="noopener noreferrer">RFC 4291 — IPv6 address architecture</a></li>
          <li><a href="https://www.rfc-editor.org/rfc/rfc5952.html" rel="noopener noreferrer">RFC 5952 — IPv6 text representation recommendations</a></li>
          <li><a href="https://www.iana.org/assignments/ieee-802-numbers/ieee-802-numbers.xhtml" rel="noopener noreferrer">IANA — IEEE 802 EtherType numbers</a></li>
          </ul>'''
          article=article.replace("{{IMG}}",str(fragment))
          parsed=BeautifulSoup(article,"html.parser")
          check(len(article)>10000 and len(parsed.find_all("h2"))>=14,"Article coverage incomplete")
          check(len(parsed.find_all("img"))==1 and parsed.find("img").get("src")==img.get("src"),"Original media altered")
          check(not re.search(r"[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF]",article),"Non-English article body")
          check(all(v in article for v in ("192.168.1.10","255.255.255.192","10.0.0.130","RFC 4291","0x0800")),"Key networking arithmetic missing")
          check(sum("cyberoplus.com" in a.get("href","") for a in parsed.find_all("a"))>=4,"Internal links missing")
          print("PRECHECK_PASSED")
          r=s.patch(endpoint,json={"title":TITLE,"content":article,"labels":["technology"]},timeout=70);r.raise_for_status()
          after=getpost()
          check(str(after.get("id"))==PID and after.get("url")==URL and after.get("published")==PUBLISHED and after.get("title")==TITLE and after.get("labels")==["technology"],"CRITICAL: ID/URL/date changed")
          check(sha(after.get("content",""))==sha(article),"CRITICAL: Body was not saved exactly")
          print("PUBLISHED_AND_VERIFIED: "+URL)
          print("ORIGINAL_DATE_PRESERVED: "+PUBLISHED)
          
          PY
