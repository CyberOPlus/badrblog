name: CyberoPlus Editorial - One Verified Blogger Article
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/blogger-editorial-update.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cyberoplus-editorial-one-post
  cancel-in-progress: false
jobs:
  apply-verified-content:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install authentication and HTML parsing dependencies
        run: python -m pip install --disable-pip-version-check "google-auth>=2.20,<3" "requests>=2.31,<3" "beautifulsoup4>=4.12,<5"
      - name: Update exactly one checked Blogger post
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
          BLOGGER_CLIENT_SECRET_JSON: ${{ secrets.BLOGGER_CLIENT_SECRET_JSON }}
        run: |
          python - <<'PY'
          import os,json,re,hashlib
          from urllib.parse import urlsplit
          from bs4 import BeautifulSoup
          from google.auth.transport.requests import AuthorizedSession
          from google.oauth2.credentials import Credentials
          BID="2750143140558868280"
          PID="1127557226544113413"
          ORIGINAL_TITLE="أساسيات الإلكترونيات الرقمية: Binary وLogic Gates والدوائر المنطقية للمبتدئين"
          ORIGINAL_URL="https://www.cyberoplus.com/2025/05/digital-electronics-basics-for-beginners.html"
          PUBLISHED="2025-05-25T14:22:00+01:00"
          SOURCE_SHA="55e34ff26c352d71c0a8cffee67c5d17aafebe62a6f3c55e46a01560c98f2a3d"
          TITLE="Digital Electronics Basics: Binary, Logic Gates and Truth Tables"
          def digest(s):return hashlib.sha256(s.encode("utf-8")).hexdigest()
          def check(c,msg):
              if not c:raise RuntimeError(msg)
          info=json.loads(os.environ["BLOGGER_TOKEN_JSON"])
          client=json.loads(os.environ["BLOGGER_CLIENT_SECRET_JSON"])
          conf=client.get("installed") or client.get("web") or {}
          for k in ("client_id","client_secret","token_uri"):
              if not info.get(k) and conf.get(k):info[k]=conf[k]
          session=AuthorizedSession(Credentials.from_authorized_user_info(info))
          BASE="https://www.googleapis.com/blogger/v3"
          check(os.environ.get("BLOGGER_BLOG_ID")==BID,"Unexpected blog credential target")
          r=session.get(BASE+"/blogs/"+BID,timeout=30);r.raise_for_status();blog=r.json()
          check(str(blog.get("id"))==BID and (urlsplit(blog.get("url","")).hostname or "").lower() in ("cyberoplus.com","www.cyberoplus.com"),"Wrong blog domain")
          endpoint=BASE+"/blogs/"+BID+"/posts/"+PID
          def getpost():
              response=session.get(endpoint,params={"view":"ADMIN","fetchBody":"true"},timeout=45);response.raise_for_status();return response.json()
          source=getpost()
          check(str(source.get("id"))==PID and source.get("url")==ORIGINAL_URL and source.get("title")==ORIGINAL_TITLE and source.get("published")==PUBLISHED and source.get("labels")==["technology"] and digest(source.get("content",""))==SOURCE_SHA,"Source changed: do not modify")
          soup=BeautifulSoup(source["content"],"html.parser")
          images=soup.find_all("img");check(len(images)==3,"Original media count changed")
          saved=[]
          alt_text=[
              "Digital electronics breadboard with binary logic signals",
              "Logic-low and logic-high input voltage thresholds with undefined region",
              "Half adder circuit using XOR for sum and AND for carry"]
          for old_image,alt in zip(images,alt_text):
              wrap=old_image.find_parent("div",class_="separator")
              check(wrap is not None,"Original image wrapper missing")
              node=BeautifulSoup(str(wrap),"html.parser")
              node.find("img")["alt"]=alt
              if node.find("img").has_attr("title"):node.find("img")["title"]=alt
              saved.append(str(node))
          article=r'''<p><strong>Digital electronics</strong> explains how computers represent information with binary states and process it through <strong>logic gates</strong>. This beginner-friendly guide covers binary numbers, voltage logic levels, truth tables, AND/OR/NOT/XOR gates, a half adder, and the difference between combinational and sequential circuits.</p>
          {{IMG1}}
          <p>First, an important distinction: logical <code>0</code> and <code>1</code> are <strong>abstract values</strong>. They do not universally mean zero volts and one volt, or no current and some current. Real components interpret specified voltage ranges as valid logic low or high; those ranges depend on the device and its logic family.</p>
          <h2>What is digital electronics?</h2>
          <p>Digital circuits encode information using a set of discrete states. In most binary systems, we label the states <code>0</code> and <code>1</code>. Logic circuits transform these states to implement decisions, arithmetic, storage and control functions.</p>
          <p>Digital building blocks are found inside processors, arithmetic logic units (ALUs), registers, microcontrollers, counters, memory interfaces and embedded control systems. MIT's <a href="https://ocw.mit.edu/courses/6-004-computation-structures-spring-2017/" rel="noopener noreferrer">Computation Structures course</a> teaches how physical transistors form gates, larger logic blocks, state machines and processors.</p>
          <h2>Analog versus digital signals</h2>
          <p>Both analog and digital circuits are physical electronic systems; the difference lies in how information is represented and interpreted.</p>
          <table><thead><tr><th>Analog</th><th>Digital</th></tr></thead><tbody>
          <tr><td>A signal may represent values across a continuous range</td><td>Information is represented with discrete states</td></tr>
          <tr><td>Example: sensor voltage corresponding to temperature</td><td>Example: a binary control input interpreted as low or high</td></tr>
          <tr><td>Exact amplitude can encode the measured quantity</td><td>Ranges of physical values are interpreted as logical symbols</td></tr>
          <tr><td>Used in amplifiers and signal-conditioning circuits</td><td>Used in logic gates, counters, registers and processors</td></tr>
          </tbody></table>
          <p>Even a digital voltage waveform transitions continuously in the physical world. The abstraction is useful because circuits are designed to distinguish valid logical states despite variations and noise.</p>
          <h2>Understanding binary numbers and bits</h2>
          <p>The binary number system has base 2. Its digits are <code>0</code> and <code>1</code>, and each binary position has a weight that is a power of two. One binary digit is called a <strong>bit</strong>.</p>
          <p>Consider the four-bit binary number <code>1011</code>:</p>
          <pre><code>1011 (binary)
          = 1×8 + 0×4 + 1×2 + 1×1
          = 11 (decimal)</code></pre>
          <p>With <code>n</code> bits, there are <strong>2 to the power of n</strong> different bit patterns. For four bits, that is <strong>16 combinations</strong>, from <code>0000</code> through <code>1111</code>. Bit patterns may represent numbers, characters, addresses, instructions or other kinds of data depending on the encoding.</p>
          <h2>What are logic levels?</h2>
          <p>A digital input is a physical signal. A chip's data sheet specifies voltage conditions that it can reliably interpret as logic low or logic high. These thresholds are not identical for every chip, voltage supply or logic family.</p>
          <dl>
          <dt><strong>VIL</strong></dt><dd>The maximum input voltage guaranteed to be interpreted as logic low.</dd>
          <dt><strong>VIH</strong></dt><dd>The minimum input voltage guaranteed to be interpreted as logic high.</dd>
          <dt><strong>VOL</strong></dt><dd>The specified low-level output voltage under defined operating conditions.</dd>
          <dt><strong>VOH</strong></dt><dd>The specified high-level output voltage under defined operating conditions.</dd>
          </dl>
          <p>Between valid low and high input ranges, the circuit may have an <strong>undefined input region</strong>; you should not assume what logic level it will report. A source's guaranteed high output must satisfy the receiving input's high threshold, and its low output must meet the receiving input's low threshold.</p>
          {{IMG2}}
          <aside data-type="warning"><strong>Do not wire real chips based only on a truth table.</strong> Check the exact component data sheet for supply voltage, VIL/VIH, VOL/VOH, output-current limits and timing. A logic diagram describes intended behavior, not electrical compatibility.</aside>
          <h2>What is a logic gate?</h2>
          <p>A logic gate implements a Boolean function. It accepts one or more inputs and produces an output that can be described using a <strong>truth table</strong> or Boolean expression.</p>
          <p>For two binary inputs <code>A</code> and <code>B</code>, the four possible combinations are <code>00</code>, <code>01</code>, <code>10</code> and <code>11</code>. A complete truth table with <code>n</code> binary inputs contains <strong>2<sup>n</sup></strong> rows.</p>
          <h2>AND gate: both conditions must be true</h2>
          <p>An AND gate produces <code>1</code> only when all required inputs are <code>1</code>. For two inputs, its Boolean expression is <code>A · B</code>.</p>
          <table><thead><tr><th>A</th><th>B</th><th>A AND B</th></tr></thead><tbody>
          <tr><td>0</td><td>0</td><td>0</td></tr><tr><td>0</td><td>1</td><td>0</td></tr><tr><td>1</td><td>0</td><td>0</td></tr><tr><td>1</td><td>1</td><td>1</td></tr>
          </tbody></table>
          <p>A simple logical example is a process that should run only when a safety condition is satisfied <em>and</em> a start request has been given. This describes a Boolean decision, not a complete safety-certified hardware design.</p>
          <h2>OR gate: at least one condition is true</h2>
          <p>An OR gate produces <code>1</code> whenever one or more inputs are <code>1</code>. In Boolean algebra it is often written <code>A + B</code>. Here the plus sign denotes logical OR, not ordinary arithmetic addition.</p>
          <table><thead><tr><th>A</th><th>B</th><th>A OR B</th></tr></thead><tbody>
          <tr><td>0</td><td>0</td><td>0</td></tr><tr><td>0</td><td>1</td><td>1</td></tr><tr><td>1</td><td>0</td><td>1</td></tr><tr><td>1</td><td>1</td><td>1</td></tr>
          </tbody></table>
          <h2>NOT gate: invert one input</h2>
          <p>NOT, also called an <strong>inverter</strong>, changes <code>0</code> to <code>1</code> and <code>1</code> to <code>0</code>. It has one input in its basic form.</p>
          <table><thead><tr><th>A</th><th>NOT A</th></tr></thead><tbody><tr><td>0</td><td>1</td></tr><tr><td>1</td><td>0</td></tr></tbody></table>
          <h2>XOR gate: inputs must differ</h2>
          <p>For two inputs, XOR (exclusive OR) is <code>1</code> when their values differ and <code>0</code> when they are equal. Unlike OR, the XOR output is <code>0</code> when <code>A=1</code> and <code>B=1</code>.</p>
          <table><thead><tr><th>A</th><th>B</th><th>A XOR B</th></tr></thead><tbody>
          <tr><td>0</td><td>0</td><td>0</td></tr><tr><td>0</td><td>1</td><td>1</td></tr><tr><td>1</td><td>0</td><td>1</td></tr><tr><td>1</td><td>1</td><td>0</td></tr>
          </tbody></table>
          <h2>Compare the most common two-input gates</h2>
          <table><thead><tr><th>A</th><th>B</th><th>AND</th><th>OR</th><th>XOR</th></tr></thead><tbody>
          <tr><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td></tr><tr><td>0</td><td>1</td><td>0</td><td>1</td><td>1</td></tr><tr><td>1</td><td>0</td><td>0</td><td>1</td><td>1</td></tr><tr><td>1</td><td>1</td><td>1</td><td>1</td><td>0</td></tr>
          </tbody></table>
          <p>A helpful way to remember them is to ask when the output becomes <code>1</code>: AND requires both; OR requires at least one; XOR requires different input values.</p>
          <h2>NAND and NOR gates</h2>
          <p><strong>NAND</strong> is the inversion of AND, while <strong>NOR</strong> is the inversion of OR:</p>
          <pre><code>NAND(A,B) = NOT(A AND B)
          NOR(A,B)  = NOT(A OR B)</code></pre>
          <p>Each of NAND and NOR can be used to construct any Boolean function. This property is called <strong>functional completeness</strong> and helps explain their importance in logic-circuit design.</p>
          <h2>From logic gates to a half adder</h2>
          <p>A <strong>half adder</strong> combines two one-bit values, <code>A</code> and <code>B</code>. It has two outputs: <strong>Sum</strong>, the low-order sum bit, and <strong>Carry</strong>, the bit carried into the next binary position.</p>
          <pre><code>Sum   = A XOR B
          Carry = A AND B</code></pre>
          <table><thead><tr><th>A</th><th>B</th><th>Sum</th><th>Carry</th></tr></thead><tbody>
          <tr><td>0</td><td>0</td><td>0</td><td>0</td></tr><tr><td>0</td><td>1</td><td>1</td><td>0</td></tr><tr><td>1</td><td>0</td><td>1</td><td>0</td></tr><tr><td>1</td><td>1</td><td>0</td><td>1</td></tr>
          </tbody></table>
          <p>The final row represents <code>1 + 1 = 10</code> in binary: the sum bit is 0 and the carry bit is 1.</p>
          {{IMG3}}
          <p>Half adders are an introductory step toward full adders and larger arithmetic structures. For a hands-on exercise, follow the <a href="https://www.cyberoplus.com/2026/09/download-logisim-2-7-1-java-windows.html">Logisim 2.7.1 installation and first logic-gate simulation guide</a>, then try building a half adder using XOR and AND gates.</p>
          <h2>Combinational versus sequential logic</h2>
          <h3>Combinational circuits</h3>
          <p>The logical output of a combinational circuit is determined by its current inputs, after accounting for physical propagation delay. Logic gates, multiplexers, decoders and arithmetic adders are typical examples.</p>
          <h3>Sequential circuits</h3>
          <p>Sequential circuits have <strong>state</strong>: past information stored in elements such as latches or flip-flops can affect present outputs. Registers, counters and finite-state machines are examples. Many sequential circuits use clocks to coordinate state changes, although some are asynchronous.</p>
          <h2>Why real circuits differ from ideal truth tables</h2>
          <p>Truth tables specify logic but omit physical behavior such as <strong>propagation delay</strong>, supply voltage, signal rise and fall times, noise margins, drive strength, and setup or hold constraints of storage elements. A circuit may be logically correct while failing due to timing or electrical incompatibility.</p>
          <p>When moving from simulation to physical hardware, consult each component's data sheet, and test within the manufacturer's recommended operating conditions.</p>
          <h2>How logic gates become a processor</h2>
          <p>A conceptual progression is <strong>transistors → logic gates → combinational and sequential blocks → registers and arithmetic units → processor control and data paths</strong>. This is an educational abstraction, not a claim that today's CPUs are simple or that software instructions directly manipulate individual gates.</p>
          <h2>Common beginner mistakes</h2>
          <ul>
          <li><strong>Equating 0 and 1 with fixed voltages:</strong> valid thresholds vary by chip and logic family.</li>
          <li><strong>Confusing OR and XOR:</strong> only XOR gives zero when both two-input signals are 1.</li>
          <li><strong>Memorizing without checking tables:</strong> derive the result for each input combination.</li>
          <li><strong>Ignoring physical timing:</strong> real gates do not respond instantaneously.</li>
          <li><strong>Jumping straight to CPU architecture:</strong> practice binary arithmetic and logic blocks first.</li>
          </ul>
          <h2>A practical learning sequence</h2>
          <ol data-steps>
          <li>Understand digital abstraction and the difference between analog and digital.</li>
          <li>Convert small numbers between decimal and binary.</li>
          <li>Identify valid logic low and high ranges using a real data sheet.</li>
          <li>Construct truth tables for AND, OR, NOT and XOR.</li>
          <li>Combine gates to form NAND, NOR and simple Boolean functions.</li>
          <li>Simulate a half adder, then a full adder.</li>
          <li>Continue with multiplexers, decoders, latches, flip-flops and registers before CPU internals.</li>
          </ol>
          <h2>References for further study</h2>
          <ul>
          <li><a href="https://ocw.mit.edu/courses/6-004-computation-structures-spring-2017/" rel="noopener noreferrer">MIT OpenCourseWare: Computation Structures</a></li>
          <li><a href="https://computation-structures.github.io/course/" rel="noopener noreferrer">MIT 6.004 course notes and exercises archive</a></li>
          <li><a href="https://www.ti.com/lit/sg/sdyu001ac/sdyu001ac.pdf" rel="noopener noreferrer">Texas Instruments: Logic Guide and electrical levels</a></li>
          <li><a href="https://www.cyberoplus.com/2026/09/download-logisim-2-7-1-java-windows.html">Cyb​eroPlus: install Logisim and practice your first circuit</a></li>
          </ul>
          <p>The key is to understand <strong>the relationship between binary representations, Boolean functions and real electrical signals</strong>. Once you can explain a truth table and reproduce it with a gate-level simulator, you have a foundation for digital circuit design and computer architecture.</p>'''
          article=article.replace("{{IMG1}}",saved[0]).replace("{{IMG2}}",saved[1]).replace("{{IMG3}}",saved[2])
          parsed=BeautifulSoup(article,"html.parser")
          check(len(parsed.find_all("h2"))>=17 and len(article)>9500,"New article incomplete")
          check(len(parsed.find_all("img"))==3 and [x.get("src") for x in parsed.find_all("img")]==[x.get("src") for x in images],"Image changed")
          check(not re.search(r"[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF]",article),"Arabic remains in the article")
          check("Half adder" in article and "Logic low" in article and "VIH" in article and "XOR" in article,"Essential fundamentals missing")
          check(len([x for x in parsed.find_all("a") if "cyberoplus.com" in x.get("href","")])>=1,"Internal context link missing")
          check(any("ocw.mit.edu" in x.get("href","") for x in parsed.find_all("a")) and any("ti.com" in x.get("href","") for x in parsed.find_all("a")),"Primary-source references missing")
          print("PRECHECK_PASSED")
          payload={"title":TITLE,"content":article,"labels":["Technology"]}
          r=session.patch(endpoint,json=payload,timeout=70);r.raise_for_status()
          after=getpost()
          check(str(after.get("id"))==PID and after.get("url")==ORIGINAL_URL and after.get("published")==PUBLISHED and after.get("title")==TITLE and after.get("labels")==["Technology"],"CRITICAL: changed target identity or publication metadata")
          check(digest(after.get("content",""))==digest(article),"CRITICAL: HTML saved differs from expected")
          print("PUBLISHED_AND_VERIFIED: "+ORIGINAL_URL)
          print("PUBLISHED_DATE_PRESERVED: "+PUBLISHED)
          print("META_DESCRIPTION_NOT_PATCHED: Blogger v3 does not expose searchDescription")
          
          PY
