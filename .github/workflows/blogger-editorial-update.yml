name: CyberoPlus Editorial - One Verified Blogger Article
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/blogger-editorial-update.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cyberoplus-editorial-one-post
  cancel-in-progress: false
jobs:
  apply-verified-content:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install authentication and HTML parsing dependencies
        run: python -m pip install --disable-pip-version-check "google-auth>=2.20,<3" "requests>=2.31,<3" "beautifulsoup4>=4.12,<5"
      - name: Update exactly one checked Blogger post
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
          BLOGGER_CLIENT_SECRET_JSON: ${{ secrets.BLOGGER_CLIENT_SECRET_JSON }}
        run: |
          python - <<'PY'
          import os,json,re,hashlib
          from urllib.parse import urlsplit
          from bs4 import BeautifulSoup
          from google.auth.transport.requests import AuthorizedSession
          from google.oauth2.credentials import Credentials
          BID="2750143140558868280"
          PID="2964102046594465473"
          ORIGINAL_TITLE="تثبيت Lubuntu على VirtualBox في Windows 11 و10 خطوة بخطوة"
          ORIGINAL_URL="https://www.cyberoplus.com/2026/09/install-lubuntu-virtualbox-windows.html"
          PUBLISHED="2026-09-17T15:50:41+01:00"
          SOURCE_SHA="30c7eb7caae22b28d83b77d34e8e1a8dbb25fff85872458a7ffb65cf08746216"
          TITLE="How to Install Lubuntu 26.04 LTS in VirtualBox on Windows 11/10"
          def digest(s):return hashlib.sha256(s.encode("utf-8")).hexdigest()
          def check(c,msg):
              if not c:raise RuntimeError(msg)
          info=json.loads(os.environ["BLOGGER_TOKEN_JSON"])
          client=json.loads(os.environ["BLOGGER_CLIENT_SECRET_JSON"])
          conf=client.get("installed") or client.get("web") or {}
          for k in ("client_id","client_secret","token_uri"):
              if not info.get(k) and conf.get(k):info[k]=conf[k]
          session=AuthorizedSession(Credentials.from_authorized_user_info(info))
          BASE="https://www.googleapis.com/blogger/v3"
          check(os.environ.get("BLOGGER_BLOG_ID")==BID,"Unexpected blog credential target")
          r=session.get(BASE+"/blogs/"+BID,timeout=30);r.raise_for_status();blog=r.json()
          check(str(blog.get("id"))==BID and (urlsplit(blog.get("url","")).hostname or "").lower() in ("cyberoplus.com","www.cyberoplus.com"),"Wrong blog domain")
          endpoint=BASE+"/blogs/"+BID+"/posts/"+PID
          def getpost():
              response=session.get(endpoint,params={"view":"ADMIN","fetchBody":"true"},timeout=45);response.raise_for_status();return response.json()
          source=getpost()
          check(str(source.get("id"))==PID and source.get("url")==ORIGINAL_URL and source.get("title")==ORIGINAL_TITLE and source.get("published")==PUBLISHED and source.get("labels")==["guides"] and digest(source.get("content",""))==SOURCE_SHA,"Source changed: do not modify")
          soup=BeautifulSoup(source["content"],"html.parser")
          images=soup.find_all("img");check(len(images)==1,"Original media count changed")
          original_image=images[0];wrapper=original_image.find_parent("div",class_="separator") or original_image.find_parent("figure")
          check(wrapper is not None,"Cannot preserve image wrapper")
          while wrapper.parent and getattr(wrapper.parent,"name",None)=="div" and "separator" in (wrapper.parent.get("class") or []):wrapper=wrapper.parent
          node=BeautifulSoup(str(wrapper),"html.parser")
          node.find("img")["alt"]="Lubuntu on VirtualBox for Windows 11 and 10"
          if node.find("img").has_attr("title"):node.find("img")["title"]=node.find("img")["alt"]
          for c in node.find_all("figcaption"):c.string="Original screenshot from the Lubuntu tutorial"
          article=r'''<p>Install <strong>Lubuntu 26.04.1 LTS on VirtualBox in Windows 11 or Windows 10</strong> by downloading the official Lubuntu ISO and VirtualBox, creating a virtual machine, allocating RAM and storage, and installing Lubuntu on the virtual disk. This guide is aimed at Linux students who want a lightweight desktop without replacing Windows or changing physical disk partitions.</p>
          {{IMG}}
          <p>These steps cover <strong>Lubuntu 26.04.1 LTS</strong> and the VirtualBox 7.2 series. <strong>VirtualBox 7.2.22</strong> is the latest version listed by Oracle on November 2, 2026. Menus can differ slightly between VirtualBox releases. The guidance follows official documentation and is not a claim that every host configuration was independently tested.</p>
          <h2>Why install Lubuntu instead of standard Ubuntu?</h2>
          <p>Lubuntu is an official Ubuntu flavor with the <strong>LXQt desktop</strong>. Its desktop is generally lighter than Ubuntu's default GNOME interface, making it an option when you want to practice Terminal commands, file permissions and operating-system exercises while Windows keeps running.</p>
          <p>For a more detailed explanation of the standard Ubuntu Desktop installation, follow our <a href="https://www.cyberoplus.com/2026/10/install-linux-ubuntu-virtualbox.html">Ubuntu on VirtualBox tutorial</a>. That guide covers the full Ubuntu GNOME experience; this guide focuses on Lubuntu and resource-conscious virtual-machine setup.</p>
          <aside data-type="info"><strong>Understand host and guest.</strong> Windows stays the host. VirtualBox creates a virtual computer, and Lubuntu is its guest operating system. VirtualBox stores the guest's virtual disk in a file on Windows. Following this VM method does not require repartitioning your physical SSD.</aside>
          <h2>Step 1: Download VirtualBox and the Lubuntu ISO</h2>
          <ol data-steps>
          <li>Open <a href="https://www.oracle.com/virtualization/technologies/vm/downloads/virtualbox-downloads.html" rel="noopener noreferrer">Oracle's official VirtualBox downloads page</a> and choose the Windows installer. Version 7.2.22 is provided as <code>VirtualBox-7.2.22-175245-Win.exe</code>.</li>
          <li>Open <a href="https://lubuntu.me/downloads/" rel="noopener noreferrer">Lubuntu's official download page</a> and select the <strong>26.04.1 LTS Desktop 64-bit</strong> image, named <code>lubuntu-26.04.1-desktop-amd64.iso</code>.</li>
          <li>Compare the ISO against the SHA256 checksum published by the official download source, particularly when using a mirror or torrent.</li>
          </ol>
          <p><code>AMD64</code> means the common 64-bit x86 architecture used on Intel and AMD PCs; it is not an AMD-only download. You do not need VirtualBox Extension Pack for the basic installation.</p>
          <h2>Step 2: Choose reasonable virtual-machine resources</h2>
          <p>These are <strong>starting suggestions for a study VM</strong>, not formal Lubuntu minimum requirements or guaranteed performance figures. Your physical Windows PC still needs enough resources for its own tasks.</p>
          <table><thead><tr><th>Resource</th><th>Starting value</th><th>Reason</th></tr></thead><tbody>
          <tr><td>Guest memory</td><td>2,048 MB</td><td>Conservative starting allocation; raise it if Windows has sufficient spare RAM</td></tr>
          <tr><td>Processors</td><td>2</td><td>Leaves capacity for the host on a typical multi-core processor</td></tr>
          <tr><td>Virtual disk</td><td>30 GB, dynamically allocated</td><td>Allows space for updates, tools and course files</td></tr>
          <tr><td>Graphics controller</td><td>VMSVGA</td><td>Default VirtualBox graphics type for Linux guests</td></tr>
          <tr><td>Networking</td><td>NAT</td><td>Ordinary internet access through the Windows host</td></tr>
          </tbody></table>
          <aside data-type="warning"><strong>Do not assign all of your RAM or CPU cores to Lubuntu.</strong> VirtualBox requires host resources while the guest runs. Leave sufficient RAM, processor capacity and free disk space for Windows and its background tasks.</aside>
          <h2>Step 3: Install VirtualBox on Windows</h2>
          <ol data-steps>
          <li>Run the VirtualBox Windows installer obtained from Oracle and verify the publisher.</li>
          <li>Accept the necessary device-driver installation prompts; network connectivity may briefly reset while virtual networking drivers are installed.</li>
          <li>Finish setup and launch <strong>Oracle VirtualBox</strong>.</li>
          </ol>
          <p>If the installation fails, check the current vendor troubleshooting documentation instead of installing a third-party modified binary.</p>
          <h2>Step 4: Create a new Lubuntu virtual machine</h2>
          <ol data-steps>
          <li>Click <strong>New</strong>, give the virtual machine a descriptive name such as <code>Lubuntu-Study</code>, and select your ISO file.</li>
          <li>If prompted, choose <strong>Linux</strong> as the OS type and <strong>Ubuntu (64-bit)</strong> as the version.</li>
          <li>When available, choose <strong>Skip Unattended Installation</strong> to use Lubuntu's graphical installer yourself. The exact wording may differ between releases.</li>
          <li>Assign the RAM and processor settings from the table above, then create a new <strong>30 GB</strong> virtual hard disk.</li>
          </ol>
          <p>A <strong>dynamically allocated</strong> virtual disk starts smaller and grows with stored guest files up to its configured maximum. It still consumes real storage on the Windows computer.</p>
          <h2>Step 5: Check display and networking before booting</h2>
          <h3>Graphics</h3>
          <p>With the VM powered off, open <strong>Settings → Display</strong> and use <strong>VMSVGA</strong> for Lubuntu. A video-memory setting up to 128 MB is a reasonable starting point where supported. Leave <strong>3D Acceleration</strong> disabled for the initial setup if you want to minimize extra graphics complexity; enable it later only if needed and supported.</p>
          <h3>Network</h3>
          <p>In <strong>Settings → Network → Adapter 1</strong>, choose <strong>Attached to: NAT</strong>. This allows normal outbound network access but does not automatically make the guest directly accessible from other devices on your LAN.</p>
          <h2>Step 6: Start Lubuntu from its ISO</h2>
          <ol data-steps>
          <li>Confirm that <code>lubuntu-26.04.1-desktop-amd64.iso</code> is attached to the VM's virtual optical drive.</li>
          <li>Click <strong>Start</strong> in VirtualBox.</li>
          <li>Select the install option from Lubuntu's boot menu or launch the installer from the live desktop, depending on the screen presented.</li>
          </ol>
          <p>If you see <code>No Bootable Medium Found</code>, shut down the VM and verify its ISO attachment under <strong>Settings → Storage</strong>. This error is not a reason to change or erase the Windows boot drive.</p>
          <h2>Step 7: Install Lubuntu on the correct disk</h2>
          <ol data-steps>
          <li>Pick the interface language, keyboard layout, region and time zone.</li>
          <li>At the partitioning screen, identify the <strong>new empty virtual hard disk</strong> by its expected size and confirm that you are running inside the intended VirtualBox VM.</li>
          <li>If this is the freshly created disposable virtual disk, the installer’s <strong>Erase disk</strong> option prepares that disk for Lubuntu.</li>
          <li>Create your local username, host name and password, then review the installation summary and proceed.</li>
          </ol>
          <aside data-type="warning"><strong>Disk safety is essential.</strong> The <em>Erase disk</em> option deletes data on the selected target. It is appropriate here only after verifying that the selected device is the empty VirtualBox virtual disk. Do not follow this instruction on a physical Windows installation or any other unverified disk.</aside>
          <h2>Step 8: Restart from the installed virtual disk</h2>
          <p>After installation, restart the VM. If the installer asks you to remove installation media, detach the ISO from the virtual optical drive under <strong>Settings → Storage</strong>. The guest should boot from its new virtual disk.</p>
          <p>If the installer appears again after restarting, check whether the ISO is still being booted. If the disk does not boot, confirm that installation finished and that the virtual disk remains attached.</p>
          <h2>Step 9: Check your new Linux system</h2>
          <p>Sign in, confirm that the desktop responds, open Terminal and check internet access if you need package downloads.</p>
          <pre><code>uname -a</code></pre>
          <p>This prints kernel and machine information. To retrieve package lists and review available upgrades:</p>
          <pre><code>sudo apt update
          sudo apt upgrade</code></pre>
          <p>Review the proposed package changes before confirming; keep adequate disk space for updates. These commands run inside the Lubuntu guest, not on the Windows host.</p>
          <h2>Troubleshoot common Lubuntu VirtualBox problems</h2>
          <h3>Black screen or frozen desktop</h3>
          <p>Power the VM off fully. Check that the graphics controller is <strong>VMSVGA</strong>, disable 3D acceleration temporarily and confirm the Windows host has free RAM and disk space. Consult VirtualBox logs for persistent failures rather than assuming Lubuntu is corrupt.</p>
          <h3>Ubuntu (64-bit) is not offered</h3>
          <p>Check whether hardware virtualization is enabled in your PC's BIOS/UEFI. Depending on the hardware it may be called <code>Intel VT-x</code>, <code>Intel Virtualization Technology</code>, <code>AMD-V</code> or <code>SVM Mode</code>. Windows virtualization features can also affect behavior on some hosts.</p>
          <h3>The desktop will not resize with the VM window</h3>
          <p>VirtualBox <a href="https://docs.oracle.com/en/virtualization/virtualbox/7.2/user/guestadditions.html" rel="noopener noreferrer">Guest Additions</a> can enable automatic resolution adjustment in supported guests. Follow official installation instructions for your version and verify compatibility before changing drivers.</p>
          <h3>The VM runs slowly</h3>
          <p>Check Windows memory pressure, CPU use and free SSD space. A lightweight guest desktop helps but cannot eliminate virtualization overhead or the load of demanding programs running inside the guest.</p>
          <h2>What to learn next</h2>
          <p>Practice filesystem navigation, basic shell commands, user permissions, processes, software updates and networking. For a broader learning sequence, see our <a href="https://www.cyberoplus.com/2026/01/learn-cybersecurity-beginners-guide.html">cybersecurity beginner roadmap</a>, or use the <a href="https://www.cyberoplus.com/2026/10/install-linux-ubuntu-virtualbox.html">Ubuntu VirtualBox guide</a> if you want the default GNOME desktop.</p>
          <h2>Official references</h2>
          <ul>
          <li><a href="https://lubuntu.me/downloads/" rel="noopener noreferrer">Lubuntu downloads and supported releases</a></li>
          <li><a href="https://lubuntu.me/lubuntu-26-04-lts-released/" rel="noopener noreferrer">Lubuntu 26.04 LTS release notes</a></li>
          <li><a href="https://www.oracle.com/virtualization/technologies/vm/downloads/virtualbox-downloads.html" rel="noopener noreferrer">VirtualBox version and download links</a></li>
          <li><a href="https://docs.oracle.com/en/virtualization/virtualbox/7.2/user/working-with-vms.html" rel="noopener noreferrer">Oracle VirtualBox VM setup documentation</a></li>
          </ul>'''
          article=article.replace("{{IMG}}",str(node))
          parsed=BeautifulSoup(article,"html.parser")
          check(len(parsed.find_all("h2"))>=12 and len(article)>7500,"New article incomplete")
          check(len(parsed.find_all("img"))==1 and parsed.find("img").get("src")==original_image.get("src"),"Image changed")
          check(not re.search(r"[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF]",article),"Arabic remains in the article")
          check("VirtualBox-7.2.18" not in article and "Erase disk" in article and "30 GB" in article,"Outdated instructions or missing safety warning")
          check(len([x for x in parsed.find_all("a") if "cyberoplus.com" in x.get("href","")])>=3,"Internal article links missing")
          check(any("oracle.com" in x.get("href","") for x in parsed.find_all("a")) and any("lubuntu.me" in x.get("href","") for x in parsed.find_all("a")),"Official references missing")
          print("PRECHECK_PASSED")
          payload={"title":TITLE,"content":article,"labels":["Tutorials"]}
          r=session.patch(endpoint,json=payload,timeout=70);r.raise_for_status()
          after=getpost()
          check(str(after.get("id"))==PID and after.get("url")==ORIGINAL_URL and after.get("published")==PUBLISHED and after.get("title")==TITLE and after.get("labels")==["Tutorials"],"CRITICAL: changed target identity or publication metadata")
          check(digest(after.get("content",""))==digest(article),"CRITICAL: HTML saved differs from expected")
          print("PUBLISHED_AND_VERIFIED: "+ORIGINAL_URL)
          print("PUBLISHED_DATE_PRESERVED: "+PUBLISHED)
          print("META_DESCRIPTION_NOT_PATCHED: Blogger v3 does not expose searchDescription")
          
          PY
