name: CyberoPlus - Translate Remaining Arabic Prose (Offline)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/blogger-finish-arabic-to-english.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cyberoplus-remaining-arabic-offline
  cancel-in-progress: false
jobs:
  translate-current-published-articles:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline Argos language model runtime and Blogger client
        run: |
          python -m pip install --disable-pip-version-check "argostranslate>=1.10,<2" "google-auth>=2.20,<3" "requests>=2.31,<3" "beautifulsoup4>=4.12,<5"
          python -m py_compile migration/editorial/translate_remaining_arabic_offline.py
      - name: Translate current Arabic passages locally; verify preservation and Blogger readback
        env:
          SHARD_ID: ${{ matrix.shard }}
          SHARD_COUNT: "8"
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
          BLOGGER_CLIENT_SECRET_JSON: ${{ secrets.BLOGGER_CLIENT_SECRET_JSON }}
          ARGOS_DEVICE_TYPE: cpu
          ARGOS_COMPUTE_TYPE: int8
          ARGOS_INTER_THREADS: "1"
          ARGOS_INTRA_THREADS: "2"
          PYTHONUNBUFFERED: "1"
        run: python migration/editorial/translate_remaining_arabic_offline.py
