name: CyberoPlus - Fix Eight Context-Checked SEO Titles
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/blogger-fix-eight-seo-titles.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cyberoplus-editorial-titles
  cancel-in-progress: false
jobs:
  update-verified-titles:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Blogger client
        run: python -m pip install --disable-pip-version-check "google-auth>=2.20,<3" "requests>=2.31,<3"
      - name: Correct only eight verified titles and preserve all other content
        env:
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
          BLOGGER_CLIENT_SECRET_JSON: ${{ secrets.BLOGGER_CLIENT_SECRET_JSON }}
        run: python migration/editorial/fix_8_seo_titles.py
