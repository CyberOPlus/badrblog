name: CyberoPlus - Publish Six Reviewed English Pages
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/blogger-legal-pages-publish.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cyberoplus-legal-pages-exclusive
  cancel-in-progress: false

jobs:
  publish-verified-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout verified English HTML and publisher
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Blogger authentication and HTML validation
        run: python -m pip install --disable-pip-version-check "google-auth>=2.20,<3" "requests>=2.31,<3" "beautifulsoup4>=4.12,<5"
      - name: Safely publish and re-read six existing Blogger pages
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
          BLOGGER_CLIENT_SECRET_JSON: ${{ secrets.BLOGGER_CLIENT_SECRET_JSON }}
        run: python migration/legal-pages/publish_pages.py
