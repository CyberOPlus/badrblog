name: CyberoPlus - Verify and Connect Internal Article Links
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/blogger-link-all-posts.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: cyberoplus-internal-linking-exclusive
  cancel-in-progress: false
jobs:
  link-verified-published-posts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout reviewed contextual link plan
        uses: actions/checkout@v4
      - name: Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Blogger and HTML inspection dependencies
        run: python -m pip install --disable-pip-version-check "google-auth>=2.20,<3" "requests>=2.31,<3" "beautifulsoup4>=4.12,<5"
      - name: Read source snapshot, preserve edits, publish links and verify graph
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
          BLOGGER_CLIENT_SECRET_JSON: ${{ secrets.BLOGGER_CLIENT_SECRET_JSON }}
        run: python migration/internal_linking/run_linking.py
