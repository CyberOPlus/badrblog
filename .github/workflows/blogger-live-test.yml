name: One-shot Blogger Jobs Live Test
# retry-3
# retry-3-clean-jobs-queue

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  blogger-live-test:
    if: contains(github.event.head_commit.message, '[blogger-live-test]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Prepare one-shot Jobs environment
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_SECRET_JSON: ${{ secrets.BLOGGER_CLIENT_SECRET_JSON }}
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          Path("data").mkdir(exist_ok=True)
          Path("client_secret.json").write_text(os.environ["BLOGGER_CLIENT_SECRET_JSON"], encoding="utf-8")
          Path("data/token.json").write_text(os.environ["BLOGGER_TOKEN_JSON"], encoding="utf-8")
          env = {
            "JOBS_MODE":"true",
            "JOBS_TEST_MODE":"true",
            "JOBS_EXPECTED_BLOG_HOST":"cyberopluss.blogspot.com",
            "JOBS_TIMEZONE":"Africa/Casablanca",
            "JOBS_MIN_SELECTION_SCORE":"70",
            "JOBS_QUEUE_SCORE":"50",
            "GEMINI_API_KEY":os.environ.get("GEMINI_API_KEY",""),
            "GEMINI_MODEL":"gemini-2.5-flash",
            "OPENROUTER_API_KEY":os.environ.get("OPENROUTER_API_KEY",""),
            "OPENROUTER_MODEL":"openai/gpt-oss-20b:free",
            "BLOG_ID":os.environ["BLOGGER_BLOG_ID"],
            "PUBLISH_MODE":"live",
            "SAFE_MODE":"false",
            "BLOGGER_LIVE_ENABLED":"true",
            "FACEBOOK_AUTO_POST":"false",
            "FAST_NEWS_MODE":"false",
            "CATEGORY_ROTATION_MODE":"false",
            "PROCESS_FULL_CATEGORY_PER_RUN":"false",
            "FRESH_QUEUE_MODE":"false",
            "FIRST_VALID_ARTICLE_MODE":"false",
            "RECENT_NEWS_ONLY":"false",
            "RECENT_ONLY":"false",
            "ALLOW_UNKNOWN_DATE_IN_FAST_MODE":"true",
            "MAX_POSTS_PER_RUN":"1",
            "MAX_ARTICLES_PER_RUN":"1",
            "SAFE_CYCLE_MAX_ARTICLES":"1",
            "MAX_SOURCES_PER_RUN":"17",
            "PUBLISH_WEAK_ARTICLES":"true",
            "ALLOW_SHORT_ARTICLES":"true",
            "MIN_ARTICLE_WORDS":"120",
            "MIN_EXTRACTED_CHARS":"80",
            "AI_PROVIDER":"auto",
            "LOCAL_PUBLISH_FALLBACK":"false",
            "TELEGRAM_ALERTS_ENABLED":"false",
          }
          Path(".env").write_text("\n".join(f"{k}={v}" for k,v in env.items())+"\n", encoding="utf-8")
          PY
      - name: Run one live Blogger Jobs cycle
        run: python main.py auto-cycle
