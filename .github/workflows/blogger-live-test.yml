name: One-shot Update Compact Test Post

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-test-post:
    if: contains(github.event.head_commit.message, '[update-test-post]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Prepare Blogger Jobs credentials
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_SECRET_JSON: ${{ secrets.BLOGGER_CLIENT_SECRET_JSON }}
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          Path("data").mkdir(exist_ok=True)
          Path("client_secret.json").write_text(os.environ["BLOGGER_CLIENT_SECRET_JSON"], encoding="utf-8")
          Path("data/token.json").write_text(os.environ["BLOGGER_TOKEN_JSON"], encoding="utf-8")
          env = {
              "JOBS_MODE":"true",
              "JOBS_TEST_MODE":"true",
              "JOBS_EXPECTED_BLOG_HOST":"cyberopluss.blogspot.com",
              "BLOG_ID":os.environ["BLOGGER_BLOG_ID"],
              "PUBLISH_MODE":"live",
              "SAFE_MODE":"false",
              "BLOGGER_LIVE_ENABLED":"true",
              "FACEBOOK_AUTO_POST":"false",
              "MIN_ARTICLE_WORDS":"100",
              "ALLOW_SHORT_ARTICLES":"true",
              "FAST_NEWS_MODE":"false",
              "TELEGRAM_ALERTS_ENABLED":"false",
          }
          Path(".env").write_text("\n".join(f"{k}={v}" for k,v in env.items())+"\n", encoding="utf-8")
          PY
      - name: Update the existing live test post only
        run: |
          python - <<'PY'
          from article_draft_publisher import publish_one_blogger_post
          result = publish_one_blogger_post(target_article_id="06fc584b7931c6ac", mode="live")
          article = result.get("article") or {}
          print("updated_existing:", result.get("updated_existing"))
          print("created_new:", result.get("created_new"))
          print("error:", result.get("error"))
          print("post_id:", article.get("blogger_post_id"))
          print("post_url:", article.get("blogger_post_url"))
          print("words:", article.get("final_word_count"))
          print("zero_row_present:", ">0</td>" in str(article.get("final_html") or ""))
          PY
