name: Blogger Migration - Original Content Backup

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/blogger-migration-backup.yml"

permissions:
  contents: read

jobs:
  backup-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "google-auth>=2.20,<3" "requests>=2.31,<3"
      - name: Read original Blogger contents - no writes
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
          BLOGGER_CLIENT_SECRET_JSON: ${{ secrets.BLOGGER_CLIENT_SECRET_JSON }}
        run: python migration/blogger_backup.py
      - name: Store backup for recovery without committing content to repo
        uses: actions/upload-artifact@v4
        with:
          name: cyberoplus-original-posts-and-pages
          path: migration-output/
          retention-days: 30
          if-no-files-found: error
