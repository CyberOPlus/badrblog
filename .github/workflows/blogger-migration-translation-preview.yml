name: Blogger Migration - Translation Preview ONLY

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/blogger-migration-translation-preview.yml"

permissions:
  contents: read

jobs:
  translation-preview-no-publishing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "google-auth>=2.20,<3" "requests>=2.31,<3"
      - name: Fetch verified originals from Blogger - GET only
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
          BLOGGER_CLIENT_SECRET_JSON: ${{ secrets.BLOGGER_CLIENT_SECRET_JSON }}
        run: python migration/blogger_backup.py
      - name: Translate one post and one page; validate HTML; DO NOT PUBLISH
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MIGRATION_GEMINI_MODEL: gemini-3.8-flash
        run: python migration/translate_preview.py
      - name: Save translation preview for review
        uses: actions/upload-artifact@v4
        with:
          name: cyberoplus-english-translation-preview
          path: migration-output/translation-preview.json
          retention-days: 30
          if-no-files-found: error
# Retry transient Gemini API 503 using guarded model fallback; still no Blogger writes.
# Require structured JSON schema for translation segments; still preview-only.
# Preserve already-validated preview items on partial provider failures.
