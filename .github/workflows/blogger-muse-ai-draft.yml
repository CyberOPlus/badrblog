name: CyberoPlus - Create Muse AI Blogger Draft
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/blogger-muse-ai-draft.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cyberoplus-muse-ai-single-draft
  cancel-in-progress: false

jobs:
  create-verified-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout prepared article, code and illustrations
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate content and syntax
        run: |
          python -m py_compile editorial/muse-ai-2026/create_draft.py
          python - <<'PY'
          import json
          from pathlib import Path
          item=json.loads(Path("editorial/muse-ai-2026/draft.json").read_text(encoding="utf-8"))
          assert item["state"]=="DRAFT_ONLY"
          assert all(x in item["content"] for x in ["DFFSDP","NLQPB2"])
          assert "__URL_IMAGE_" not in item["content"]
          assert len(item["content"])>15000
          print("ARTICLE_PRECHECK_PASSED")
          PY
      - name: Install minimal Blogger authentication dependencies
        run: python -m pip install --disable-pip-version-check "google-auth>=2.20,<3" "requests>=2.31,<3"
      - name: Create and verify Blogger draft only
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
          BLOGGER_CLIENT_SECRET_JSON: ${{ secrets.BLOGGER_CLIENT_SECRET_JSON }}
        run: python -u editorial/muse-ai-2026/create_draft.py

# Recheck existing Blogger draft after fixing timestamp validation (2026-11-18).
