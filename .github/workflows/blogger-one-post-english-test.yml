name: ONE POST - English translation verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/blogger-one-post-english-test.yml"

permissions:
  contents: read
concurrency:
  group: cyberoplus-one-post-English-test
  cancel-in-progress: false
jobs:
  verify-existing-post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "google-auth>=2.20,<3" "requests>=2.31,<3"
      - name: Update ONLY verified existing article, then confirm Blogger response
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
          BLOGGER_CLIENT_SECRET_JSON: ${{ secrets.BLOGGER_CLIENT_SECRET_JSON }}
          SINGLE_ARTICLE_APPLY: I_CONFIRM_THIS_ONE_POST_ONLY
        run: python migration/single_post_safe_update.py
