name: CyberoPlus - Review and Publish Changedetection Draft
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/blogger-publish-changedetection-reviewed.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cyberoplus-draft-reviewed
  cancel-in-progress: false
jobs:
  review-and-publish-existing-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Blogger client and HTML validation
        run: python -m pip install --disable-pip-version-check "google-auth>=2.20,<3" "requests>=2.31,<3" "beautifulsoup4>=4.12,<5"
      - name: Verify draft, improve technology content, and publish once if Blogger permits
        env:
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
          BLOGGER_CLIENT_SECRET_JSON: ${{ secrets.BLOGGER_CLIENT_SECRET_JSON }}
        run: python migration/editorial/review_and_publish_changedetection.py
