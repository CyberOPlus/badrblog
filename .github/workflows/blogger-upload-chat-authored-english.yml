name: CyberoPlus - Publish ChatGPT Authored English Articles
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/blogger-upload-chat-authored-english.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: cyberoplus-chat-authored-english-publisher
  cancel-in-progress: false
jobs:
  publish-chat-authored-english:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exactly authored content and frozen publisher
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install only Blogger client and HTML inspector (no language models)
        run: python -m pip install --disable-pip-version-check "google-auth>=2.20,<3" "requests>=2.31,<3" "beautifulsoup4>=4.12,<5"
      - name: Decode publisher written in ChatGPT and verify syntax
        run: |
          base64 -d migration/editorial/from_chat/publisher.py.b64 > /tmp/cyberoplus_publish_chat_content.py
          python -m py_compile /tmp/cyberoplus_publish_chat_content.py
      - name: Upload only the prepared HTML of Arabic articles; verify every post
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
          BLOGGER_CLIENT_SECRET_JSON: ${{ secrets.BLOGGER_CLIENT_SECRET_JSON }}
        run: python -u /tmp/cyberoplus_publish_chat_content.py
