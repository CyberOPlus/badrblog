name: CyberoPlus - Correct 35 Translation Errors in 17 Technical Articles
on:
  push:
    branches: [main]
    paths: [".github/workflows/cyberoplus-correct-17-translation-errors.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cyberoplus-correct-17-translation-errors
  cancel-in-progress: false
jobs:
  correct-seventeen-technical-articles:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check "google-auth>=2.20,<3" "requests>=2.31,<3" "beautifulsoup4>=4.12,<5"
      - name: Patch seventeen specific posts after current Blogger preflight
        env:
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
          BLOGGER_CLIENT_SECRET_JSON: ${{ secrets.BLOGGER_CLIENT_SECRET_JSON }}
        run: python -u migration/editorial/nov2026_translation_17/publish_17.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyberoplus-correct-seventeen-verified-results
          path: results_translation_17.json
          if-no-files-found: warn