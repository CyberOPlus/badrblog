name: CyberoPlus - One-Time Read-Only Full Editorial QA 2026-11-04
on:
  push:
    branches: [main]
    paths: [".github/workflows/cyberoplus-deep-audit-20261104.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "google-auth>=2.20,<3" "requests>=2.31,<3" "beautifulsoup4>=4.12,<5"
      - name: Audit current Blogger posts without publishing or editing
        env:
          BLOGGER_TOKEN_JSON: \${{ secrets.BLOGGER_TOKEN_JSON }}
          BLOGGER_CLIENT_SECRET_JSON: \${{ secrets.BLOGGER_CLIENT_SECRET_JSON }}
        run: python -u migration/editorial/deep_audit_20261104.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyberoplus-full-editorial-readonly-qa
          path: cyberoplus_deep_qa_20261104.json
          retention-days: 7
          if-no-files-found: warn
