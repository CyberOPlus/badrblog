name: CyberoPlus - Expand Eleven Shortened Technical Lessons
on:
  push:
    branches: [main]
    paths: [".github/workflows/cyberoplus-expand-11-lessons.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cyberoplus-reviewed-expansion-11
  cancel-in-progress: false
jobs:
  expand-eleven-technical-lessons:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check "google-auth>=2.20,<3" "requests>=2.31,<3" "beautifulsoup4>=4.12,<5"
      - name: Update and verify eleven previously shortened lessons
        env:
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
          BLOGGER_CLIENT_SECRET_JSON: ${{ secrets.BLOGGER_CLIENT_SECRET_JSON }}
        run: python -u migration/editorial/nov2026_expanded_11/publish_11.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyberoplus-expanded-11-verified-results
          path: results_11.json
          if-no-files-found: warn
# Explicit one-time run; no recurring schedule. Correct manifest identity validation.

# Retry after correcting manifest SHA field name; no schedule.
