name: CyberoPlus Publish 20 Reviewed English SEO Introductions
on:
  push:
    branches: [main]
    paths: [".github/workflows/cyberoplus-intro-publish.yml"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: cyberoplus-reviewed-seo-intros
  cancel-in-progress: false
jobs:
  publish-reviewed-intros:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Blogger and HTML dependencies
        run: python -m pip install --disable-pip-version-check "google-auth>=2.20,<3" "requests>=2.31,<3" "beautifulsoup4>=4.12,<5"
      - name: Update only reviewed introductions with strict 259-post baseline checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
          BLOGGER_CLIENT_SECRET_JSON: ${{ secrets.BLOGGER_CLIENT_SECRET_JSON }}
          PYTHONUNBUFFERED: "1"
        run: python migration/editorial/publish_20_reviewed_intros.py
