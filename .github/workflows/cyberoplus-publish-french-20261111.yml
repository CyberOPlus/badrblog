name: CyberoPlus - Publish 259 French Posts From One-Day Artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: cyberoplus-french-publication-exclusive
  cancel-in-progress: false
jobs:
  publish-and-reread-french:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'google-auth>=2.20,<3' 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Validate all 25 temporary payload artifacts
        env:
          GH_DOWNLOAD_TOKEN: ${{ github.token }}
        run: python migration/french-20261110/download_parts.py
      - name: Update the same 259 live posts and verify every result
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
          BLOGGER_CLIENT_SECRET_JSON: ${{ secrets.BLOGGER_CLIENT_SECRET_JSON }}
        run: python migration/french-20261110/publish_french.py
      - name: Export only the published French posts and pages
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
          BLOGGER_CLIENT_SECRET_JSON: ${{ secrets.BLOGGER_CLIENT_SECRET_JSON }}
        run: python migration/blogger_export_published.py
      - name: Keep the French export and publication report for one day
        uses: actions/upload-artifact@v4
        with:
          name: cyberoplus-french-published-posts-pages-1day
          path: |
            migration-output/
            french-publication-report.json
          retention-days: 1
          if-no-files-found: error
