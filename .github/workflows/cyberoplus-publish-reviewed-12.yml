name: CyberoPlus - Publish 12 Carefully Rewritten Article Openings
on:
  push:
    branches: [main]
    paths: [".github/workflows/cyberoplus-publish-reviewed-12.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cyberoplus-inplace-editorial-updates
  cancel-in-progress: false
jobs:
  publish-twelve-reviewed-leads:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check "google-auth>=2.20,<3" "requests>=2.31,<3" "beautifulsoup4>=4.12,<5"
      - name: Update and re-read 12 original Blogger posts
        env:
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
          BLOGGER_CLIENT_SECRET_JSON: ${{ secrets.BLOGGER_CLIENT_SECRET_JSON }}
        run: python -u migration/editorial/nov2026_reviewed_12/publish_12.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyberoplus-reviewed-12-publishing-results
          path: results_12.json
          if-no-files-found: warn