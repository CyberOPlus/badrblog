name: CyberoPlus - Fix 23 Degraded Article Intros and SEO Titles
on:
  push:
    branches: [main]
    paths: [".github/workflows/cyberoplus-publish-reviewed-23.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cyberoplus-reviewed-expansion-23
  cancel-in-progress: false
jobs:
  publish-23-editorial-leads:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check "google-auth>=2.20,<3" "requests>=2.31,<3" "beautifulsoup4>=4.12,<5"
      - name: Update and verify 23 carefully reviewed Blogger articles
        env:
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
          BLOGGER_CLIENT_SECRET_JSON: ${{ secrets.BLOGGER_CLIENT_SECRET_JSON }}
        run: python -u migration/editorial/nov2026_reviewed_23/publish_23.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyberoplus-reviewed-23-publishing-results
          path: results_23.json
          if-no-files-found: warn
# Explicit one-time run; no recurring schedule. Correct manifest identity validation.
