name: CyberoPlus - Publish Two Individually Reviewed Networking Articles
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cyberoplus-reviewed-networking-round2.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cyberoplus-review-publisher-nov-2026
  cancel-in-progress: false
jobs:
  publish-reviewed-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "google-auth>=2.20,<3" "requests>=2.31,<3" "beautifulsoup4>=4.12,<5"
      - name: Update only two reviewed Blogger posts and verify immutable metadata
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
          BLOGGER_CLIENT_SECRET_JSON: ${{ secrets.BLOGGER_CLIENT_SECRET_JSON }}
        run: python -u migration/editorial/reviewed_nov2026_round2/publish_reviewed.py
      - name: Archive per-post verified write results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyberoplus-reviewed-networking-round2-results
          path: reviewed_publication_result.json
          retention-days: 14