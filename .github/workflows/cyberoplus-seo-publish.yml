name: CyberoPlus Reviewed SEO Titles and Plus UI Formatting
on:
  push:
    branches: [main]
    paths: [".github/workflows/cyberoplus-seo-publish.yml"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: cyberoplus-reviewed-seo-batch
  cancel-in-progress: false
jobs:
  publish-checked-editorial-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Blogger authentication, HTML parser, snapshot reader
        run: python -m pip install --disable-pip-version-check "google-auth>=2.20,<3" "requests>=2.31,<3" "beautifulsoup4>=4.12,<5"
      - name: Save only ChatGPT-authored SEO titles and two verified HTML layout corrections
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
          BLOGGER_CLIENT_SECRET_JSON: ${{ secrets.BLOGGER_CLIENT_SECRET_JSON }}
          PYTHONUNBUFFERED: "1"
        run: python migration/editorial/publish_reviewed_seo_and_format.py
