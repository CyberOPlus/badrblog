name: CyberoPlus - Publish Vetted Coaxial and Scrapling Headings Once
on:
  push:
    branches: [main]
    paths: [".github/workflows/cyberoplus-verified-heading-corrections.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cyberoplus-one-time-vetted-heading-corrections
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "google-auth>=2.20,<3" "requests>=2.31,<3" "beautifulsoup4>=4.12,<5"
      - name: Correct verified technical headings with Blogger live SHA guards
        env:
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
          BLOGGER_CLIENT_SECRET_JSON: ${{ secrets.BLOGGER_CLIENT_SECRET_JSON }}
        run: python -u migration/editorial/nov2026_publish_verified_headings.py
