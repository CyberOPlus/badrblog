name: Direct One-Shot Job Publish
# Direct run armed: official same-day PDF job

on:
  push:
    paths:
      - ".github/workflows/direct-publish-smoke.yml"

concurrency:
  group: jobs-production-refs/heads/main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  direct-one-shot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Arabic/French scanned-PDF OCR
        run: |
          if ! command -v tesseract >/dev/null 2>&1 \
             || ! tesseract --list-langs 2>/dev/null | grep -qx 'fra' \
             || ! tesseract --list-langs 2>/dev/null | grep -qx 'ara'; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends \
              tesseract-ocr tesseract-ocr-fra tesseract-ocr-ara
          fi

      - name: Create direct Jobs runtime
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_SECRET_JSON: ${{ secrets.BLOGGER_CLIENT_SECRET_JSON }}
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          JOBS_GOOGLE_INDEXING_ENABLED: ${{ secrets.JOBS_GOOGLE_INDEXING_ENABLED }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          for name in ("BLOGGER_BLOG_ID", "BLOGGER_CLIENT_SECRET_JSON", "BLOGGER_TOKEN_JSON"):
              if not os.environ.get(name, "").strip():
                  raise SystemExit(f"Missing required secret: {name}")
          json.loads(os.environ["BLOGGER_CLIENT_SECRET_JSON"])
          json.loads(os.environ["BLOGGER_TOKEN_JSON"])
          if not any(os.environ.get(x, "").strip() for x in (
              "GEMINI_API_KEY", "GROQ_API_KEY", "OPENROUTER_API_KEY",
              "MISTRAL_API_KEY", "CLOUDFLARE_API_TOKEN",
          )):
              raise SystemExit("No AI provider secret is available")

          Path("data").mkdir(exist_ok=True)
          Path("client_secret.json").write_text(os.environ["BLOGGER_CLIENT_SECRET_JSON"], encoding="utf-8")
          Path("data/token.json").write_text(os.environ["BLOGGER_TOKEN_JSON"], encoding="utf-8")
          env = {
              "JOBS_MODE":"true","JOBS_TEST_MODE":"false","JOBS_TIMEZONE":"Africa/Casablanca",
              "JOBS_MIN_SELECTION_SCORE":"65","JOBS_QUEUE_SCORE":"50",
              "JOBS_ADAPTIVE_PUBLISHING":"true","JOBS_ADAPTIVE_MIN_DAILY_CAP":"240",
              "JOBS_ADAPTIVE_MAX_DAILY_CAP":"240","JOBS_ACTIVE_START_HOUR":"0","JOBS_ACTIVE_END_HOUR":"24",
              "JOBS_MIN_PUBLISH_INTERVAL_MINUTES":"0","JOBS_MAX_PUBLISH_AGE_HOURS":"12",
              "GEMINI_API_KEY":os.environ.get("GEMINI_API_KEY",""),"GEMINI_MODEL":"gemini-2.5-flash",
              "OPENROUTER_API_KEY":os.environ.get("OPENROUTER_API_KEY",""),"OPENROUTER_MODEL":"openrouter/free",
              "OPENROUTER_MODELS":"openrouter/free","OPENROUTER_APP_NAME":"Jobs Direct One-Shot",
              "GROQ_API_KEY":os.environ.get("GROQ_API_KEY",""),"GROQ_MODEL":"openai/gpt-oss-20b",
              "MISTRAL_API_KEY":os.environ.get("MISTRAL_API_KEY",""),"MISTRAL_MODEL":"mistral-small-latest",
              "CLOUDFLARE_API_TOKEN":os.environ.get("CLOUDFLARE_API_TOKEN",""),
              "CLOUDFLARE_ACCOUNT_ID":os.environ.get("CLOUDFLARE_ACCOUNT_ID",""),
              "CLOUDFLARE_MODEL":"@cf/meta/llama-3.1-8b-instruct",
              "BLOG_ID":os.environ["BLOGGER_BLOG_ID"],"PUBLISH_MODE":"live","SAFE_MODE":"false",
              "BLOGGER_LIVE_ENABLED":"true","FACEBOOK_AUTO_POST":"false",
              "JOBS_GOOGLE_INDEXING_ENABLED":os.environ.get("JOBS_GOOGLE_INDEXING_ENABLED","false"),
              "GOOGLE_SERVICE_ACCOUNT_JSON":os.environ.get("GOOGLE_SERVICE_ACCOUNT_JSON",""),
              "MAX_POSTS_PER_RUN":"1","MAX_ARTICLES_PER_RUN":"1","MIN_ARTICLE_WORDS":"0",
              "MIN_EXTRACTED_CHARS":"80","SOURCE_TIMEOUT_SECONDS":"10","ARTICLE_TIMEOUT_SECONDS":"12",
              "AI_TOTAL_TIME_BUDGET_SECONDS":"100","GEMINI_TIMEOUT_SECONDS":"30",
              "AI_MODEL_TIMEOUT_SECONDS":"30","OPENROUTER_TIMEOUT_SECONDS":"30",
              "GROQ_TIMEOUT_SECONDS":"30","MISTRAL_TIMEOUT_SECONDS":"30","CLOUDFLARE_TIMEOUT_SECONDS":"30",
              "MAX_AI_RETRIES":"2","JOBS_AI_QUALITY_REPAIRS":"1","JOBS_AI_TIMEOUT_RETRIES":"0",
              "JOBS_AI_CROSS_CANDIDATE_RETRIES":"0","JOBS_ONE_SHOT_FORCE_RUN":"true",
              "SOURCE_HEALTH_ENABLED":"true","ENABLE_SCRAPLING_FALLBACK":"false",
              "MAX_DRAFTS_PER_DAY":"240","MIN_MINUTES_BETWEEN_DRAFTS":"0",
              "MAX_LIVE_POSTS_PER_DAY":"240","TARGET_LIVE_POSTS_PER_DAY":"240",
              "MIN_MINUTES_BETWEEN_LIVE_POSTS":"0","AI_PROVIDER":"auto",
          }
          Path(".env").write_text("\n".join(f"{k}={v}" for k,v in env.items())+"\n",encoding="utf-8")
          print("Direct target mode ready. auto-cycle is not invoked.")
          PY

      - name: Verify one official PDF target and publish it
        timeout-minutes: 10
        run: |
          python - <<'PY'
          import json, re
          from datetime import datetime, timezone

          from article_enricher import enrich_article
          from article_processor import _prepare_identity_evidence
          from article_queue import load_article_queue, save_article_queue, make_article_id
          from duplicate_utils import canonicalize_url
          from job_core import (
              prepare_job_candidate,
              _parse_date,
              job_deadline_time,
              job_publication_freshness,
          )
          from main import _process_job_target

          url = "https://www.emploi-public.ma/ar/%D8%AA%D9%81%D8%A7%D8%B5%D9%8A%D9%84/%D8%A7%D9%84%D9%85%D8%A8%D8%A7%D8%B1%D9%8A%D8%A7%D8%AA/2835f644-995b-4a06-a386-c41338bde62b"
          listing = "https://www.emploi-public.ma/ar/%D9%82%D8%A7%D8%A6%D9%85%D8%A9-%D8%A7%D9%84%D9%85%D8%A8%D8%A7%D8%B1%D9%8A%D8%A7%D8%AA?corps=0&procedure=0&region=0&stat=etab_publics"
          key = canonicalize_url(url)
          queue = load_article_queue()
          existing = next((
              row for row in queue.get("articles", [])
              if canonicalize_url(row.get("url") or row.get("canonical_url")) == key
          ), None)

          if existing and (
              existing.get("blogger_post_id")
              or str(existing.get("publish_status") or "").lower() == "published"
          ):
              summary = {
                  "completed": True,
                  "already_published": True,
                  "title": existing.get("seo_title") or existing.get("title") or "",
                  "blogger_url": existing.get("blogger_post_url") or "",
                  "blogger_post_id": existing.get("blogger_post_id") or "",
              }
              print("DIRECT_PUBLISH_RESULT="+json.dumps(summary,ensure_ascii=False))
              with open("direct_publish_result.json","w",encoding="utf-8") as out:
                  json.dump(summary,out,ensure_ascii=False,indent=2); out.write("\n")
              if not summary["blogger_url"]:
                  raise SystemExit("Target is marked published but no Blogger URL is stored.")
              raise SystemExit(0)

          article = existing if existing is not None else {
              "id": make_article_id(f"direct-pdf-one-shot|{url}"),
              "url": url,
              "canonical_url": key,
          }
          article.update({
              "title": "مباراة لتوظيف متصرف من الدرجة الثانية - سلم 11",
              "url": url,
              "canonical_url": key,
              "source_name": "Emploi-Public — établissements publics",
              "source_url": listing,
              "source_priority": "S+",
              "official_source": True,
              "source_country": "MA",
              "source_eligibility": "morocco",
              "category_key": "jobs-morocco",
              "category_name": "Jobs Morocco",
              "category_label": "jobs-morocco",
              "category_hint": "jobs-morocco",
              "ats_provider": "emploi_public",
              "ats_reference": "2835f644-995b-4a06-a386-c41338bde62b",
              "status": "ready",
          })
          for field in (
              "archived","archive_reason","skip_reason","candidate_retry_after",
              "candidate_failure_stage","candidate_failure_reason",
          ):
              article.pop(field, None)

          ok, error = enrich_article(article)
          if not ok:
              raise SystemExit(f"Official target enrichment failed: {error}")

          published_raw = str(article.get("job_published_at") or article.get("source_published_at") or "").strip()
          published = _parse_date(published_raw)
          age = None
          if published:
              if published.tzinfo is None:
                  published = published.replace(tzinfo=timezone.utc)
              age = (datetime.now(timezone.utc)-published.astimezone(timezone.utc)).total_seconds()/3600

          probe = {
              "url": url,
              "official_published_at": published_raw,
              "age_hours": round(age,2) if age is not None else None,
              "deadline": article.get("job_deadline",""),
              "job_title": article.get("job_title",""),
              "company": article.get("job_company",""),
              "positions": article.get("job_number_of_positions",""),
              "application_url": article.get("job_application_url",""),
              "application_kind": article.get("job_application_link_kind",""),
              "document_links": article.get("job_document_links") or [],
          }
          print("OFFICIAL_PDF_TARGET_PROBE="+json.dumps(probe,ensure_ascii=False,default=str))

          freshness = job_publication_freshness(article)
          print("OFFICIAL_FRESHNESS="+json.dumps(freshness,ensure_ascii=False,default=str))
          if not freshness["verified"] or freshness["future"] or not freshness["fresh"]:
              raise SystemExit("The official PDF target is outside the production freshness rule.")
          deadline = job_deadline_time(article)
          if deadline is not None and deadline <= datetime.now(timezone.utc):
              raise SystemExit("The official PDF target is already expired.")
          if not article.get("job_application_url"):
              raise SystemExit("The official target has no verified application channel.")
          if not article.get("job_document_links"):
              raise SystemExit("The official target exposes no document/PDF link; refusing this PDF validation run.")

          # Read every official document before AI. Scanned pages use Arabic/French OCR.
          snapshot = _prepare_identity_evidence(article)
          pdf_probe = {
              "read_complete": article.get("job_document_text_read_complete") is True,
              "download_failures": int(article.get("job_document_text_download_failures") or 0),
              "text_pages": int(article.get("job_document_text_pages") or 0),
              "text_chars": int(article.get("job_document_text_chars") or 0),
              "identity_stage": article.get("identity_evidence_stage_status",""),
              "identity_strength": (snapshot or {}).get("strength",0),
          }
          print("OFFICIAL_PDF_READ="+json.dumps(pdf_probe,ensure_ascii=False,default=str))
          if not pdf_probe["read_complete"] or pdf_probe["download_failures"]:
              raise SystemExit("Official PDF evidence was not completely read; refusing AI/Blogger publication.")
          if pdf_probe["text_pages"] <= 0 or pdf_probe["text_chars"] <= 0:
              raise SystemExit("Official PDF produced no readable evidence after text extraction/OCR.")

          quality, decision = prepare_job_candidate(article)
          print("DIRECT_QUALITY="+json.dumps({
              "status": quality.get("status"),
              "passed": quality.get("passed"),
              "reasons": quality.get("reasons"),
              "identity_action": decision.get("action"),
              "identity_reason": decision.get("reason"),
          },ensure_ascii=False,default=str))
          if not quality.get("passed"):
              raise SystemExit("The verified target failed the job-quality gate: "+str(quality.get("reasons") or ""))
          if decision.get("action") in {"duplicate","hold","update"}:
              raise SystemExit("The verified target is not a new publishable campaign: "+str(decision.get("reason") or ""))

          if existing is None:
              queue.setdefault("articles", []).append(article)
          article["status"] = "selected"
          article["selected_at"] = datetime.now(timezone.utc).isoformat(timespec="seconds")
          article["selection_reason"] = "user-authorized direct PDF one-shot; no auto-cycle"
          save_article_queue(queue)

          result = _process_job_target(article, "live")
          article = result.get("article") or article
          package = article.get("ai_input_package") if isinstance(article.get("ai_input_package"),dict) else {}
          pages = article.get("job_document_page_images") or package.get("job_document_page_images") or []
          page_urls = [str(x.get("url") or "") for x in pages if isinstance(x,dict) and str(x.get("url") or "")]
          final_html = str(article.get("final_html") or article.get("blogger_article_html") or "")
          hidden_values = [
              str(article.get("job_external_reference") or "").strip(),
              str(article.get("ats_reference") or "").strip(),
          ]
          hidden_values = [x for x in hidden_values if x]
          leak_patterns = [
              r"تاريخ\s*النشر", r"تاريخ\s*الإعلان", r"Date\s+de\s+publication",
              r"publication\s+date", r"رقم\s*المرجع", r"رمز\s*المباراة",
              r"Reference\s*:", r"Référence\s*:",
          ]
          metadata_leak = any(re.search(p, final_html, flags=re.I) for p in leak_patterns)
          raw_reference_leak = any(value in final_html for value in hidden_values)
          missing_page_urls = [u for u in page_urls if u not in final_html]

          summary = {
              "completed": bool(result.get("completed")),
              "reason": result.get("reason",""),
              "article_id": article.get("id",""),
              "title": article.get("seo_title") or article.get("title") or "",
              "source_url": article.get("url",""),
              "official_publication_time": published_raw,
              "deadline": article.get("job_deadline",""),
              "blogger_url": article.get("blogger_post_url",""),
              "blogger_post_id": article.get("blogger_post_id",""),
              "document_links": len(article.get("job_document_links") or []),
              "document_text_pages": int(article.get("job_document_text_pages") or 0),
              "document_text_chars": int(article.get("job_document_text_chars") or 0),
              "ocr_pages": int(article.get("job_document_ocr_pages") or 0),
              "rendered_pdf_pages": len(page_urls),
              "pdf_pages_present_in_html": bool(page_urls) and not missing_page_urls,
              "missing_pdf_page_urls": missing_page_urls,
              "metadata_leak": metadata_leak,
              "raw_reference_leak": raw_reference_leak,
              "word_count": int(article.get("final_word_count") or 0),
              "facebook": "disabled_for_direct_article_test",
          }
          print("DIRECT_PUBLISH_RESULT="+json.dumps(summary,ensure_ascii=False,default=str))
          with open("direct_publish_result.json","w",encoding="utf-8") as out:
              json.dump(summary,out,ensure_ascii=False,indent=2,default=str); out.write("\n")

          if not result.get("completed") or not article.get("blogger_post_url"):
              raise SystemExit("Direct PDF target reached the pipeline but Blogger publication did not complete.")
          if not page_urls:
              raise SystemExit("Blogger published without rendered official PDF pages; treating run as failed.")
          if missing_page_urls:
              raise SystemExit("Some rendered official PDF pages are missing from final article HTML.")
          if metadata_leak or raw_reference_leak:
              raise SystemExit("Internal publication/reference metadata leaked into the final article.")
          PY

      - name: Persist direct one-shot state
        if: always()
        run: |
          rm -f .env client_secret.json data/token.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          STATE_PATHS=(
            "jobs_article_queue.json" "data/job_state.json" "data/job_memory"
            "data/job_visual_state.json" "data/jobs_adaptive_state.json"
            "data/job_queue_archive" "data/crawl_state.json"
            "data/ai_provider_memory.json" "data/internal_link_cache.json"
            "data/source_health.json" "direct_publish_result.json"
          )
          for path in "${STATE_PATHS[@]}"; do
            [ -e "$path" ] && git add -f "$path"
          done
          if ! git diff --cached --quiet; then
            git commit -m "Persist direct one-shot job publish state [skip ci]"
          fi
          git pull --rebase origin main
          git push origin HEAD:main
