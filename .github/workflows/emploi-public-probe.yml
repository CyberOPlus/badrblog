name: Emploi Public Arabic Probe
on:
  push:
    branches: [main]
    paths: [".github/workflows/emploi-public-probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Probe Arabic listings
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          urls = [
            "https://www.emploi-public.ma/ar/",
            "https://www.emploi-public.ma/ar/%D9%82%D8%A7%D8%A6%D9%85%D8%A9-%D8%A7%D9%84%D9%85%D8%A8%D8%A7%D8%B1%D9%8A%D8%A7%D8%AA",
            "https://www.emploi-public.ma/ar/%D9%82%D8%A7%D8%A6%D9%85%D8%A9-%D8%A7%D9%84%D9%85%D8%A8%D8%A7%D8%B1%D9%8A%D8%A7%D8%AA?stat=service_etat",
            "https://www.emploi-public.ma/ar/%D9%82%D8%A7%D8%A6%D9%85%D8%A9-%D8%A7%D9%84%D9%85%D8%A8%D8%A7%D8%B1%D9%8A%D8%A7%D8%AA?stat=etab_publics",
          ]
          session = requests.Session()
          session.headers.update({"User-Agent":"Mozilla/5.0"})
          for url in urls:
              try:
                  response = session.get(url, timeout=20, allow_redirects=True)
                  soup = BeautifulSoup(response.text, "html.parser")
                  detail = []
                  for a in soup.find_all("a", href=True):
                      href = str(a.get("href") or "")
                      text = " ".join(a.get_text(" ", strip=True).split())
                      if "concours" in href or "%D9%85%D8%A8%D8%A7%D8%B1" in href or "مبار" in href:
                          detail.append((text[:120], href))
                      if len(detail) >= 5:
                          break
                  page_text = " ".join(soup.get_text(" ", strip=True).split())
                  print("URL", url)
                  print("STATUS", response.status_code)
                  print("FINAL", response.url)
                  print("LEN", len(response.text))
                  print("HAS_ARABIC_DEADLINE", "آخر أجل" in page_text)
                  print("HAS_STATE", "مصالح الدولة" in page_text)
                  print("HAS_PUBLIC", "المؤسسات والمقاولات العمومية" in page_text)
                  print("DETAILS", detail)
                  print("---")
              except Exception as error:
                  print("ERROR", url, repr(error))
                  print("---")
          PY
