name: Jobs Enrichment Diagnostic
on:
  push:
    branches: [main]
    paths: [".github/workflows/enrichment-diagnostic.yml"]
jobs:
  diagnose:
    if: contains(github.event.head_commit.message, '[enrichment-diagnostic]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests beautifulsoup4
      - name: Verify final ATS payload paths
        run: |
          python - <<'PY'
          import json,re,requests,html
          from bs4 import BeautifulSoup
          H={"User-Agent":"Mozilla/5.0","Accept":"text/html,application/json,*/*"}
          def dump(k,v):
              print("\n===",k,"==="); print(json.dumps(v,ensure_ascii=False,indent=2)[:40000])

          def csod(name,home,req):
              s=requests.Session(); h=s.get(home,headers=H,timeout=15)
              token=re.search(r'"token"\s*:\s*"([A-Za-z0-9._-]+)"',h.text).group(1)
              origin=f"{requests.utils.urlparse(home).scheme}://{requests.utils.urlparse(home).netloc}"
              hdr={**H,"Accept":"application/json","Authorization":f"Bearer {token}"}
              urls={
                "detail":f"{origin}/services/x/job-requisition/v2/requisitions/{req}/jobDetails?cultureId=1",
                "ad":f"{origin}/Services/API/ATS/CareerSite/4/JobRequisitions/{req}?useMobileAd=false&cultureId=1",
                "posting":f"{origin}/services/x/career-site/v1/requisition/{req}",
              }
              out={}
              for k,u in urls.items():
                  r=s.get(u,headers=hdr,timeout=15)
                  out[k]={"status":r.status_code,"ct":r.headers.get("content-type",""),"body":r.text[:15000]}
                  try: out[k]["json"]=r.json()
                  except Exception: pass
              dump(name,out)
          csod("IAM_FINAL","https://iam.csod.com/ux/ats/careersite/4/home?c=iam",69)
          csod("ATTIJARI_FINAL","https://attijariwafabank.csod.com/ux/ats/careersite/4/home?c=attijariwafabank",2659)

          raw=requests.get("https://orange.jobs/jobs/v3/search?rk=l-maroc&s=1&lang=fr",headers=H,timeout=15).text
          soup=BeautifulSoup(raw,"html.parser")
          sc=next(x for x in soup.find_all("script") if "phApp.ddo" in (x.string or x.get_text("",strip=False)))
          txt=html.unescape(sc.string or sc.get_text("",strip=False))
          marker="phApp.ddo = "
          start=txt.find(marker)+len(marker)
          i=start; depth=0; quote=None; esc=False; end=None
          while i<len(txt):
              ch=txt[i]
              if quote:
                  if esc: esc=False
                  elif ch=="\\": esc=True
                  elif ch==quote: quote=None
              else:
                  if ch in ('"',"'"): quote=ch
                  elif ch=="{": depth+=1
                  elif ch=="}":
                      depth-=1
                      if depth==0:
                          end=i+1; break
              i+=1
          obj=json.loads(txt[start:end])
          found=[]
          def walk(v,path=""):
              if isinstance(v,dict):
                  if "jobId" in v and "title" in v:
                      found.append((path,v))
                  for k,x in v.items(): walk(x,path+"/"+str(k))
              elif isinstance(v,list):
                  for n,x in enumerate(v): walk(x,path+f"/{n}")
          walk(obj)
          mor=[{"path":p,**j} for p,j in found if str(j.get("country","")).upper()=="MOROCCO" or "MOROCCO" in str(j.get("location","")).upper()]
          dump("ORANGE_DDO",{"root_keys":list(obj.keys()),"job_count":len(found),"morocco_count":len(mor),"morocco_jobs":mor[:10]})
          PY
