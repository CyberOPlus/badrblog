name: Jobs Enrichment Diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/enrichment-diagnostic.yml"

jobs:
  diagnose:
    if: contains(github.event.head_commit.message, '[enrichment-diagnostic]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Inspect public ATS frontend endpoints only
        run: |
          python - <<'PY'
          import json,re,requests
          from bs4 import BeautifulSoup
          H={"User-Agent":"Mozilla/5.0","Accept":"text/html,application/xhtml+xml,*/*"}

          def dump(label,obj):
              print("\n===",label,"===")
              print(json.dumps(obj,ensure_ascii=False,indent=2)[:30000])

          def inspect_csod(name,home):
              s=requests.Session()
              r=s.get(home,headers=H,timeout=15)
              soup=BeautifulSoup(r.text,"html.parser")
              scripts=[requests.compat.urljoin(home,x.get("src")) for x in soup.find_all("script",src=True)]
              found=set()
              snippets=[]
              for src in scripts[-15:]:
                  try:
                      rr=s.get(src,headers=H,timeout=15)
                      body=rr.text
                  except Exception:
                      continue
                  for m in re.finditer(r'["\']([^"\']*(?:career-site|requisition)[^"\']*)["\']',body,re.I):
                      val=m.group(1)
                      if len(val)<260:
                          found.add(val)
                  for term in ("career-site/v1","requisitionId","jobDescription","displayJobTitle"):
                      p=body.find(term)
                      if p>=0:
                          snippets.append({"src":src,"term":term,"text":body[max(0,p-500):p+1000]})
              dump(name,{"home_status":r.status_code,"scripts":scripts[-15:],"endpoint_strings":sorted(found)[:100],"snippets":snippets[:20]})

          inspect_csod("IAM_JS","https://iam.csod.com/ux/ats/careersite/4/home?c=iam")
          inspect_csod("ATTIJARI_JS","https://attijariwafabank.csod.com/ux/ats/careersite/4/home?c=attijariwafabank")

          u="https://orange.jobs/jobs/v3/search?rk=l-maroc&s=1&lang=fr"
          r=requests.get(u,headers=H,timeout=15)
          soup=BeautifulSoup(r.text,"html.parser")
          scripts=[requests.compat.urljoin(u,x.get("src")) for x in soup.find_all("script",src=True)]
          raw=r.text
          urls=sorted(set(re.findall(r'https?://[^"\' <>]+',raw)))
          apiish=[x for x in urls if any(k in x.lower() for k in ("api","phenom","jobs"))]
          text_hits=[]
          for term in ("api","jobSearch","search","phenom","jobId","job_id","requisition"):
              for m in list(re.finditer(term,raw,re.I))[:5]:
                  text_hits.append({"term":term,"text":raw[max(0,m.start()-350):m.start()+700]})
          js_hits=[]
          for src in scripts[-12:]:
              try:
                  rr=requests.get(src,headers=H,timeout=15)
                  body=rr.text
              except Exception:
                  continue
              for term in ("jobSearch","/api/","jobs/v3","phenom","jobId","job_id"):
                  p=body.find(term)
                  if p>=0:
                      js_hits.append({"src":src,"term":term,"text":body[max(0,p-500):p+1200]})
          dump("ORANGE_JS",{"status":r.status_code,"scripts":scripts[-12:],"apiish_urls":apiish[:100],"html_hits":text_hits[:30],"js_hits":js_hits[:30]})
          PY
