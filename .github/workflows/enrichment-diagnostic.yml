name: Jobs Enrichment Diagnostic
on:
  push:
    branches: [main]
    paths: [".github/workflows/enrichment-diagnostic.yml"]
jobs:
  diagnose:
    if: contains(github.event.head_commit.message, '[enrichment-diagnostic]')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests beautifulsoup4
      - name: Verify Orange Morocco DDO route
        run: |
          python - <<'PY'
          import json,html,requests
          from bs4 import BeautifulSoup
          H={"User-Agent":"Mozilla/5.0"}
          def parse(url):
              raw=requests.get(url,headers=H,timeout=15).text
              soup=BeautifulSoup(raw,"html.parser")
              sc=next((x for x in soup.find_all("script") if "phApp.ddo" in (x.string or x.get_text("",strip=False))),None)
              txt=html.unescape(sc.string or sc.get_text("",strip=False))
              marker="phApp.ddo = "; start=txt.find(marker)+len(marker)
              depth=0; quote=None; esc=False; end=None
              for i,ch in enumerate(txt[start:],start):
                  if quote:
                      if esc: esc=False
                      elif ch=="\\": esc=True
                      elif ch==quote: quote=None
                  else:
                      if ch in ('"',"'"): quote=ch
                      elif ch=="{": depth+=1
                      elif ch=="}":
                          depth-=1
                          if depth==0: end=i+1; break
              obj=json.loads(txt[start:end])
              jobs=[]
              def walk(v):
                  if isinstance(v,dict):
                      if "jobId" in v and "title" in v: jobs.append(v)
                      for x in v.values(): walk(x)
                  elif isinstance(v,list):
                      for x in v: walk(x)
              walk(obj)
              return [{"jobId":j.get("jobId"),"title":j.get("title"),"country":j.get("country"),"location":j.get("location"),"applyUrl":j.get("applyUrl"),"descriptionTeaser":j.get("descriptionTeaser")} for j in jobs]
          for u in [
              "https://orange.jobs/fr/fr/mea-morocco-job-search-results",
              "https://orange.jobs/fr/fr/network-search-results",
          ]:
              jobs=parse(u)
              print("\nURL",u,"COUNT",len(jobs))
              print(json.dumps(jobs[:10],ensure_ascii=False,indent=2))
          PY
