name: Jobs Enrichment Diagnostic
on:
  push:
    branches: [main]
    paths: [".github/workflows/enrichment-diagnostic.yml"]
jobs:
  diagnose:
    if: contains(github.event.head_commit.message, '[enrichment-diagnostic]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests beautifulsoup4
      - name: Extract exact ATS data structures
        run: |
          python - <<'PY'
          import re,requests,html
          from bs4 import BeautifulSoup
          H={"User-Agent":"Mozilla/5.0"}

          js=requests.get("https://iam.csod.com/player-career-site/1.25.6/pages/home.controls.js",headers=H,timeout=15).text
          for term in ("getJobDetail=function","requisitionBaseUrl=this.serviceBase","/v1/requisition/"):
              p=js.find(term)
              print("\n=== CSOD",term,"===")
              print(js[max(0,p-1800):p+4000] if p>=0 else "NOT FOUND")

          raw=requests.get("https://orange.jobs/jobs/v3/search?rk=l-maroc&s=1&lang=fr",headers=H,timeout=15).text
          soup=BeautifulSoup(raw,"html.parser")
          sc=next((x for x in soup.find_all("script") if "jobId" in (x.string or x.get_text("",strip=False))),None)
          txt=html.unescape(sc.string or sc.get_text("",strip=False)) if sc else ""
          p=txt.upper().find("MOROCCO")
          print("\n=== ORANGE MOROCCO CONTEXT ===")
          print(txt[max(0,p-6000):p+9000] if p>=0 else "NOT FOUND")
          for term in ('"jobs"', '"jobData"', '"searchResults"', '"jobId"', 'getJobSearch'):
              positions=[m.start() for m in re.finditer(re.escape(term),txt,re.I)]
              print("\nTERM",term,"COUNT",len(positions),"FIRST",positions[:10])
          PY
