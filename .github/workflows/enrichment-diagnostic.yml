name: Jobs Enrichment Diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/enrichment-diagnostic.yml"

jobs:
  diagnose:
    if: contains(github.event.head_commit.message, '[enrichment-diagnostic]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run targeted official ATS adapter integration tests
        env:
          JOBS_MODE: "true"
          MIN_EXTRACTED_CHARS: "80"
          MAX_SOURCE_RETRIES: "0"
          SOURCE_TIMEOUT_SECONDS: "12"
          ARTICLE_TIMEOUT_SECONDS: "12"
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio
          import json
          import aiohttp

          import article_enricher
          import scraper

          TARGETS = [
              ("ONCF", "https://www.oncf.etalent.ma/offres", "etalent"),
              ("ADM", "https://adm.etalent.ma/offres", "etalent"),
              ("IAM", "https://iam.csod.com/ux/ats/careersite/4/home?c=iam", "csod"),
              ("ATTIJARI", "https://attijariwafabank.csod.com/ux/ats/careersite/4/home?c=attijariwafabank", "csod"),
              ("ORANGE_MA", "https://orange.jobs/fr/fr/mea-morocco-job-search-results", "phenom_ddo"),
              ("ORANGE_TECH", "https://orange.jobs/fr/fr/network-search-results", "phenom_ddo"),
          ]

          async def discover():
              timeout = aiohttp.ClientTimeout(total=30)
              async with aiohttp.ClientSession(timeout=timeout) as session:
                  result = {}
                  for name, url, extractor in TARGETS:
                      links, error, status, details = await scraper._collect_article_links_for_source_async(
                          session,
                          url,
                          per_source_limit=3,
                          extractor_type=extractor,
                          strict_source_path=False,
                      )
                      result[name] = {
                          "links": links,
                          "error": error,
                          "status": status,
                          "details": details,
                      }
              return result

          results = asyncio.run(discover())
          summary = {}
          for name, row in results.items():
              summary[name] = {
                  "status": row["status"],
                  "error": row["error"],
                  "links": len(row["links"]),
                  "method": row["details"].get("method_used"),
                  "empty_ok": row["details"].get("empty_ok", False),
                  "sample": row["links"][0] if row["links"] else {},
              }

          assert not results["ONCF"]["error"], results["ONCF"]
          assert results["ONCF"]["status"] == 200, results["ONCF"]
          if not results["ONCF"]["links"]:
              assert results["ONCF"]["details"].get("empty_ok") is True

          assert len(results["ADM"]["links"]) >= 1, results["ADM"]
          assert all("/offre/" in row["url"] for row in results["ADM"]["links"])

          for key in ("IAM", "ATTIJARI"):
              assert len(results[key]["links"]) >= 1, results[key]
              link = results[key]["links"][0]
              article = {
                  **link,
                  "id": "integration-" + key.lower(),
                  "source_name": "Maroc Telecom" if key == "IAM" else "Attijariwafa bank",
                  "source_url": TARGETS[2][1] if key == "IAM" else TARGETS[3][1],
                  "official_source": True,
                  "source_country": "MA",
                  "source_eligibility": "morocco",
              }
              ok, error = article_enricher.enrich_article(article)
              assert ok, (key, error, article.get("content_fetch_error"))
              assert article.get("content_fetch_status") == "success", article
              assert len(article.get("full_article_text") or "") >= 250, article
              assert article.get("job_title"), article
              assert article.get("job_application_url"), article
              assert article.get("job_deadline"), article
              summary[key]["enriched_chars"] = len(article.get("full_article_text") or "")
              summary[key]["deadline"] = article.get("job_deadline")
              summary[key]["location"] = article.get("job_location")

          for key in ("ORANGE_MA", "ORANGE_TECH"):
              assert len(results[key]["links"]) >= 1, results[key]
              link = results[key]["links"][0]
              assert link.get("ats_provider") == "phenom", link
              assert link.get("job_application_url"), link
              assert link.get("job_country") == "MA", link
              article = {
                  **link,
                  "id": "integration-" + key.lower(),
                  "source_name": "Orange Maroc",
                  "source_url": TARGETS[4][1] if key == "ORANGE_MA" else TARGETS[5][1],
                  "official_source": True,
                  "source_country": "MA",
                  "source_eligibility": "morocco",
              }
              ok, error = article_enricher.enrich_article(article)
              assert ok, (key, error, article)
              assert article.get("content_fetch_status") == "success", article
              assert article.get("job_application_link_kind") == "direct_apply", article
              summary[key]["enriched_chars"] = len(article.get("full_article_text") or "")
              summary[key]["location"] = article.get("job_location")

          print(json.dumps(summary, ensure_ascii=False, indent=2))
          print("TARGETED_ATS_INTEGRATION_OK")
          PY
