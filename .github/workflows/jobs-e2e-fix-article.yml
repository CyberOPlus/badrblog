name: One-shot Jobs E2E Fix Published Article

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/jobs-e2e-fix-article.yml"

jobs:
  fix:
    if: contains(github.event.head_commit.message, '[jobs-e2e-fix-article]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure Blogger test runtime
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_SECRET_JSON: ${{ secrets.BLOGGER_CLIENT_SECRET_JSON }}
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          for name in ("BLOGGER_BLOG_ID","BLOGGER_CLIENT_SECRET_JSON","BLOGGER_TOKEN_JSON"):
              if not os.environ.get(name,"").strip():
                  raise SystemExit(f"Missing {name}")
          json.loads(os.environ["BLOGGER_CLIENT_SECRET_JSON"])
          json.loads(os.environ["BLOGGER_TOKEN_JSON"])
          Path("data").mkdir(exist_ok=True)
          Path("client_secret.json").write_text(os.environ["BLOGGER_CLIENT_SECRET_JSON"], encoding="utf-8")
          Path("data/token.json").write_text(os.environ["BLOGGER_TOKEN_JSON"], encoding="utf-8")
          env = {
              "JOBS_MODE":"true",
              "JOBS_TEST_MODE":"true",
              "JOBS_EXPECTED_BLOG_HOST":"cyberopluss.blogspot.com",
              "BLOG_ID":os.environ["BLOGGER_BLOG_ID"],
              "PUBLISH_MODE":"live",
              "SAFE_MODE":"false",
              "BLOGGER_LIVE_ENABLED":"true",
              "FACEBOOK_AUTO_POST":"false",
              "ALLOW_SHORT_ARTICLES":"true",
              "MIN_ARTICLE_WORDS":"100",
              "FAST_NEWS_MODE":"false",
          }
          Path(".env").write_text("\n".join(f"{k}={v}" for k,v in env.items())+"\n", encoding="utf-8")
          PY

      - name: Patch direct application URL and update same Blogger post
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from bs4 import BeautifulSoup
          from duplicate_utils import content_hash_from_html
          from article_draft_publisher import publish_one_blogger_post

          article_id = "b03853ae39174e3f"
          old_url = "https://jobs.inwi.ma/jobs/8463145-technical-lead-servicenow"
          direct_url = old_url + "/applications/new"

          path = Path("jobs_article_queue.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          article = next((a for a in data.get("articles", []) if a.get("id") == article_id), None)
          if not article:
              raise SystemExit("Target article missing.")

          article["job_application_url"] = direct_url
          article["job_application_link_kind"] = "direct_apply"
          article["job_action_links"] = [{
              "url": direct_url,
              "label": "التقديم المباشر",
              "kind": "apply",
              "context": "Téléchargement du formulaire de candidature",
          }]
          package = article.get("ai_input_package") or {}
          article["ai_input_package"] = package
          package["job_application_url"] = direct_url
          package["job_application_link_kind"] = "direct_apply"
          package["job_action_links"] = list(article["job_action_links"])

          for field in ("final_html","blogger_article_html"):
              html = article.get(field) or ""
              if not html:
                  continue
              soup = BeautifulSoup(html, "html.parser")
              changed = False
              for link in soup.find_all("a", href=True):
                  if link.get("href") == old_url:
                      link["href"] = direct_url
                      link.string = "التقديم المباشر"
                      changed = True
              if changed:
                  article[field] = str(soup)

          if direct_url not in article.get("final_html",""):
              raise SystemExit("Direct application URL was not inserted into final HTML.")
          if old_url in [
              str(link.get("href"))
              for link in BeautifulSoup(article.get("final_html",""), "html.parser").find_all("a", href=True)
          ]:
              raise SystemExit("Old generic job-page link is still used as application CTA.")

          article["final_content_hash"] = content_hash_from_html(article.get("final_html",""))
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2)+"\n", encoding="utf-8")

          result = publish_one_blogger_post(target_article_id=article_id, mode="live")
          print(json.dumps({
              "updated_existing": result.get("updated_existing"),
              "created_new": result.get("created_new"),
              "error": result.get("error"),
              "blogger_url": (result.get("article") or {}).get("blogger_post_url"),
          }, ensure_ascii=False, indent=2))
          if not result.get("updated_existing"):
              raise SystemExit("E2E STOP: same Blogger post was not updated safely.")
          if result.get("created_new"):
              raise SystemExit("E2E STOP: duplicate Blogger post was created.")
          PY

      - name: Persist corrected article state
        run: |
          set -euo pipefail
          rm -f .env client_secret.json data/token.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f jobs_article_queue.json data/internal_link_cache.json data/job_memory 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No state diff to persist."
          else
            git commit -m "Persist direct Jobs application link fix [skip ci]"
            git push origin HEAD:main
          fi
