name: One-shot Jobs E2E Publish Test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/jobs-e2e-one-shot.yml"

concurrency:
  group: jobs-e2e-one-shot
  cancel-in-progress: false

jobs:
  e2e:
    if: contains(github.event.head_commit.message, '[jobs-e2e-run]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create test runtime
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_SECRET_JSON: ${{ secrets.BLOGGER_CLIENT_SECRET_JSON }}
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys
          from pathlib import Path

          required = (
              "BLOGGER_BLOG_ID",
              "BLOGGER_CLIENT_SECRET_JSON",
              "BLOGGER_TOKEN_JSON",
              "FACEBOOK_PAGE_ID",
              "FACEBOOK_PAGE_ACCESS_TOKEN",
          )
          missing = [name for name in required if not os.environ.get(name, "").strip()]
          if not any(os.environ.get(name, "").strip() for name in ("GEMINI_API_KEY", "OPENROUTER_API_KEY")):
              missing.append("GEMINI_API_KEY or OPENROUTER_API_KEY")
          if missing:
              raise SystemExit("Missing required secret(s): " + ", ".join(missing))

          for name in ("BLOGGER_CLIENT_SECRET_JSON", "BLOGGER_TOKEN_JSON"):
              json.loads(os.environ[name])

          Path("data").mkdir(exist_ok=True)
          Path("client_secret.json").write_text(os.environ["BLOGGER_CLIENT_SECRET_JSON"], encoding="utf-8")
          Path("data/token.json").write_text(os.environ["BLOGGER_TOKEN_JSON"], encoding="utf-8")

          env = {
              "JOBS_MODE": "true",
              "JOBS_TEST_MODE": "true",
              "JOBS_EXPECTED_BLOG_HOST": "cyberopluss.blogspot.com",
              "JOBS_TIMEZONE": "Africa/Casablanca",
              "JOBS_MIN_SELECTION_SCORE": "65",
              "JOBS_QUEUE_SCORE": "50",
              "GEMINI_API_KEY": os.environ.get("GEMINI_API_KEY", ""),
              "GEMINI_MODEL": "gemini-2.5-flash",
              "OPENROUTER_API_KEY": os.environ.get("OPENROUTER_API_KEY", ""),
              "OPENROUTER_MODEL": "qwen/qwen3.8-27b:free",
              "OPENROUTER_MODELS": "qwen/qwen3.8-27b:free,openrouter/free",
              "OPENROUTER_APP_NAME": "Cybero Plus Jobs E2E",
              "BLOG_ID": os.environ["BLOGGER_BLOG_ID"],
              "PUBLISH_MODE": "live",
              "SAFE_MODE": "false",
              "BLOGGER_LIVE_ENABLED": "true",
              "FACEBOOK_AUTO_POST": "true",
              "FACEBOOK_LINK_MODE": "comment",
              "FACEBOOK_PAGE_ID": os.environ["FACEBOOK_PAGE_ID"],
              "FACEBOOK_PAGE_ACCESS_TOKEN": os.environ["FACEBOOK_PAGE_ACCESS_TOKEN"],
              "FAST_NEWS_MODE": "false",
              "CATEGORY_ROTATION_MODE": "false",
              "PROCESS_FULL_CATEGORY_PER_RUN": "false",
              "FRESH_QUEUE_MODE": "false",
              "FIRST_VALID_ARTICLE_MODE": "false",
              "RECENT_NEWS_ONLY": "false",
              "RECENT_ONLY": "false",
              "ALLOW_UNKNOWN_DATE_IN_FAST_MODE": "true",
              "MAX_POSTS_PER_RUN": "1",
              "MAX_ARTICLES_PER_RUN": "1",
              "SAFE_CYCLE_MAX_ARTICLES": "1",
              "SAFE_CYCLE_DRAFT_ONLY": "false",
              "MAX_SOURCES_PER_RUN": "20",
              "PUBLISH_WEAK_ARTICLES": "true",
              "ALLOW_SHORT_ARTICLES": "true",
              "MIN_ARTICLE_WORDS": "100",
              "TARGET_ARTICLE_WORDS": "120-220",
              "MIN_EXTRACTED_CHARS": "80",
              "MAX_SOURCE_RETRIES": "0",
              "SOURCE_RETRY_DELAY_SECONDS": "0",
              "SOURCE_TIMEOUT_SECONDS": "6",
              "ARTICLE_TIMEOUT_SECONDS": "8",
              "AI_TOTAL_TIME_BUDGET_SECONDS": "180",
              "GEMINI_TIMEOUT_SECONDS": "50",
              "AI_MODEL_TIMEOUT_SECONDS": "45",
              "OPENROUTER_TIMEOUT_SECONDS": "45",
              "MAX_AI_RETRIES": "3",
              "DUPLICATE_PROTECTION": "true",
              "QUEUE_PERSIST": "true",
              "SOURCE_HEALTH_ENABLED": "true",
              "ENABLE_SCRAPLING_FALLBACK": "false",
              "MAX_DRAFTS_PER_DAY": "3",
              "MIN_MINUTES_BETWEEN_DRAFTS": "0",
              "MAX_LIVE_POSTS_PER_DAY": "3",
              "TARGET_LIVE_POSTS_PER_DAY": "3",
              "MIN_MINUTES_BETWEEN_LIVE_POSTS": "0",
              "MAX_FACEBOOK_POSTS_PER_DAY": "5",
              "MIN_MINUTES_BETWEEN_FACEBOOK_POSTS": "0",
              "AI_PROVIDER": "auto",
              "LOCAL_PUBLISH_FALLBACK": "false",
              "TELEGRAM_ALERTS_ENABLED": "false",
              "TELEGRAM_ENABLED": "false",
          }
          Path(".env").write_text("\n".join(f"{k}={v}" for k,v in env.items()) + "\n", encoding="utf-8")
          print("E2E target: Blogger test + real Facebook Page")
          PY

      - name: Fetch, understand and publish one job to Blogger
        run: |
          set -euo pipefail
          python main.py queue-maintenance
          python main.py auto-cycle

      - name: Verify Blogger result and select E2E article
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import requests
          from article_queue import load_article_queue

          queue = load_article_queue()
          candidates = [
              a for a in queue.get("articles", [])
              if a.get("publish_status") == "published"
              and a.get("blogger_post_url")
          ]
          if not candidates:
              raise SystemExit("E2E STOP: no successful live Blogger publish found.")

          def key(a):
              return str(
                  a.get("published_at")
                  or a.get("blogger_published_at")
                  or a.get("ai_processed_at")
                  or a.get("updated_at")
                  or ""
              )
          article = sorted(candidates, key=key)[-1]
          article_id = str(article.get("id") or "").strip()
          if not article_id:
              raise SystemExit("E2E STOP: published article has no queue id.")

          url = str(article.get("blogger_post_url") or "")
          if "cyberopluss.blogspot.com" not in url:
              raise SystemExit("E2E STOP: Blogger safety host mismatch.")

          response = requests.get(url, timeout=20)
          if response.status_code >= 400:
              raise SystemExit(f"E2E STOP: Blogger URL returned HTTP {response.status_code}.")

          if not article.get("seo_title"):
              raise SystemExit("E2E STOP: missing reader-facing SEO title.")
          if not article.get("main_image"):
              raise SystemExit("E2E STOP: missing generated article cover.")
          if len(article.get("article_images") or []) != 1:
              raise SystemExit("E2E STOP: article does not have exactly one generated cover.")

          Path("data/e2e_article_id.txt").write_text(article_id, encoding="utf-8")
          print(json.dumps({
              "id": article_id,
              "title": article.get("seo_title"),
              "job_title": article.get("job_title"),
              "company": article.get("job_company"),
              "deadline": article.get("job_deadline_display") or article.get("job_deadline"),
              "notice_type": article.get("job_notice_type"),
              "blogger_url": url,
              "cover": article.get("main_image"),
          }, ensure_ascii=False, indent=2))
          PY

      - name: Publish same article to Facebook and first comment
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from article_queue import load_article_queue
          from facebook_publisher import post_one_article_to_facebook

          article_id = Path("data/e2e_article_id.txt").read_text(encoding="utf-8").strip()
          queue = load_article_queue()
          article = next((a for a in queue.get("articles", []) if str(a.get("id")) == article_id), None)
          if not article:
              raise SystemExit("E2E STOP: published Blogger article disappeared from queue.")

          if article.get("facebook_post_id") and article.get("facebook_comment_id"):
              result = {
                  "posted": True,
                  "comment_posted": True,
                  "image_posted": article.get("facebook_image_status") == "posted",
                  "article": article,
                  "error": "",
              }
          else:
              result = post_one_article_to_facebook(
                  target_article_id=article_id,
                  respect_limits=False,
              )

          out = result.get("article") or article
          print(json.dumps({
              "posted": result.get("posted"),
              "comment_posted": result.get("comment_posted"),
              "image_posted": result.get("image_posted"),
              "facebook_post_id": out.get("facebook_post_id"),
              "facebook_comment_id": out.get("facebook_comment_id"),
              "facebook_status": out.get("facebook_status"),
              "error": result.get("error"),
          }, ensure_ascii=False, indent=2))

          if not result.get("posted"):
              raise SystemExit("E2E STOP: Facebook post failed.")
          if not result.get("image_posted"):
              raise SystemExit("E2E STOP: Facebook image did not publish.")
          if not result.get("comment_posted"):
              raise SystemExit("E2E STOP: Facebook first comment failed.")
          PY

      - name: Persist successful E2E state
        if: success()
        run: |
          set -euo pipefail
          rm -f .env client_secret.json data/token.json data/e2e_article_id.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f jobs_article_queue.json data/job_state.json data/job_memory data/crawl_state.json data/ai_provider_memory.json data/facebook_style_memory.json data/internal_link_cache.json data/source_health.json logs/auto_cycle_runs.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No E2E runtime state changes to commit."
          else
            git commit -m "Persist successful Jobs E2E state [skip ci]"
            git push origin HEAD:main
          fi
