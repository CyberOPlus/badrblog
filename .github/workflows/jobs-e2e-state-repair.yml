name: One-shot Jobs E2E State Repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/jobs-e2e-state-repair.yml"

jobs:
  repair:
    if: contains(github.event.head_commit.message, '[jobs-e2e-state-repair]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install diagnostic dependencies
        run: pip install requests beautifulsoup4

      - name: Repair persisted Facebook state and inspect inwi candidature link
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          queue_path = Path("jobs_article_queue.json")
          data = json.loads(queue_path.read_text(encoding="utf-8"))
          article = next((a for a in data.get("articles", []) if a.get("id") == "b03853ae39174e3f"), None)
          if not article:
              raise SystemExit("Target E2E article is missing.")

          page_id = os.environ.get("FACEBOOK_PAGE_ID", "").strip()
          if not page_id:
              raise SystemExit("FACEBOOK_PAGE_ID secret is missing.")

          article["facebook_status"] = "posted"
          article["facebook_post_id"] = f"{page_id}_1081839974211067"
          article["facebook_comment_id"] = "1081839974211067_1110532461529187"
          article["facebook_posted_at"] = "2026-09-28T19:20:39"
          article["facebook_post_type"] = "photo"
          article["facebook_image_status"] = "posted"
          article["facebook_caption_pattern"] = "jobs"
          article["facebook_style_used"] = "jobs"
          article["facebook_structure_used"] = "jobs_vacancy"
          article["facebook_hashtags_count"] = 3
          article.pop("facebook_error", None)
          data["updated_at"] = "2026-09-28T19:20:39"
          queue_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          url = "https://jobs.inwi.ma/jobs/8463145-technical-lead-servicenow"
          response = requests.get(url, timeout=20, headers={"User-Agent":"Mozilla/5.0"})
          print("SOURCE_HTTP", response.status_code)
          soup = BeautifulSoup(response.text, "html.parser")
          matches = []
          for a in soup.find_all("a", href=True):
              label = " ".join(a.get_text(" ", strip=True).split())
              href = a.get("href","")
              sig = f"{label} {href}".casefold()
              if any(x in sig for x in ("candidature","postuler","apply","formulaire","download","telecharg","télécharg")):
                  matches.append({"tag":"a","label":label,"href":href})
          for form in soup.find_all("form"):
              action = form.get("action","")
              text = " ".join(form.get_text(" ", strip=True).split())
              sig=f"{action} {text}".casefold()
              if any(x in sig for x in ("candidature","postuler","apply","formulaire")):
                  matches.append({"tag":"form","label":text[:200],"href":action})
          print("CANDIDATURE_MATCHES")
          print(json.dumps(matches[:30], ensure_ascii=False, indent=2))

          raw = response.text
          for term in ("Téléchargement du formulaire de candidature","formulaire de candidature","candidature"):
              idx = raw.casefold().find(term.casefold())
              if idx >= 0:
                  snippet = re.sub(r"\s+"," ",raw[max(0,idx-600):idx+1200])
                  print("RAW_CONTEXT", term, snippet)
                  break
          PY

      - name: Commit repaired runtime state
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f jobs_article_queue.json
          git commit -m "Repair Facebook state after Jobs E2E test [skip ci]"
          git push origin HEAD:main
