name: Jobs Live Review

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/jobs-live-review.yml"

concurrency:
  group: jobs-live-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TARGET_JOB_ID: "b5d1a2b4e028ddf0"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Prepare production credentials
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_SECRET_JSON: ${{ secrets.BLOGGER_CLIENT_SECRET_JSON }}
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          required = (
              "BLOGGER_BLOG_ID",
              "BLOGGER_CLIENT_SECRET_JSON",
              "BLOGGER_TOKEN_JSON",
              "FACEBOOK_PAGE_ID",
              "FACEBOOK_PAGE_ACCESS_TOKEN",
          )
          missing = [name for name in required if not os.environ.get(name, "").strip()]
          if missing:
              raise SystemExit("Missing required secret(s): " + ", ".join(missing))

          for name in ("BLOGGER_CLIENT_SECRET_JSON", "BLOGGER_TOKEN_JSON"):
              json.loads(os.environ[name])

          Path("data").mkdir(exist_ok=True)
          Path("client_secret.json").write_text(
              os.environ["BLOGGER_CLIENT_SECRET_JSON"], encoding="utf-8"
          )
          Path("data/token.json").write_text(
              os.environ["BLOGGER_TOKEN_JSON"], encoding="utf-8"
          )

          env = {
              "JOBS_MODE": "true",
              "JOBS_TEST_MODE": "false",
              "JOBS_TIMEZONE": "Africa/Casablanca",
              "JOBS_EXPECTED_BLOG_HOST": "example.invalid",
              "JOBS_MIN_SELECTION_SCORE": "65",
              "JOBS_QUEUE_SCORE": "50",
              "JOBS_FACEBOOK_MIN_SCORE": "65",
              "GEMINI_API_KEY": os.environ.get("GEMINI_API_KEY", ""),
              "GEMINI_MODEL": "gemini-2.5-flash",
              "OPENROUTER_API_KEY": os.environ.get("OPENROUTER_API_KEY", ""),
              "OPENROUTER_MODEL": "qwen/qwen3.8-27b:free",
              "OPENROUTER_MODELS": "qwen/qwen3.8-27b:free,openrouter/free",
              "GROQ_API_KEY": os.environ.get("GROQ_API_KEY", ""),
              "GROQ_MODEL": "llama-3.1-8b-instant",
              "MISTRAL_API_KEY": os.environ.get("MISTRAL_API_KEY", ""),
              "MISTRAL_MODEL": "mistral-small-latest",
              "CLOUDFLARE_API_TOKEN": os.environ.get("CLOUDFLARE_API_TOKEN", ""),
              "CLOUDFLARE_ACCOUNT_ID": os.environ.get("CLOUDFLARE_ACCOUNT_ID", ""),
              "CLOUDFLARE_MODEL": "@cf/meta/llama-3.1-8b-instruct",
              "AI_PROVIDER": "auto",
              "AI_TOTAL_TIME_BUDGET_SECONDS": "180",
              "MAX_AI_RETRIES": "6",
              "BLOG_ID": os.environ["BLOGGER_BLOG_ID"],
              "PUBLISH_MODE": "live",
              "SAFE_MODE": "false",
              "BLOGGER_LIVE_ENABLED": "true",
              "FACEBOOK_AUTO_POST": "true",
              "FACEBOOK_PAGE_ID": os.environ["FACEBOOK_PAGE_ID"],
              "FACEBOOK_PAGE_ACCESS_TOKEN": os.environ["FACEBOOK_PAGE_ACCESS_TOKEN"],
              "META_GRAPH_API_VERSION": "v26.0",
              "FACEBOOK_LINK_MODE": "comment",
              "WHATSAPP_CHANNEL_URL": "https://whatsapp.com/channel/0029Vb7MdMfBVJl1kmmV4T0e",
              "DUPLICATE_PROTECTION": "true",
              "QUEUE_PERSIST": "true",
              "MIN_ARTICLE_WORDS": "100",
              "TARGET_ARTICLE_WORDS": "120-220",
              "LOCAL_PUBLISH_FALLBACK": "false",
          }
          Path(".env").write_text(
              "\n".join(f"{k}={v}" for k, v in env.items()) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Publish one review article and Facebook post
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          from article_queue import load_article_queue, save_article_queue
          from article_processor import prepare_selected_articles_for_ai
          from article_ai_processor import process_one_selected_article_with_ai
          from article_draft_publisher import publish_one_blogger_post
          import facebook_publisher as facebook

          target = os.environ["TARGET_JOB_ID"]
          queue = load_article_queue()
          article = next((row for row in queue.get("articles", []) if row.get("id") == target), None)
          if not article:
              raise SystemExit("Target job not found in queue.")
          if article.get("blogger_post_url"):
              raise SystemExit("Target job was already published; refusing duplicate live test.")

          article["status"] = "selected"
          article["selected_at"] = datetime.now(timezone.utc).isoformat()
          article["suggested_category"] = "jobs-morocco"
          article["manual_review_publish"] = True
          article.pop("publish_block_reason", None)
          save_article_queue(queue)

          prep = prepare_selected_articles_for_ai(target_article_id=target)
          if int(prep.get("ready_for_ai") or 0) < 1:
              raise SystemExit("Prepare-AI failed for target.")

          ai = process_one_selected_article_with_ai(force=True, target_article_id=target)
          if int(ai.get("success") or 0) != 1:
              raise SystemExit("AI/deterministic article generation failed.")

          publish = publish_one_blogger_post(target_article_id=target, mode="live")
          queue = load_article_queue()
          article = next(row for row in queue.get("articles", []) if row.get("id") == target)
          blogger_url = str(article.get("blogger_post_url") or "").strip()
          if article.get("publish_status") != "published" or not blogger_url:
              raise SystemExit("Blogger live publish failed.")

          # One-off review exception only. Production config remains 75 and keeps its normal schedule.
          facebook.JOBS_FACEBOOK_MIN_SCORE = 65
          social = facebook.post_one_article_to_facebook(
              target_article_id=target,
              respect_limits=False,
          )

          queue = load_article_queue()
          article = next(row for row in queue.get("articles", []) if row.get("id") == target)
          result = {
              "id": target,
              "title": article.get("seo_title"),
              "description": article.get("seo_description"),
              "slug": article.get("seo_slug"),
              "word_count": article.get("final_word_count"),
              "ai_provider": article.get("ai_provider_used"),
              "ai_quality_status": article.get("ai_quality_status"),
              "blogger_url": article.get("blogger_post_url"),
              "blogger_post_id": article.get("blogger_post_id"),
              "article_cover_url": article.get("job_article_cover_url") or article.get("main_image"),
              "article_logo_used": article.get("article_logo_used"),
              "facebook_posted": bool(social.get("posted")),
              "facebook_status": article.get("facebook_status"),
              "facebook_post_id": article.get("facebook_post_id"),
              "facebook_comment_id": article.get("facebook_comment_id"),
              "facebook_image_status": article.get("facebook_image_status"),
              "facebook_image_url": article.get("facebook_image_url"),
              "facebook_caption": article.get("facebook_post_text"),
              "html_length": len(article.get("final_html") or ""),
              "html": article.get("final_html"),
          }
          print("LIVE_REVIEW_RESULT_BEGIN")
          print(json.dumps(result, ensure_ascii=False, indent=2))
          print("LIVE_REVIEW_RESULT_END")

          if not social.get("posted"):
              raise SystemExit("Facebook live review post failed: " + str(social.get("error") or "unknown"))
          PY

      - name: Persist review state
        if: always()
        run: |
          rm -f .env client_secret.json data/token.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f jobs_article_queue.json data/job_state.json data/job_memory data/job_visual_state.json data/facebook_style_memory.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No review state changes to persist."
            exit 0
          fi
          git commit -m "Persist one-off Jobs live review state [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main || exit 1
          done
          git push origin HEAD:main
