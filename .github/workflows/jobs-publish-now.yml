name: Jobs Publish Now

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/jobs-publish-now.yml"

concurrency:
  group: jobs-publish-now
  cancel-in-progress: false

jobs:
  publish-facebook:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    env:
      TARGET_JOB_ID: "b69be0cf070c4dd6"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Prepare Facebook production environment
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          required = ("FACEBOOK_PAGE_ID", "FACEBOOK_PAGE_ACCESS_TOKEN")
          missing = [x for x in required if not os.environ.get(x, "").strip()]
          if missing:
              raise SystemExit("Missing required secret(s): " + ", ".join(missing))
          env = {
              "JOBS_MODE": "true",
              "JOBS_TIMEZONE": "Africa/Casablanca",
              "JOBS_FACEBOOK_MIN_SCORE": "65",
              "FACEBOOK_AUTO_POST": "true",
              "FACEBOOK_PAGE_ID": os.environ["FACEBOOK_PAGE_ID"],
              "FACEBOOK_PAGE_ACCESS_TOKEN": os.environ["FACEBOOK_PAGE_ACCESS_TOKEN"],
              "META_GRAPH_API_VERSION": "v26.0",
              "FACEBOOK_LINK_MODE": "comment",
              "MAX_FACEBOOK_POSTS_PER_DAY": "2",
              "FACEBOOK_HARD_MAX_POSTS_PER_DAY": "3",
              "MIN_MINUTES_BETWEEN_FACEBOOK_POSTS": "45",
              "FACEBOOK_SAFETY_MIN_INTERVAL_MINUTES": "45",
          }
          Path(".env").write_text(
              "\n".join(f"{k}={v}" for k, v in env.items()) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Publish Facebook now if hard safety permits
        run: |
          python - <<'PY'
          import json, os
          import facebook_publisher as fb
          from article_queue import load_article_queue

          target = os.environ["TARGET_JOB_ID"]
          queue = load_article_queue()
          article = next((x for x in queue.get("articles", []) if x.get("id") == target), None)
          if not article or not article.get("blogger_post_url"):
              raise SystemExit("Target Blogger article is not live.")
          if article.get("facebook_post_id"):
              print("Already posted to Facebook; nothing to do.")
              raise SystemExit(0)

          limits = fb.get_facebook_limits_status(urgent=False)
          hard_reasons = [
              r for r in (limits.get("reasons") or [])
              if r != "waiting for Morocco Facebook publishing slot"
          ]
          if hard_reasons:
              raise SystemExit("Facebook hard safety blocked publish: " + "; ".join(hard_reasons))
          if int(limits.get("facebook_posts_today") or 0) >= int(limits.get("max_facebook_posts_per_day") or 2):
              raise SystemExit("Facebook daily target reached.")
          minutes = limits.get("minutes_since_last_facebook_post")
          if minutes is not None and int(minutes) < 45:
              raise SystemExit("Facebook 45-minute safety interval has not elapsed.")

          result = fb.post_one_article_to_facebook(
              target_article_id=target,
              respect_limits=False,
          )
          if not result.get("posted"):
              raise SystemExit("Facebook publish failed: " + str(result.get("error") or "unknown"))

          queue = load_article_queue()
          article = next(x for x in queue.get("articles", []) if x.get("id") == target)
          print("FACEBOOK_NOW_RESULT_BEGIN")
          print(json.dumps({
              "blogger_url": article.get("blogger_post_url"),
              "facebook_status": article.get("facebook_status"),
              "facebook_post_id": article.get("facebook_post_id"),
              "facebook_comment_id": article.get("facebook_comment_id"),
              "facebook_image_status": article.get("facebook_image_status"),
              "facebook_caption": article.get("facebook_post_text"),
          }, ensure_ascii=False, indent=2))
          print("FACEBOOK_NOW_RESULT_END")
          PY

      - name: Persist Facebook state
        if: always()
        run: |
          rm -f .env
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f jobs_article_queue.json data/job_visual_state.json data/facebook_style_memory.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Persist immediate Facebook Jobs publish [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main || exit 1
          done
          git push origin HEAD:main
