name: Jobs Publish Now

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/jobs-publish-now.yml"

concurrency:
  group: jobs-publish-now
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TARGET_JOB_ID: "b69be0cf070c4dd6"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Prepare production environment
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_SECRET_JSON: ${{ secrets.BLOGGER_CLIENT_SECRET_JSON }}
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          required = (
              "BLOGGER_BLOG_ID",
              "BLOGGER_CLIENT_SECRET_JSON",
              "BLOGGER_TOKEN_JSON",
              "FACEBOOK_PAGE_ID",
              "FACEBOOK_PAGE_ACCESS_TOKEN",
          )
          missing = [x for x in required if not os.environ.get(x, "").strip()]
          if missing:
              raise SystemExit("Missing required secret(s): " + ", ".join(missing))

          json.loads(os.environ["BLOGGER_CLIENT_SECRET_JSON"])
          json.loads(os.environ["BLOGGER_TOKEN_JSON"])

          Path("data").mkdir(exist_ok=True)
          Path("client_secret.json").write_text(os.environ["BLOGGER_CLIENT_SECRET_JSON"], encoding="utf-8")
          Path("data/token.json").write_text(os.environ["BLOGGER_TOKEN_JSON"], encoding="utf-8")

          env = {
              "JOBS_MODE": "true",
              "JOBS_TEST_MODE": "false",
              "JOBS_TIMEZONE": "Africa/Casablanca",
              "JOBS_EXPECTED_BLOG_HOST": "example.invalid",
              "JOBS_MIN_SELECTION_SCORE": "65",
              "JOBS_QUEUE_SCORE": "50",
              "JOBS_FACEBOOK_MIN_SCORE": "65",
              "GEMINI_API_KEY": os.environ.get("GEMINI_API_KEY", ""),
              "GEMINI_MODEL": "gemini-2.5-flash",
              "OPENROUTER_API_KEY": os.environ.get("OPENROUTER_API_KEY", ""),
              "OPENROUTER_MODELS": "qwen/qwen3.8-27b:free,openrouter/free",
              "GROQ_API_KEY": os.environ.get("GROQ_API_KEY", ""),
              "GROQ_MODEL": "llama-3.1-8b-instant",
              "MISTRAL_API_KEY": os.environ.get("MISTRAL_API_KEY", ""),
              "MISTRAL_MODEL": "mistral-small-latest",
              "CLOUDFLARE_API_TOKEN": os.environ.get("CLOUDFLARE_API_TOKEN", ""),
              "CLOUDFLARE_ACCOUNT_ID": os.environ.get("CLOUDFLARE_ACCOUNT_ID", ""),
              "CLOUDFLARE_MODEL": "@cf/meta/llama-3.1-8b-instruct",
              "AI_PROVIDER": "auto",
              "AI_TOTAL_TIME_BUDGET_SECONDS": "180",
              "MAX_AI_RETRIES": "6",
              "BLOG_ID": os.environ["BLOGGER_BLOG_ID"],
              "PUBLISH_MODE": "live",
              "SAFE_MODE": "false",
              "BLOGGER_LIVE_ENABLED": "true",
              "FACEBOOK_AUTO_POST": "true",
              "FACEBOOK_PAGE_ID": os.environ["FACEBOOK_PAGE_ID"],
              "FACEBOOK_PAGE_ACCESS_TOKEN": os.environ["FACEBOOK_PAGE_ACCESS_TOKEN"],
              "META_GRAPH_API_VERSION": "v26.0",
              "FACEBOOK_LINK_MODE": "comment",
              "MAX_FACEBOOK_POSTS_PER_DAY": "2",
              "FACEBOOK_HARD_MAX_POSTS_PER_DAY": "3",
              "FACEBOOK_SAFETY_MIN_INTERVAL_MINUTES": "45",
              "WHATSAPP_CHANNEL_URL": "https://whatsapp.com/channel/0029Vb7MdMfBVJl1kmmV4T0e",
              "DUPLICATE_PROTECTION": "true",
              "QUEUE_PERSIST": "true",
              "MIN_ARTICLE_WORDS": "100",
              "TARGET_ARTICLE_WORDS": "120-220",
              "LOCAL_PUBLISH_FALLBACK": "false",
          }
          Path(".env").write_text(
              "\n".join(f"{k}={v}" for k, v in env.items()) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Publish one verified job now
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          from article_queue import load_article_queue, save_article_queue
          from article_processor import prepare_selected_articles_for_ai
          from article_ai_processor import process_one_selected_article_with_ai
          from article_draft_publisher import publish_one_blogger_post
          import facebook_publisher as facebook
          from job_core import (
              _parse_date,
              load_job_state,
              save_job_state,
              record_job_publish,
          )

          target = os.environ["TARGET_JOB_ID"]
          queue = load_article_queue()
          article = next((x for x in queue.get("articles", []) if x.get("id") == target), None)
          if not article:
              raise SystemExit("Target job not found.")
          if article.get("blogger_post_url"):
              raise SystemExit("Target already published; refusing duplicate.")

          article["status"] = "selected"
          article["selected_at"] = datetime.now(timezone.utc).isoformat()
          article["suggested_category"] = "jobs-morocco"
          article["selection_reason"] = "one-off verified production publish requested by owner"
          article.pop("publish_block_reason", None)
          save_article_queue(queue)

          prep = prepare_selected_articles_for_ai(target_article_id=target)
          if int(prep.get("ready_for_ai") or 0) < 1:
              raise SystemExit("Prepare-AI failed.")

          ai = process_one_selected_article_with_ai(force=True, target_article_id=target)
          if int(ai.get("success") or 0) != 1:
              raise SystemExit("AI/deterministic generation failed.")

          pub = publish_one_blogger_post(target_article_id=target, mode="live")
          queue = load_article_queue()
          article = next(x for x in queue.get("articles", []) if x.get("id") == target)
          if article.get("publish_status") != "published" or not article.get("blogger_post_url"):
              raise SystemExit("Blogger live publish failed: " + str(pub.get("error") or ""))

          record_job_publish(article)

          # This respects the configured daily and 45-minute Facebook safety rails.
          social = facebook.post_one_article_to_facebook(
              target_article_id=target,
              respect_limits=True,
          )
          if not social.get("posted"):
              raise SystemExit("Facebook publish blocked/failed: " + str(social.get("error") or ""))

          # Reconcile today's Blogger counter with all actual live queue records,
          # including earlier manual review publishes, so automation cannot over-post.
          queue = load_article_queue()
          tz = ZoneInfo("Africa/Casablanca")
          today = datetime.now(timezone.utc).astimezone(tz).date()
          live_today = []
          latest = None
          for row in queue.get("articles", []):
              if row.get("publish_status") != "published" or not row.get("blogger_post_url"):
                  continue
              dt = _parse_date(row.get("published_at"))
              if not dt or dt.astimezone(tz).date() != today:
                  continue
              live_today.append(row)
              if latest is None or dt > latest:
                  latest = dt

          state = load_job_state()
          counts = state.setdefault("daily_publish_count", {})
          counts[today.isoformat()] = max(int(counts.get(today.isoformat(), 0)), len(live_today))
          if latest:
              state["last_publish_at"] = latest.isoformat()
          save_job_state(state)

          article = next(x for x in queue.get("articles", []) if x.get("id") == target)
          result = {
              "id": target,
              "title": article.get("seo_title"),
              "description": article.get("seo_description"),
              "slug": article.get("seo_slug"),
              "word_count": article.get("final_word_count"),
              "blogger_url": article.get("blogger_post_url"),
              "article_cover_url": article.get("job_article_cover_url") or article.get("main_image"),
              "article_logo_used": article.get("article_logo_used"),
              "facebook_status": article.get("facebook_status"),
              "facebook_post_id": article.get("facebook_post_id"),
              "facebook_comment_id": article.get("facebook_comment_id"),
              "facebook_image_status": article.get("facebook_image_status"),
              "ai_provider": article.get("ai_provider_used"),
              "actual_blogger_posts_today": len(live_today),
          }
          print("PUBLISH_NOW_RESULT_BEGIN")
          print(json.dumps(result, ensure_ascii=False, indent=2))
          print("PUBLISH_NOW_RESULT_END")
          PY

      - name: Persist production state
        if: always()
        run: |
          rm -f .env client_secret.json data/token.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          STATE_PATHS=(
            "jobs_article_queue.json"
            "data/job_state.json"
            "data/job_memory"
            "data/job_visual_state.json"
            "data/ai_provider_memory.json"
            "data/facebook_style_memory.json"
            "data/internal_link_cache.json"
          )
          for p in "${STATE_PATHS[@]}"; do
            if [ -e "$p" ]; then git add -f "$p"; fi
          done
          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi
          git commit -m "Persist immediate verified Jobs publish [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main || exit 1
          done
          git push origin HEAD:main
