name: Jobs Storage Access Check
on:
  push:
    branches: [jobs-reliability-final-20260929]
    paths: [".github/workflows/jobs-storage-probe.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require Cloudflare storage credentials
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CF_ACCOUNT" && test -n "$CF_TOKEN"

      - name: Verify D1 read access
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          account = os.environ["CF_ACCOUNT"]
          token = os.environ["CF_TOKEN"]
          req = urllib.request.Request(
              "https://api.cloudflare.com/client/v4/accounts/" + account + "/d1/database?per_page=1",
              headers={"Authorization": "Bearer " + token},
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              data = json.load(response)
          if not data.get("success"):
              raise SystemExit(1)
          print("D1 read access verified.")
          PY
