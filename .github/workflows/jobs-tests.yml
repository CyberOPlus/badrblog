name: Jobs Core Tests

on:
  workflow_dispatch:
  push:
    paths:
      - "**.py"
      - "sources.json"
      - "requirements.txt"
      - "assets/facebook/**"
      - "assets/article/**"
      - ".github/workflows/jobs-tests.yml"
      - ".github/workflows/auto-cycle.yml"
      - ".github/workflows/jobs-watchdog.yml"

concurrency:
  # Keep only the newest CI for a branch. This prevents rapid iterative pushes
  # from filling the runner queue and delaying production schedule/watchdog jobs.
  group: jobs-core-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Verify the complete Jobs suite
        run: python -m unittest discover -s tests -v
      - name: Compile all tracked Python modules
        run: |
          git ls-files -z '*.py' | xargs -0 python -m py_compile
