name: Cybero Plus Jobs Tests

on:
  workflow_dispatch:
  push:
    paths:
      - "cyberoplus_jobs_bot/**"
      - ".github/workflows/jobs-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r cyberoplus_jobs_bot/requirements.txt
      - run: python -m unittest cyberoplus_jobs_bot.tests.test_identity -v
