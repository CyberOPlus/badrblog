name: Jobs Core Tests

on:
  workflow_dispatch:
  push:
    paths:
      - "job_core.py"
      - "job_extractor.py"
      - "jobposting.py"
      - "main.py"
      - "tests/test_jobs_core.py"
      - ".github/workflows/jobs-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest tests.test_jobs_core -v
