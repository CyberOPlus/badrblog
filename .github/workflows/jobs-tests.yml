name: Jobs Core Tests

on:
  workflow_dispatch:
  push:
    paths:
      - "job_core.py"
      - "scraper.py"
      - "config.py"
      - "sources.json"
      - "job_extractor.py"
      - "jobposting.py"
      - "article_enricher.py"
      - "article_processor.py"
      - "article_ai_processor.py"
      - "article_draft_publisher.py"
      - "quality_gate.py"
      - "main.py"
      - "tests/test_jobs_core.py"
      - "tests/test_job_visuals.py"
      - "utils/facebook_image_generator.py"
      - "requirements.txt"
      - "assets/facebook/**"
      - "assets/article/**"
      - ".github/workflows/jobs-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest tests.test_jobs_core tests.test_job_visuals -v
      - name: Compile critical Jobs modules
        run: |
          python -m py_compile             main.py             scraper.py             article_enricher.py             article_ai_processor.py             article_draft_publisher.py             facebook_publisher.py             config.py             tests/test_production_hardening.py
