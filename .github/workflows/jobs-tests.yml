name: Jobs Core Tests

on:
  workflow_dispatch:
  push:
    paths:
      - "job_core.py"
      - "company_logo_resolver.py"
      - "jobs_adaptive_controller.py"
      - "job_visual_policy.py"
      - "scraper.py"
      - "config.py"
      - "sources.json"
      - "job_extractor.py"
      - "jobposting.py"
      - "article_enricher.py"
      - "article_queue.py"
      - "article_processor.py"
      - "article_ai_processor.py"
      - "article_draft_publisher.py"
      - "quality_gate.py"
      - "main.py"
      - "facebook_publisher.py"
      - "tests/test_jobs_runtime.py"
      - "tests/test_jobs_core.py"
      - "tests/test_job_visuals.py"
      - "tests/test_production_hardening.py"
      - "utils/facebook_image_generator.py"
      - "requirements.txt"
      - "assets/facebook/**"
      - "assets/article/**"
      - ".github/workflows/jobs-tests.yml"
      - ".github/workflows/jobs-watchdog.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest tests.test_jobs_core tests.test_job_visuals tests.test_jobs_runtime -v
      - name: Verify Facebook production guardrails
        run: |
          python -m unittest \
            tests.test_production_hardening.ProductionHardeningTests.test_workflow_cron_and_facebook_safety_are_current \
            tests.test_production_hardening.ProductionHardeningTests.test_facebook_after_blogger_success_still_respects_limits \
            tests.test_production_hardening.ProductionHardeningTests.test_facebook_safety_interval_cannot_be_disabled_by_zero_env_value -v
      - name: Compile critical Jobs modules
        run: |
          python -m py_compile             main.py             jobs_adaptive_controller.py             scraper.py             article_enricher.py             article_ai_processor.py             article_draft_publisher.py             facebook_publisher.py             job_visual_policy.py             config.py             tests/test_production_hardening.py
