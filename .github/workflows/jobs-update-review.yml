name: Jobs Update Review

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/jobs-update-review.yml"

concurrency:
  group: jobs-update-review
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TARGET_JOB_ID: "b5d1a2b4e028ddf0"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Prepare production credentials
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_SECRET_JSON: ${{ secrets.BLOGGER_CLIENT_SECRET_JSON }}
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          required = ("BLOGGER_BLOG_ID","BLOGGER_CLIENT_SECRET_JSON","BLOGGER_TOKEN_JSON")
          missing = [name for name in required if not os.environ.get(name, "").strip()]
          if missing:
              raise SystemExit("Missing required secret(s): " + ", ".join(missing))
          for name in ("BLOGGER_CLIENT_SECRET_JSON","BLOGGER_TOKEN_JSON"):
              json.loads(os.environ[name])

          Path("data").mkdir(exist_ok=True)
          Path("client_secret.json").write_text(os.environ["BLOGGER_CLIENT_SECRET_JSON"], encoding="utf-8")
          Path("data/token.json").write_text(os.environ["BLOGGER_TOKEN_JSON"], encoding="utf-8")

          env = {
              "JOBS_MODE":"true",
              "JOBS_TEST_MODE":"false",
              "JOBS_TIMEZONE":"Africa/Casablanca",
              "JOBS_EXPECTED_BLOG_HOST":"example.invalid",
              "JOBS_MIN_SELECTION_SCORE":"65",
              "GEMINI_API_KEY":os.environ.get("GEMINI_API_KEY",""),
              "GEMINI_MODEL":"gemini-2.5-flash",
              "OPENROUTER_API_KEY":os.environ.get("OPENROUTER_API_KEY",""),
              "OPENROUTER_MODEL":"qwen/qwen3.8-27b:free",
              "OPENROUTER_MODELS":"qwen/qwen3.8-27b:free,openrouter/free",
              "GROQ_API_KEY":os.environ.get("GROQ_API_KEY",""),
              "GROQ_MODEL":"llama-3.1-8b-instant",
              "MISTRAL_API_KEY":os.environ.get("MISTRAL_API_KEY",""),
              "MISTRAL_MODEL":"mistral-small-latest",
              "CLOUDFLARE_API_TOKEN":os.environ.get("CLOUDFLARE_API_TOKEN",""),
              "CLOUDFLARE_ACCOUNT_ID":os.environ.get("CLOUDFLARE_ACCOUNT_ID",""),
              "CLOUDFLARE_MODEL":"@cf/meta/llama-3.1-8b-instruct",
              "AI_PROVIDER":"auto",
              "AI_TOTAL_TIME_BUDGET_SECONDS":"180",
              "MAX_AI_RETRIES":"6",
              "BLOG_ID":os.environ["BLOGGER_BLOG_ID"],
              "PUBLISH_MODE":"live",
              "SAFE_MODE":"false",
              "BLOGGER_LIVE_ENABLED":"true",
              "FACEBOOK_AUTO_POST":"false",
              "DUPLICATE_PROTECTION":"true",
              "QUEUE_PERSIST":"true",
              "MIN_ARTICLE_WORDS":"100",
              "TARGET_ARTICLE_WORDS":"140-320",
              "LOCAL_PUBLISH_FALLBACK":"false",
          }
          Path(".env").write_text("\n".join(f"{k}={v}" for k,v in env.items())+"\n", encoding="utf-8")
          PY

      - name: Regenerate and update the existing Blogger article
        run: |
          python - <<'PY'
          import json, os, re
          from datetime import datetime, timezone

          from article_queue import load_article_queue, save_article_queue
          from article_processor import prepare_selected_articles_for_ai
          from article_ai_processor import process_one_selected_article_with_ai
          from article_draft_publisher import publish_one_blogger_post

          target=os.environ["TARGET_JOB_ID"]
          queue=load_article_queue()
          article=next((x for x in queue.get("articles",[]) if x.get("id")==target),None)
          if not article:
              raise SystemExit("Target job missing.")
          original_post_id=str(article.get("blogger_post_id") or "")
          original_url=str(article.get("blogger_post_url") or "")
          if not original_post_id or not original_url:
              raise SystemExit("Target must already be a live Blogger post.")

          article["status"]="selected"
          article["selected_at"]=datetime.now(timezone.utc).isoformat()
          article["suggested_category"]="jobs-morocco"
          article.pop("publish_block_reason",None)
          article.pop("publish_blocked_reason",None)
          article.pop("publish_error",None)
          save_article_queue(queue)

          prep=prepare_selected_articles_for_ai(target_article_id=target)
          if int(prep.get("ready_for_ai") or 0)<1:
              raise SystemExit("Prepare-AI failed.")

          ai=process_one_selected_article_with_ai(force=True,target_article_id=target)
          if int(ai.get("success") or 0)!=1:
              raise SystemExit("Article regeneration failed.")

          result=publish_one_blogger_post(target_article_id=target,mode="live")
          queue=load_article_queue()
          article=next(x for x in queue.get("articles",[]) if x.get("id")==target)
          html=str(article.get("final_html") or "")
          if article.get("publish_status")!="published":
              raise SystemExit("Blogger update failed: "+str(result.get("error") or "unknown"))
          if str(article.get("blogger_post_id") or "")!=original_post_id:
              raise SystemExit("Unexpected Blogger post ID change.")
          if re.search(r"<script\b",html,re.I):
              raise SystemExit("Script remained in updated Jobs HTML.")

          payload={
              "id":target,
              "title":article.get("seo_title"),
              "description":article.get("seo_description"),
              "slug":article.get("seo_slug"),
              "word_count":article.get("final_word_count"),
              "provider":article.get("ai_provider_used"),
              "quality":article.get("ai_quality_status"),
              "blogger_url":article.get("blogger_post_url"),
              "blogger_post_id":article.get("blogger_post_id"),
              "article_logo_used":article.get("article_logo_used"),
              "document_links":article.get("job_document_links") or [],
              "application_url":article.get("job_application_url"),
              "has_script":bool(re.search(r"<script\b",html,re.I)),
              "html":html,
          }
          print("UPDATED_REVIEW_BEGIN")
          print(json.dumps(payload,ensure_ascii=False,indent=2))
          print("UPDATED_REVIEW_END")
          PY

      - name: Persist updated review state
        if: always()
        run: |
          rm -f .env client_secret.json data/token.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f jobs_article_queue.json data/job_state.json data/job_memory data/job_visual_state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Persist updated Jobs review article [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main || exit 1
          done
          git push origin HEAD:main
