name: Jobs v2 Preview

on:
  workflow_dispatch:
    inputs:
      candidate_file:
        description: "Candidate JSON path"
        required: true
        default: "jobs_bot_v2/data/sample_candidate.json"

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests beautifulsoup4

      - name: Generate preview only
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          JOBS_LIVE_PUBLISH: "false"
          JOBS_LIVE_FACEBOOK: "false"
        run: |
          python -m jobs_bot_v2.pipeline --candidate-json "${{ github.event.inputs.candidate_file }}"
