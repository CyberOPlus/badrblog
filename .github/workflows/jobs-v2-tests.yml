name: Jobs v2 Unit Tests

on:
  workflow_dispatch:
  push:
    paths:
      - "jobs_bot_v2/**"
      - "tests/test_jobs_v2_*.py"
      - ".github/workflows/jobs-v2-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests beautifulsoup4 Pillow arabic-reshaper python-bidi
      - run: python -m unittest tests.test_jobs_v2_identity -v
