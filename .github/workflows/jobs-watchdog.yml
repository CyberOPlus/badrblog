name: Jobs Watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_run:
    workflows: ["Jobs Auto Cycle"]
    types: [completed]
    branches: [main]

permissions:
  actions: write
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Pace completion chain
        if: github.event_name == 'workflow_run'
        run: sleep 120

      - name: Ensure auto-cycle is alive
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const workflow_id = "auto-cycle.yml";
            const response = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id,
              branch: "main",
              per_page: 10,
            });
            const runs = response.data.workflow_runs || [];
            const active = runs.find(
              run => run.status === "queued" || run.status === "in_progress"
            );
            if (active) {
              core.info(`Auto-cycle already active: ${active.id}`);
              return;
            }

            // GitHub cron is intentionally kept as a backup, but scheduled
            // workflows can be delayed. A completed Auto Cycle therefore wakes
            // this watchdog; after the short pacing delay above, dispatch the
            // next cycle directly when no cycle is already active.
            if (context.eventName === "workflow_run") {
              core.info("Completion-chain wake: dispatching the next Jobs Auto Cycle.");
              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id,
                ref: "main",
              });
              return;
            }

            const latest = runs[0];
            const latestTime = latest
              ? new Date(latest.updated_at || latest.created_at).getTime()
              : 0;
            const ageMinutes = latestTime
              ? (Date.now() - latestTime) / 60000
              : Number.POSITIVE_INFINITY;

            const failedConclusions = new Set([
              "failure",
              "cancelled",
              "timed_out",
              "action_required",
              "startup_failure",
            ]);
            if (latest && failedConclusions.has(latest.conclusion)) {
              if (ageMinutes < 8) {
                core.info(
                  `Latest auto-cycle failed recently; allowing a short recovery window before retry.`
                );
                return;
              }
              core.warning(
                `Latest auto-cycle concluded ${latest.conclusion}; dispatching recovery run.`
              );
            } else if (ageMinutes <= 20) {
              try {
                const queueResponse = await github.rest.repos.getContent({
                  owner, repo, path: "jobs_article_queue.json", ref: "main",
                });
                const stateResponse = await github.rest.repos.getContent({
                  owner, repo, path: "data/job_state.json", ref: "main",
                });
                const queue = JSON.parse(Buffer.from(queueResponse.data.content, "base64").toString("utf8"));
                const state = JSON.parse(Buffer.from(stateResponse.data.content, "base64").toString("utf8"));
                const publishable = (queue.articles || []).filter(article =>
                  !article.archived
                  && (article.status === "ready" || article.status === "selected")
                  && article.content_fetch_status === "success"
                  && article.job_quality_status === "publish"
                  && (!Array.isArray(article.job_quality_reasons) || article.job_quality_reasons.length === 0)
                );
                const lastPublish = state.last_publish_at ? new Date(state.last_publish_at).getTime() : 0;
                const publishAgeMinutes = lastPublish
                  ? (Date.now() - lastPublish) / 60000
                  : Number.POSITIVE_INFINITY;
                if (!(publishable.length > 0 && publishAgeMinutes > 15)) {
                  core.info(
                    `Auto-cycle healthy; last run age ${ageMinutes.toFixed(1)} minutes; `
                    + `publishable backlog=${publishable.length}.`
                  );
                  return;
                }
                core.warning(
                  `Publishable backlog stalled for ${publishAgeMinutes.toFixed(1)} minutes; dispatching recovery run.`
                );
              } catch (error) {
                core.warning(`Could not inspect durable Jobs state: ${error.message}`);
                return;
              }
            } else {
              core.warning(
                `No recent auto-cycle run for ${ageMinutes.toFixed(1)} minutes; dispatching recovery run.`
              );
            }
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id,
              ref: "main",
            });
