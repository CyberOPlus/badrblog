name: Jobs Watchdog

# Backup only: continuous auto-cycle is primary. The watchdog wakes every six
# minutes, exits immediately when a worker is alive, and restarts production
# only if the chain died or a publishable backlog is genuinely stalled.
on:
  schedule:
    - cron: "4,10,16,22,28,34,40,46,52,58 * * * *"
  workflow_dispatch:

concurrency:
  group: jobs-watchdog-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ensure auto-cycle is alive
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const workflow_id = "auto-cycle.yml";
            const response = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id,
              branch: "main",
              per_page: 10,
            });
            const runs = response.data.workflow_runs || [];
            const active = runs.find(
              run => run.status === "queued" || run.status === "in_progress"
            );
            if (active) {
              core.info(`Auto-cycle already active: ${active.id}`);
              return;
            }


            const latest = runs[0];
            const latestTime = latest
              ? new Date(latest.updated_at || latest.created_at).getTime()
              : 0;
            const ageMinutes = latestTime
              ? (Date.now() - latestTime) / 60000
              : Number.POSITIVE_INFINITY;

            const failedConclusions = new Set([
              "failure",
              "cancelled",
              "timed_out",
              "action_required",
              "startup_failure",
            ]);
            if (latest && failedConclusions.has(latest.conclusion)) {
              if (ageMinutes < 4) {
                core.info(
                  `Latest auto-cycle failed recently; allowing a short recovery window before retry.`
                );
                return;
              }
              core.warning(
                `Latest auto-cycle concluded ${latest.conclusion}; dispatching recovery run.`
              );
            } else if (ageMinutes <= 8) {
              try {
                const queueResponse = await github.rest.repos.getContent({
                  owner, repo, path: "jobs_article_queue.json", ref: "main",
                });
                const stateResponse = await github.rest.repos.getContent({
                  owner, repo, path: "data/job_state.json", ref: "main",
                });
                const aiMemoryResponse = await github.rest.repos.getContent({
                  owner, repo, path: "data/ai_provider_memory.json", ref: "main",
                });
                async function readJson(response) {
                  let encoded = response.data.content;
                  if (!encoded && response.data.sha) {
                    // Contents API omits content for files larger than 1 MB.
                    const blob = await github.rest.git.getBlob({owner, repo, file_sha: response.data.sha});
                    encoded = blob.data.content;
                  }
                  return JSON.parse(Buffer.from(encoded || "", "base64").toString("utf8"));
                }
                const queue = await readJson(queueResponse);
                const state = await readJson(stateResponse);
                const aiMemory = await readJson(aiMemoryResponse);
                const now = Date.now();
                const retryActive = article => ["ai_retry_after", "candidate_retry_after", "enrichment_retry_after"]
                  .map(field => Date.parse(article[field] || ""))
                  .some(value => Number.isFinite(value) && value > now);
                const basePublishable = (queue.articles || []).filter(article =>
                  !article.archived
                  && (article.status === "ready" || article.status === "selected")
                  && article.content_fetch_status === "success"
                  && article.job_quality_status === "publish"
                  && (!Array.isArray(article.job_quality_reasons) || article.job_quality_reasons.length === 0)
                );
                const publishable = basePublishable.filter(article => !retryActive(article));
                const staleSelected = basePublishable.filter(article => {
                  if (article.status !== "selected") return false;
                  if (article.publish_status === "published" || article.blogger_post_id) return false;
                  const selectedAt = Date.parse(article.selected_at || "");
                  return !Number.isFinite(selectedAt) || (now - selectedAt) > 30 * 60000;
                });
                const globalCircuitUntil = Number((aiMemory.global_circuit || {}).until || 0) * 1000;
                if (globalCircuitUntil > now && publishable.length > 0) {
                  core.info("Jobs health=waiting_provider; AI circuit open until " + new Date(globalCircuitUntil).toISOString() + ".");
                  return;
                }
                if (publishable.length === 0 && basePublishable.length > 0) {
                  core.info("Jobs health=waiting_candidate; " + basePublishable.length + " candidate(s) are cooling down.");
                  return;
                }
                const lastPublish = state.last_publish_at ? new Date(state.last_publish_at).getTime() : 0;
                const publishAgeMinutes = lastPublish
                  ? (Date.now() - lastPublish) / 60000
                  : Number.POSITIVE_INFINITY;
                if (!(staleSelected.length > 0 || (publishable.length > 0 && publishAgeMinutes > 15))) {
                  core.info(
                    `Auto-cycle healthy; last run age ${ageMinutes.toFixed(1)} minutes; `
                    + `publishable backlog=${publishable.length}.`
                  );
                  return;
                }
                core.warning(
                  "Jobs health=stuck; publishable=" + publishable.length
                  + "; stale_selected=" + staleSelected.length
                  + "; last publish age=" + publishAgeMinutes.toFixed(1)
                  + " minutes; dispatching recovery run."
                );
              } catch (error) {
                core.warning(`Could not inspect durable Jobs state: ${error.message}; dispatching recovery.`);
              }
            } else {
              core.warning(
                `No recent auto-cycle run for ${ageMinutes.toFixed(1)} minutes; dispatching recovery run.`
              );
            }
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id,
              ref: "main",
            });
