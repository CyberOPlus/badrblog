name: Temporary Live Jobs Test

on:
  push:
    paths:
      - ".github/workflows/live-jobs-smoke-test.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  live-jobs-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
      BLOGGER_CLIENT_SECRET_JSON: ${{ secrets.BLOGGER_CLIENT_SECRET_JSON }}
      BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install -r requirements.txt -q

      - name: Prepare temporary runtime
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          required = [
              "BLOGGER_BLOG_ID","BLOGGER_CLIENT_SECRET_JSON","BLOGGER_TOKEN_JSON",
              "FACEBOOK_PAGE_ID","FACEBOOK_PAGE_ACCESS_TOKEN",
          ]
          missing=[x for x in required if not os.environ.get(x,"").strip()]
          if not (os.environ.get("GEMINI_API_KEY","").strip() or os.environ.get("OPENROUTER_API_KEY","").strip()):
              missing.append("GEMINI_API_KEY or OPENROUTER_API_KEY")
          if missing:
              raise SystemExit("Missing secrets: " + ", ".join(missing))

          for name in required + ["GEMINI_API_KEY","OPENROUTER_API_KEY"]:
              value=os.environ.get(name,"")
              if value:
                  print(f"::add-mask::{value}")

          json.loads(os.environ["BLOGGER_CLIENT_SECRET_JSON"])
          json.loads(os.environ["BLOGGER_TOKEN_JSON"])
          Path("data").mkdir(exist_ok=True)
          Path("client_secret.json").write_text(os.environ["BLOGGER_CLIENT_SECRET_JSON"], encoding="utf-8")
          Path("data/token.json").write_text(os.environ["BLOGGER_TOKEN_JSON"], encoding="utf-8")

          env = {
              "JOBS_MODE":"true",
              "JOBS_TEST_MODE":"false",
              "JOBS_TIMEZONE":"Africa/Casablanca",
              "JOBS_MIN_SELECTION_SCORE":"65",
              "JOBS_QUEUE_SCORE":"50",
              "GEMINI_API_KEY":os.environ.get("GEMINI_API_KEY",""),
              "GEMINI_MODEL":"gemini-2.5-flash",
              "OPENROUTER_API_KEY":os.environ.get("OPENROUTER_API_KEY",""),
              "OPENROUTER_MODEL":"openrouter/free",
              "OPENROUTER_MODELS":"qwen/qwen3.8-27b:free,openrouter/free",
              "OPENROUTER_APP_NAME":"Jobs Temporary Test",
              "BLOG_ID":os.environ["BLOGGER_BLOG_ID"],
              "PUBLISH_MODE":"live",
              "SAFE_MODE":"false",
              "BLOGGER_LIVE_ENABLED":"true",
              "FACEBOOK_AUTO_POST":"false",
              "FACEBOOK_PAGE_ID":os.environ["FACEBOOK_PAGE_ID"],
              "FACEBOOK_PAGE_ACCESS_TOKEN":os.environ["FACEBOOK_PAGE_ACCESS_TOKEN"],
              "META_GRAPH_API_VERSION":"v26.0",
              "FACEBOOK_LINK_MODE":"comment",
              "MAX_FACEBOOK_POSTS_PER_DAY":"2",
              "FACEBOOK_HARD_MAX_POSTS_PER_DAY":"3",
              "FACEBOOK_SAFETY_MIN_INTERVAL_MINUTES":"45",
              "MIN_MINUTES_BETWEEN_FACEBOOK_POSTS":"0",
              "FAST_NEWS_MODE":"false",
              "CATEGORY_ROTATION_MODE":"false",
              "PROCESS_FULL_CATEGORY_PER_RUN":"false",
              "FRESH_QUEUE_MODE":"false",
              "FIRST_VALID_ARTICLE_MODE":"false",
              "RECENT_NEWS_ONLY":"false",
              "ALLOW_UNKNOWN_DATE_IN_FAST_MODE":"true",
              "MAX_POSTS_PER_RUN":"1",
              "MAX_ARTICLES_PER_RUN":"1",
              "SAFE_CYCLE_MAX_ARTICLES":"1",
              "SAFE_CYCLE_DRAFT_ONLY":"false",
              "MAX_SOURCES_PER_RUN":"20",
              "PUBLISH_WEAK_ARTICLES":"true",
              "ALLOW_SHORT_ARTICLES":"true",
              "MIN_ARTICLE_WORDS":"100",
              "TARGET_ARTICLE_WORDS":"120-220",
              "MIN_EXTRACTED_CHARS":"80",
              "MAX_SOURCE_RETRIES":"0",
              "SOURCE_RETRY_DELAY_SECONDS":"0",
              "SOURCE_TIMEOUT_SECONDS":"6",
              "ARTICLE_TIMEOUT_SECONDS":"8",
              "AI_TOTAL_TIME_BUDGET_SECONDS":"180",
              "GEMINI_TIMEOUT_SECONDS":"50",
              "AI_MODEL_TIMEOUT_SECONDS":"45",
              "OPENROUTER_TIMEOUT_SECONDS":"45",
              "MAX_AI_RETRIES":"3",
              "DUPLICATE_PROTECTION":"true",
              "QUEUE_PERSIST":"true",
              "SOURCE_HEALTH_ENABLED":"true",
              "ENABLE_SCRAPLING_FALLBACK":"false",
              "MAX_DRAFTS_PER_DAY":"20",
              "MIN_MINUTES_BETWEEN_DRAFTS":"0",
              "MAX_LIVE_POSTS_PER_DAY":"20",
              "TARGET_LIVE_POSTS_PER_DAY":"20",
              "MIN_MINUTES_BETWEEN_LIVE_POSTS":"0",
              "AI_PROVIDER":"auto",
              "LOCAL_PUBLISH_FALLBACK":"false",
              "JOBS_RUNTIME_PERSIST_BY_WORKFLOW":"true",
          }
          Path(".env").write_text("\n".join(f"{k}={v}" for k,v in env.items())+"\n",encoding="utf-8")
          Path("/tmp/live_jobs_test_results.json").write_text(json.dumps({"blogger":[],"facebook_attempts":[],"facebook_created":[]},ensure_ascii=False),encoding="utf-8")
          PY

      - name: Publish three temporary Blogger job articles
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          import main
          import job_core
          from article_queue import load_article_queue

          results_path=Path("/tmp/live_jobs_test_results.json")

          # Test-only selector: never update an existing campaign/post. Only brand-new
          # verified candidates may be used, so cleanup can safely delete created IDs.
          def select_new_only(queue, now=None):
              now = now or datetime.now(timezone.utc)
              ranked=[]
              for article in queue.get("articles", []):
                  if article.get("archived") or article.get("status") not in {"ready","selected"}:
                      continue
                  if article.get("content_fetch_status") != "success":
                      continue
                  try:
                      quality, decision = job_core.prepare_job_candidate(article, now=now)
                  except Exception:
                      continue
                  if decision.get("action") not in {"new","new_campaign"}:
                      continue
                  if not quality.get("passed"):
                      continue
                  urgency=article.get("job_urgency") or {}
                  priority=2 if urgency.get("level") in {"critical","high"} else 1 if urgency.get("level")=="elevated" else 0
                  ranked.append((int(quality.get("score") or 0),priority,article.get("source_published_at") or "",article))
              ranked.sort(key=lambda row:(row[0],row[1],row[2]),reverse=True)
              return ranked[0][3] if ranked else None

          main.select_best_job_from_queue = select_new_only

          made=[]
          seen=set()
          for attempt in range(1,7):
              print(f"\n=== BLOGGER TEMP TEST CYCLE {attempt}/6 ===", flush=True)
              try:
                  result=main.run_safe_cycle_only()
              except Exception as e:
                  print(f"cycle_exception={type(e).__name__}:{str(e)[:200]}")
                  continue
              article=(result or {}).get("article") or {}
              post_id=str(article.get("blogger_post_id") or "").strip()
              action=str((result or {}).get("draft_action") or "")
              if action=="created" and post_id and post_id not in seen:
                  seen.add(post_id)
                  item={
                      "id":article.get("id",""),
                      "title":article.get("seo_title") or article.get("title") or article.get("job_title") or "",
                      "company":article.get("job_company",""),
                      "job_title":article.get("job_title",""),
                      "blogger_post_id":post_id,
                      "blogger_post_url":article.get("blogger_post_url",""),
                      "source_url":article.get("url") or article.get("source_url") or "",
                      "cover_path":article.get("job_article_cover_path") or "",
                  }
                  made.append(item)
                  data=json.loads(results_path.read_text(encoding="utf-8"))
                  data["blogger"]=made
                  results_path.write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding="utf-8")
                  print("TEMP_BLOGGER_CREATED="+json.dumps(item,ensure_ascii=False))
              elif action=="updated":
                  print("TEMP_BLOGGER_REFUSED_UPDATE=existing post was not recorded for cleanup")
              if len(made)>=3:
                  break

          print(f"TEMP_BLOGGER_CREATED_COUNT={len(made)}")
          if len(made)<2:
              raise SystemExit("Could not create at least two distinct temporary Blogger job articles.")
          PY

      - name: Try Facebook delivery for the temporary jobs with real safety limits
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import facebook_publisher as fb
          from article_queue import load_article_queue, save_article_queue

          path=Path("/tmp/live_jobs_test_results.json")
          data=json.loads(path.read_text(encoding="utf-8"))
          created=data.get("blogger",[])
          fb.FACEBOOK_AUTO_POST=True

          # Make the test eligible immediately for a slot check, but do NOT bypass
          # the daily cap or 45-minute safety interval.
          queue=load_article_queue()
          ids={x.get("id") for x in created if x.get("id")}
          for article in queue.get("articles",[]):
              if article.get("id") in ids:
                  article["job_publish_immediately"]=True
          save_article_queue(queue)

          attempts=[]
          fb_created=[]
          for item in created[:3]:
              aid=item.get("id")
              if not aid:
                  continue
              result=fb.post_one_article_to_facebook(target_article_id=aid,respect_limits=True)
              article=(result or {}).get("article") or {}
              row={
                  "article_id":aid,
                  "title":item.get("title",""),
                  "posted":bool(result.get("posted")),
                  "error":str(result.get("error") or ""),
                  "facebook_post_id":str(article.get("facebook_post_id") or ""),
                  "facebook_comment_id":str(article.get("facebook_comment_id") or ""),
              }
              attempts.append(row)
              if row["facebook_post_id"]:
                  fb_created.append(row)
              print("TEMP_FACEBOOK_ATTEMPT="+json.dumps(row,ensure_ascii=False))

          data["facebook_attempts"]=attempts
          data["facebook_created"]=fb_created
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding="utf-8")
          print(f"TEMP_FACEBOOK_CREATED_COUNT={len(fb_created)}")
          PY

      - name: Show test result before cleanup
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/live_jobs_test_results.json ]; then
            cat /tmp/live_jobs_test_results.json
          fi

      - name: Delete all temporary Facebook and Blogger content
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import requests

          path=Path("/tmp/live_jobs_test_results.json")
          data=json.loads(path.read_text(encoding="utf-8")) if path.exists() else {"blogger":[],"facebook_created":[]}
          cleanup={"facebook":[],"blogger":[]}

          token=os.environ.get("FACEBOOK_PAGE_ACCESS_TOKEN","").strip()
          version="v26.0"
          for row in data.get("facebook_created",[]):
              pid=str(row.get("facebook_post_id") or "").strip()
              if not pid:
                  continue
              try:
                  resp=requests.delete(f"https://graph.facebook.com/{version}/{pid}",params={"access_token":token},timeout=30)
                  ok=resp.ok and bool((resp.json() if resp.content else {}).get("success",True))
                  cleanup["facebook"].append({"id":pid,"deleted":ok,"http":resp.status_code})
                  print(f"FACEBOOK_DELETE id={pid} deleted={ok} http={resp.status_code}")
              except Exception as e:
                  cleanup["facebook"].append({"id":pid,"deleted":False,"error":type(e).__name__})
                  print(f"FACEBOOK_DELETE id={pid} deleted=False error={type(e).__name__}")

          # Delete Blogger only after social content is gone.
          try:
              from blogger_client import get_credentials, create_blogger_service, is_local_publisher
              creds=get_credentials()
              service=create_blogger_service(creds)
              if not service or is_local_publisher(service):
                  raise RuntimeError("Blogger service unavailable")
              blog_id=os.environ["BLOGGER_BLOG_ID"]
              for row in data.get("blogger",[]):
                  pid=str(row.get("blogger_post_id") or "").strip()
                  if not pid:
                      continue
                  try:
                      service.posts().delete(blogId=blog_id,postId=pid).execute()
                      cleanup["blogger"].append({"id":pid,"deleted":True})
                      print(f"BLOGGER_DELETE id={pid} deleted=True")
                  except Exception as e:
                      cleanup["blogger"].append({"id":pid,"deleted":False,"error":type(e).__name__+":"+str(e)[:160]})
                      print(f"BLOGGER_DELETE id={pid} deleted=False error={type(e).__name__}:{str(e)[:160]}")
          except Exception as e:
              print("BLOGGER_CLEANUP_SETUP_ERROR="+type(e).__name__+":"+str(e)[:180])

          # Remove only job-cover files created by this temporary test.
          cover_paths=[str(x.get("cover_path") or "").strip() for x in data.get("blogger",[]) if str(x.get("cover_path") or "").strip()]
          if cover_paths:
              import subprocess
              subprocess.run(["git","config","user.name","github-actions[bot]"],check=False)
              subprocess.run(["git","config","user.email","41898282+github-actions[bot]@users.noreply.github.com"],check=False)
              subprocess.run(["git","pull","--rebase","origin","main"],check=False)
              for cover in cover_paths:
                  subprocess.run(["git","rm","-f","--ignore-unmatch","--",cover],check=False)
              diff=subprocess.run(["git","diff","--cached","--quiet"],check=False)
              if diff.returncode != 0:
                  subprocess.run(["git","commit","-m","test: remove temporary job covers [skip ci]"],check=True)
                  push=subprocess.run(["git","push","origin","HEAD:main"],check=False,capture_output=True,text=True)
                  print("COVER_CLEANUP_PUSH="+("success" if push.returncode==0 else "failed"))
                  if push.returncode != 0:
                      print((push.stderr or push.stdout or "")[:300])

          Path("/tmp/live_jobs_cleanup.json").write_text(json.dumps(cleanup,ensure_ascii=False,indent=2),encoding="utf-8")
          print("=== CLEANUP SUMMARY ===")
          print(json.dumps(cleanup,ensure_ascii=False,indent=2))

          # Fail only when something that we know was created could not be deleted.
          failures=[x for x in cleanup["facebook"]+cleanup["blogger"] if not x.get("deleted")]
          if failures:
              raise SystemExit("Cleanup incomplete for one or more known temporary remote objects.")
          PY

      - name: Remove local credentials
        if: always()
        run: rm -f .env client_secret.json data/token.json
