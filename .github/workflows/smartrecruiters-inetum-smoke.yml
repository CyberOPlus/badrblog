name: SmartRecruiters Inetum Smoke

on:
  push:
    branches:
      - jobs-smartrecruiters-inetum-smoke-20261001

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe public Inetum Morocco postings and details
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request
          from datetime import datetime, timedelta, timezone

          base = "https://api.smartrecruiters.com/v1/companies/Inetum2/postings"
          headers = {
              "Accept": "application/json; charset=utf-8",
              "User-Agent": "CyberoPlus-Jobs-Source-Smoke/1.0",
          }

          def get_json(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=20) as response:
                  return response.status, json.loads(response.read().decode("utf-8"))

          country_url = base + "?" + urllib.parse.urlencode({
              "limit": 10,
              "offset": 0,
              "destination": "PUBLIC",
              "country": "ma",
          })
          status, payload = get_json(country_url)
          rows = payload.get("content") or []
          assert status == 200
          assert rows, "Inetum2 country=ma returned no public Morocco postings"

          first = rows[0]
          posting_id = first.get("id")
          assert posting_id
          detail_status, detail = get_json(base + "/" + urllib.parse.quote(str(posting_id)))
          assert detail_status == 200
          assert detail.get("releasedDate"), "Morocco detail missing releasedDate"

          released_after = (
              datetime.now(timezone.utc) - timedelta(hours=12)
          ).isoformat(timespec="milliseconds").replace("+00:00", "Z")
          fresh_url = base + "?" + urllib.parse.urlencode({
              "limit": 100,
              "offset": 0,
              "destination": "PUBLIC",
              "country": "ma",
              "releasedAfter": released_after,
          })
          fresh_status, fresh = get_json(fresh_url)
          assert fresh_status == 200
          for row in fresh.get("content") or []:
              assert row.get("releasedDate"), "Fresh Morocco posting missing releasedDate"

          print(json.dumps({
              "country_http_status": status,
              "country_total_found": payload.get("totalFound"),
              "country_returned": len(rows),
              "morocco_sample": [
                  {
                      "id": row.get("id"),
                      "name": row.get("name"),
                      "releasedDate": row.get("releasedDate"),
                      "refNumber": row.get("refNumber"),
                      "location": row.get("location"),
                      "ref": row.get("ref"),
                  }
                  for row in rows[:5]
              ],
              "detail": {
                  "id": detail.get("id"),
                  "name": detail.get("name"),
                  "releasedDate": detail.get("releasedDate"),
                  "refNumber": detail.get("refNumber"),
                  "location": detail.get("location"),
                  "typeOfEmployment": detail.get("typeOfEmployment"),
                  "experienceLevel": detail.get("experienceLevel"),
                  "applyUrl": detail.get("applyUrl"),
                  "ref": detail.get("ref"),
                  "jobAd_keys": sorted((detail.get("jobAd") or {}).keys()),
              },
              "fresh_released_after": released_after,
              "fresh_total_found": fresh.get("totalFound"),
              "fresh_returned": len(fresh.get("content") or []),
          }, ensure_ascii=False, indent=2))
          PY
