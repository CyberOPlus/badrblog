name: Jobs Source Discovery Audit
# targeted ONDA / ONCF / ADM pass

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/source-fetch-diagnostic.yml"

jobs:
  audit:
    if: contains(github.event.head_commit.message, '[source-discovery-audit]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Audit enabled Jobs sources only
        env:
          JOBS_MODE: "true"
          FAST_NEWS_MODE: "false"
          FIRST_VALID_ARTICLE_MODE: "false"
          SOURCE_TIMEOUT_SECONDS: "12"
          MAX_SOURCE_RETRIES: "0"
          ENABLE_SCRAPLING_FALLBACK: "false"
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import requests
          from article_queue import load_sources
          from scraper import discover_latest_article_links

          sources = load_sources()
          enabled = [s for s in sources if s.get("enabled", True)]
          result = discover_latest_article_links(enabled)
          rows = []
          for row in result.get("source_results", []):
              rows.append({
                  "name": row.get("source_name"),
                  "url": row.get("base_url"),
                  "status": row.get("status"),
                  "http": row.get("listing_status_code"),
                  "links": row.get("links_found"),
                  "method": row.get("method_used"),
                  "error": row.get("error"),
              })
          print("=== SOURCE_RESULTS ===")
          print(json.dumps(rows, ensure_ascii=False, indent=2))
          print("=== COUNTS ===")
          print(json.dumps({
              "checked": len(rows),
              "failed": sum(1 for x in rows if x["status"] == "failed"),
              "zero_links": sum(1 for x in rows if x["status"] != "failed" and not x["links"]),
              "with_links": sum(1 for x in rows if x["links"]),
              "articles": len(result.get("articles") or []),
          }, ensure_ascii=False, indent=2))

          probes = {}
          for name,url in {
              "OCP_WORKDAY":"https://ocpgroup.wd103.myworkdayjobs.com/en-US/ocpcareers",
              "ATTIJARI_ERECRUIT":"https://recrutement.attijariwafa.com/",
          }.items():
              try:
                  r=requests.get(url, timeout=12, headers={"User-Agent":"Mozilla/5.0"}, allow_redirects=True)
                  probes[name]={"status":r.status_code,"url":r.url,"chars":len(r.text)}
              except Exception as e:
                  probes[name]={"error":f"{type(e).__name__}: {e}"}

          # Workday exposes a public jobs endpoint used by its own careers UI.
          try:
              endpoint="https://ocpgroup.wd103.myworkdayjobs.com/wday/cxs/ocpgroup/ocpcareers/jobs"
              r=requests.post(
                  endpoint,
                  json={"appliedFacets":{},"limit":20,"offset":0,"searchText":""},
                  timeout=12,
                  headers={"User-Agent":"Mozilla/5.0","Content-Type":"application/json"},
              )
              payload=r.json() if r.ok else {}
              probes["OCP_WORKDAY_JOBS"]={
                  "status":r.status_code,
                  "chars":len(r.text),
                  "total":payload.get("total"),
                  "jobs":len(payload.get("jobPostings") or []),
              }
          except Exception as e:
              probes["OCP_WORKDAY_JOBS"]={"error":f"{type(e).__name__}: {e}"}

          # Inspect only public bootstrap metadata needed to build stable source adapters.
          try:
              endpoint="https://ocpgroup.wd103.myworkdayjobs.com/wday/cxs/ocpgroup/ocpcareers/jobs"
              wr=requests.post(
                  endpoint,
                  json={"appliedFacets":{},"limit":20,"offset":0,"searchText":""},
                  timeout=12,
                  headers={"User-Agent":"Mozilla/5.0","Content-Type":"application/json"},
              )
              wp=wr.json() if wr.ok else {}
              probes["OCP_FIRST_JOB"]=(wp.get("jobPostings") or [None])[0]
          except Exception as e:
              probes["OCP_FIRST_JOB"]={"error":f"{type(e).__name__}: {e}"}

          try:
              cr=requests.get(
                  "https://recrutement.attijariwafa.com/",
                  timeout=12,
                  headers={"User-Agent":"Mozilla/5.0"},
                  allow_redirects=True,
              )
              text=cr.text
              needles=("jobdetails","jobsearch","services/api","requisition","careersite")
              probes["ATTIJARI_BOOTSTRAP"]={
                  "url":cr.url,
                  "matches":{
                      needle:[
                          text[max(0,i-120):i+260].replace("\n"," ")
                          for i in [text.lower().find(needle)]
                          if i>=0
                      ][:1]
                      for needle in needles
                  },
              }
          except Exception as e:
              probes["ATTIJARI_BOOTSTRAP"]={"error":f"{type(e).__name__}: {e}"}

          print("=== ALTERNATIVE_OFFICIAL_PROBES ===")
          print(json.dumps(probes, ensure_ascii=False, indent=2))
          PY
