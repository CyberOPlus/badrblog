<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 770" role="img" aria-labelledby="t d">
<title id="t">Comment utiliser un code Muse AI</title><desc id="d">Quatre étapes : rejoindre Muse, ouvrir les paramètres, saisir DFFSDP ou NLQPB2, puis vérifier la confirmation et le solde de tokens.</desc>
<rect width="1200" height="770" fill="#fff"/><rect width="1200" height="770" fill="url(#h)" opacity=".42"/><pattern id="h" width="48" height="42" patternUnits="userSpaceOnUse"><path d="M12 1L36 1L48 21L36 41L12 41L0 21Z" fill="none" stroke="#e6ebf0" stroke-width="1"/></pattern>
<text x="64" y="101" font-family="Arial,sans-serif" font-size="48" font-weight="800" fill="#172b44">Activer un code Muse AI</text>
<text x="64" y="151" font-family="Arial,sans-serif" font-size="26" fill="#4b627c">Le parcours peut varier selon la version Web ou mobile.</text>
<path d="M64 190H1135" stroke="#d7e2ef" stroke-width="2"/>
<g font-family="Arial,sans-serif">
<circle cx="115" cy="271" r="39" fill="#2563c7"/><text x="103" y="284" font-size="38" font-weight="700" fill="#fff">1</text><text x="192" y="261" font-size="33" font-weight="700" fill="#172b44">Créer votre compte</text><text x="192" y="303" font-size="24" fill="#546a7d">Passer par le site ou l'application officielle de Muse.</text>
<path d="M115 321V364" stroke="#b4c3d5" stroke-width="4"/>
<circle cx="115" cy="403" r="39" fill="#2563c7"/><text x="103" y="416" font-size="38" font-weight="700" fill="#fff">2</text><text x="192" y="393" font-size="33" font-weight="700" fill="#172b44">Ouvrir Settings</text><text x="192" y="435" font-size="24" fill="#546a7d">Rechercher « Redeem invite code » ou « Redeem token ».</text>
<path d="M115 453V496" stroke="#b4c3d5" stroke-width="4"/>
<circle cx="115" cy="535" r="39" fill="#07877c"/><text x="103" y="548" font-size="38" font-weight="700" fill="#fff">3</text><text x="192" y="525" font-size="33" font-weight="700" fill="#172b44">Saisir un seul code</text><text x="192" y="567" font-size="26" font-weight="700" fill="#087b72">DFFSDP ou NLQPB2 • dans les 48 heures</text>
<path d="M115 585V628" stroke="#b4c3d5" stroke-width="4"/>
<circle cx="115" cy="665" r="39" fill="#07877c"/><text x="103" y="678" font-size="38" font-weight="700" fill="#fff">4</text><text x="192" y="651" font-size="33" font-weight="700" fill="#172b44">Vérifier la confirmation</text><text x="192" y="695" font-size="24" fill="#546a7d">La récompense dépend des conditions du programme.</text>
</g><text x="64" y="751" font-family="Arial,sans-serif" font-size="18" fill="#66788e">Illustration pédagogique Cybero Plus — pas une capture de l'application.</text>
</svg>